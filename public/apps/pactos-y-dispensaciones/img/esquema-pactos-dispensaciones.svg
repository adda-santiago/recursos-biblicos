<text x="643.2" y="250" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="bold">Ley</text>
<rect x="785.6" y="200" width="212.0" height="90" rx="8" fill="#f6dcd8" stroke="#b03a2e" stroke-width="2"/>
<text x="891.6" y="250" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="bold">Gracia</text>
<rect x="1001.6" y="200" width="136.39999999999998" height="90" rx="8" fill="#dde8f3" stroke="#2a6fb0" stroke-width="2"/>
<text x="1069.8" y="250" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="bold">Reino</text>
<text x="60" y="180" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="start" font-weight="bold">Dispensaciones</text>
