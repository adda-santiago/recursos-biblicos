<text x="783.6" y="324" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9e2b25" text-anchor="middle" font-weight="bold">la cruz y Pentecostés</text>
<text x="60" y="372" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="start" font-weight="bold">Pactos</text>
<rect x="254" y="392" width="886" height="22" rx="11" fill="#1e8a8a" opacity=".85"/>
<circle cx="254" cy="403" r="11" fill="#1e8a8a"/>
<text x="240" y="409" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e8a8a" text-anchor="end" font-weight="bold">Noé</text>
<text x="1128" y="409" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="end" font-weight="normal">vigente mientras la tierra permanezca</text>
<rect x="341" y="442" width="799" height="22" rx="11" fill="#c08a1e" opacity=".85"/>
<circle cx="341" cy="453" r="11" fill="#c08a1e"/>
<text x="327" y="459" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#c08a1e" text-anchor="end" font-weight="bold">Abraham</text>
<text x="1128" y="459" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="end" font-weight="normal">vigente; se cumple en Cristo y en el reino</text>
<rect x="503" y="492" width="281" height="22" rx="11" fill="#4a4a4a" opacity=".85"/>
<circle cx="503" cy="503" r="11" fill="#4a4a4a"/>
<text x="489" y="509" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4a4a4a" text-anchor="end" font-weight="bold">Sinaí</text>
<text x="772" y="509" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="end" font-weight="normal">termina con la cruz</text>
<rect x="533" y="542" width="607" height="22" rx="11" fill="#2f7d4a" opacity=".85"/>
<circle cx="533" cy="553" r="11" fill="#2f7d4a"/>
<text x="519" y="559" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f7d4a" text-anchor="end" font-weight="bold">La tierra</text>
<text x="1128" y="559" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="end" font-weight="normal">espera su cumplimiento pleno</text>
<rect x="763" y="592" width="377" height="22" rx="11" fill="#7a3fa0" opacity=".85"/>
<circle cx="763" cy="603" r="11" fill="#7a3fa0"/>
<text x="749" y="609" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7a3fa0" text-anchor="end" font-weight="bold">David</text>
<text x="1128" y="609" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="end" font-weight="normal">Cristo reina; reinará visiblemente</text>
<rect x="784" y="642" width="356" height="22" rx="11" fill="#b03a2e" opacity=".85"/>
<circle cx="784" cy="653" r="11" fill="#b03a2e"/>
<text x="683" y="659" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#b03a2e" text-anchor="end" font-weight="bold">Nuevo pacto</text>
<text x="1128" y="659" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="end" font-weight="normal">la iglesia participa; Israel lo recibirá</text>
<line x1="705" y1="653" x2="784" y2="653" stroke="#b03a2e" stroke-width="3" stroke-dasharray="6 5"/>
<circle cx="705" cy="653" r="8" fill="#fff" stroke="#b03a2e" stroke-width="3"/>
<text x="705" y="686" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#b03a2e" text-anchor="middle" font-weight="normal" font-style="italic">anunciado (Jer 31)</text>
<text x="600" y="735" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">«de reunir todas las cosas en Cristo, en la dispensación del cumplimiento de los tiempos» (Ef 1:10)</text>
</svg>