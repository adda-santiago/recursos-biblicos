<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Las siete dispensaciones</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">En cada etapa: una responsabilidad, un fracaso, un juicio… y la gracia de Dios</text>
<rect x="60" y="470" width="152" height="130" rx="10" fill="#d9eded" stroke="#1e8a8a" stroke-width="2"/>
<rect x="60" y="470" width="152" height="10" rx="5" fill="#1e8a8a"/>
<text x="136.0" y="510" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1e8a8a" text-anchor="middle" font-weight="bold">1</text>
<text x="136.0" y="542" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">Inocencia</text>
<text x="136.0" y="578" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 1–3</text>
<rect x="216" y="426" width="152" height="174" rx="10" fill="#e3e0f0" stroke="#7a3fa0" stroke-width="2"/>
<rect x="216" y="426" width="152" height="10" rx="5" fill="#7a3fa0"/>
<text x="292.0" y="466" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#7a3fa0" text-anchor="middle" font-weight="bold">2</text>
<text x="292.0" y="498" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">Conciencia</text>
<text x="292.0" y="534" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 4–8</text>
<rect x="372" y="382" width="152" height="218" rx="10" fill="#e0eee4" stroke="#2f7d4a" stroke-width="2"/>
<rect x="372" y="382" width="152" height="10" rx="5" fill="#2f7d4a"/>
<text x="448.0" y="422" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2f7d4a" text-anchor="middle" font-weight="bold">3</text>
<text x="448.0" y="448" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">Gobierno</text>
<text x="448.0" y="468" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">humano</text>
<text x="448.0" y="490" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 9–11</text>
<rect x="528" y="338" width="152" height="262" rx="10" fill="#f3e7c9" stroke="#c08a1e" stroke-width="2"/>
<rect x="528" y="338" width="152" height="10" rx="5" fill="#c08a1e"/>
<text x="604.0" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#c08a1e" text-anchor="middle" font-weight="bold">4</text>
<text x="604.0" y="410" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">Promesa</text>
<text x="604.0" y="446" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 12 – Éx 19</text>
<rect x="684" y="294" width="152" height="306" rx="10" fill="#e6e6e4" stroke="#4a4a4a" stroke-width="2"/>
<rect x="684" y="294" width="152" height="10" rx="5" fill="#4a4a4a"/>
<text x="760.0" y="334" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#4a4a4a" text-anchor="middle" font-weight="bold">5</text>
<text x="760.0" y="366" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">Ley</text>
<text x="760.0" y="402" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Éx 20 – Hch 1</text>
<rect x="840" y="250" width="152" height="350" rx="10" fill="#f6dcd8" stroke="#b03a2e" stroke-width="2"/>
<rect x="840" y="250" width="152" height="10" rx="5" fill="#b03a2e"/>
<text x="916.0" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#b03a2e" text-anchor="middle" font-weight="bold">6</text>
<text x="916.0" y="316" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">Gracia</text>
<text x="916.0" y="336" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">(iglesia)</text>
<text x="916.0" y="358" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Hch 2 – Ap 3</text>
<rect x="996" y="206" width="152" height="394" rx="10" fill="#dde8f3" stroke="#2a6fb0" stroke-width="2"/>
<rect x="996" y="206" width="152" height="10" rx="5" fill="#2a6fb0"/>
<text x="1072.0" y="246" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2a6fb0" text-anchor="middle" font-weight="bold">7</text>
<text x="1072.0" y="278" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">Reino</text>
<text x="1072.0" y="314" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Ap 20</text>
<text x="136.0" y="632" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2430" text-anchor="middle" font-weight="normal">no comer del árbol</text>
<text x="292.0" y="632" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2430" text-anchor="middle" font-weight="normal">hacer el bien</text>
<text x="448.0" y="632" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2430" text-anchor="middle" font-weight="normal">llenar la tierra, juzgar</text>
<text x="604.0" y="632" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2430" text-anchor="middle" font-weight="normal">creer la promesa</text>
<text x="760.0" y="632" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2430" text-anchor="middle" font-weight="normal">guardar el pacto del Sinaí</text>
<text x="916.0" y="632" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2430" text-anchor="middle" font-weight="normal">creer en Cristo</text>
<text x="1072.0" y="632" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2430" text-anchor="middle" font-weight="normal">obedecer al Rey</text>
<text x="136.0" y="662" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b03a2e" text-anchor="middle" font-weight="normal">la desobediencia</text>
<text x="292.0" y="662" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b03a2e" text-anchor="middle" font-weight="normal">maldad continua</text>
<text x="448.0" y="662" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b03a2e" text-anchor="middle" font-weight="normal">Babel</text>
<text x="604.0" y="662" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b03a2e" text-anchor="middle" font-weight="normal">bajar a Egipto</text>
<text x="760.0" y="662" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b03a2e" text-anchor="middle" font-weight="normal">idolatría; rechazo del Mesías</text>
<text x="916.0" y="662" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b03a2e" text-anchor="middle" font-weight="normal">apostasía final</text>
<text x="1072.0" y="662" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b03a2e" text-anchor="middle" font-weight="normal">la última rebelión</text>
<text x="136.0" y="692" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4a4a4a" text-anchor="middle" font-weight="normal">expulsión del Edén</text>
<text x="292.0" y="692" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4a4a4a" text-anchor="middle" font-weight="normal">el diluvio</text>
<text x="448.0" y="692" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4a4a4a" text-anchor="middle" font-weight="normal">confusión de lenguas</text>
<text x="604.0" y="692" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4a4a4a" text-anchor="middle" font-weight="normal">esclavitud</text>
<text x="760.0" y="692" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4a4a4a" text-anchor="middle" font-weight="normal">exilio; año 70</text>
<text x="916.0" y="692" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4a4a4a" text-anchor="middle" font-weight="normal">la tribulación</text>
<text x="1072.0" y="692" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4a4a4a" text-anchor="middle" font-weight="normal">el gran trono blanco</text>
<text x="44" y="632" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">resp.</text>
<text x="44" y="662" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">fracaso</text>
<text x="44" y="692" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">juicio</text>
<line x1="70" y1="160" x2="1113" y2="160" stroke="#9e2b25" stroke-width="5" stroke-linecap="round"/>
<polygon points="1130,160 1113,174 1113,146" fill="#9e2b25"/>
<text x="600" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#9e2b25" text-anchor="middle" font-weight="normal" font-style="italic">La gracia de Dios atraviesa todas las etapas: la salvación siempre es por gracia, mediante la fe</text>
<text x="600" y="735" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Los nombres y el número varían según los maestros; las dispensaciones son una herramienta para leer la Biblia.</text>
</svg>