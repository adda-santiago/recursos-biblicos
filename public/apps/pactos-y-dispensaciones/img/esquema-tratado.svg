<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Un tratado antiguo y el pacto del Sinaí</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Las partes de un tratado de vasallaje y dónde aparecen en Éxodo y Deuteronomio</text>
<text x="265" y="148" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="bold">En un tratado antiguo</text>
<text x="830" y="148" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="bold">En el pacto del Sinaí</text>
<rect x="60" y="168" width="410" height="72" rx="10" fill="#fff" stroke="#4a4a4a" stroke-width="2"/>
<circle cx="98" cy="204" r="20" fill="#4a4a4a"/>
<text x="98" y="211" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<text x="132" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430" text-anchor="start" font-weight="bold">Preámbulo</text>
<text x="132" y="225" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="normal">Quién es el gran rey</text>
<line x1="480" y1="204" x2="538" y2="204" stroke="#c08a1e" stroke-width="3" stroke-linecap="round"/>
<polygon points="550,204 538,214 538,194" fill="#c08a1e"/>
<rect x="560" y="168" width="580" height="72" rx="10" fill="#f3e7c9" stroke="#c08a1e" stroke-width="2"/>
<text x="584" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">«Yo soy Jehová tu Dios»</text>
<text x="584" y="225" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8a5a2b" text-anchor="start" font-weight="normal" font-style="italic">Éx 20:2a; Dt 1:1-5</text>
<rect x="60" y="256" width="410" height="72" rx="10" fill="#fff" stroke="#4a4a4a" stroke-width="2"/>
<circle cx="98" cy="292" r="20" fill="#4a4a4a"/>
<text x="98" y="299" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<text x="132" y="288" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430" text-anchor="start" font-weight="bold">Prólogo histórico</text>
<text x="132" y="313" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="normal">Lo que el rey ya hizo</text>
<line x1="480" y1="292" x2="538" y2="292" stroke="#c08a1e" stroke-width="3" stroke-linecap="round"/>
<polygon points="550,292 538,302 538,282" fill="#c08a1e"/>
<rect x="560" y="256" width="580" height="72" rx="10" fill="#f3e7c9" stroke="#c08a1e" stroke-width="2"/>
<text x="584" y="288" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">«que te saqué de la tierra de Egipto»</text>
<text x="584" y="313" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8a5a2b" text-anchor="start" font-weight="normal" font-style="italic">Éx 20:2b; Dt 1–4</text>
<rect x="60" y="344" width="410" height="72" rx="10" fill="#fff" stroke="#4a4a4a" stroke-width="2"/>
<circle cx="98" cy="380" r="20" fill="#4a4a4a"/>
<text x="98" y="387" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<text x="132" y="376" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430" text-anchor="start" font-weight="bold">Obligaciones</text>
<text x="132" y="401" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="normal">Lealtad exclusiva y leyes</text>
<line x1="480" y1="380" x2="538" y2="380" stroke="#c08a1e" stroke-width="3" stroke-linecap="round"/>
<polygon points="550,380 538,390 538,370" fill="#c08a1e"/>
<rect x="560" y="344" width="580" height="72" rx="10" fill="#f3e7c9" stroke="#c08a1e" stroke-width="2"/>
<text x="584" y="376" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">Los mandamientos y estatutos</text>
<text x="584" y="401" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8a5a2b" text-anchor="start" font-weight="normal" font-style="italic">Éx 20–23; Dt 5–26</text>
<rect x="60" y="432" width="410" height="72" rx="10" fill="#fff" stroke="#4a4a4a" stroke-width="2"/>
<circle cx="98" cy="468" r="20" fill="#4a4a4a"/>
<text x="98" y="475" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
<text x="132" y="464" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430" text-anchor="start" font-weight="bold">Depósito y lectura</text>
<text x="132" y="489" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="normal">Guardar el texto y leerlo</text>
<line x1="480" y1="468" x2="538" y2="468" stroke="#c08a1e" stroke-width="3" stroke-linecap="round"/>
<polygon points="550,468 538,478 538,458" fill="#c08a1e"/>
<rect x="560" y="432" width="580" height="72" rx="10" fill="#f3e7c9" stroke="#c08a1e" stroke-width="2"/>
<text x="584" y="464" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">Las tablas en el arca; leer la ley</text>
<text x="584" y="489" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8a5a2b" text-anchor="start" font-weight="normal" font-style="italic">Éx 25:16; Dt 31:9-13</text>
<rect x="60" y="520" width="410" height="72" rx="10" fill="#fff" stroke="#4a4a4a" stroke-width="2"/>
<circle cx="98" cy="556" r="20" fill="#4a4a4a"/>
<text x="98" y="563" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">5</text>
<text x="132" y="552" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430" text-anchor="start" font-weight="bold">Testigos</text>
<text x="132" y="577" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="normal">Quiénes dan fe del pacto</text>
<line x1="480" y1="556" x2="538" y2="556" stroke="#c08a1e" stroke-width="3" stroke-linecap="round"/>
<polygon points="550,556 538,566 538,546" fill="#c08a1e"/>
<rect x="560" y="520" width="580" height="72" rx="10" fill="#f3e7c9" stroke="#c08a1e" stroke-width="2"/>
<text x="584" y="552" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">Los cielos y la tierra</text>
<text x="584" y="577" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8a5a2b" text-anchor="start" font-weight="normal" font-style="italic">Dt 30:19; 31:28</text>
<rect x="60" y="608" width="410" height="72" rx="10" fill="#fff" stroke="#4a4a4a" stroke-width="2"/>
<circle cx="98" cy="644" r="20" fill="#4a4a4a"/>
<text x="98" y="651" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">6</text>
<text x="132" y="640" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430" text-anchor="start" font-weight="bold">Bendiciones y maldiciones</text>
<text x="132" y="665" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="normal">Por cumplir o por romper</text>
<line x1="480" y1="644" x2="538" y2="644" stroke="#c08a1e" stroke-width="3" stroke-linecap="round"/>
<polygon points="550,644 538,654 538,634" fill="#c08a1e"/>
<rect x="560" y="608" width="580" height="72" rx="10" fill="#f3e7c9" stroke="#c08a1e" stroke-width="2"/>
<text x="584" y="640" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">Bendiciones y maldiciones del pacto</text>
<text x="584" y="665" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8a5a2b" text-anchor="start" font-weight="normal" font-style="italic">Lv 26; Dt 28</text>
<text x="600" y="725" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">Primero el favor del rey, después las obligaciones: Israel obedecía porque ya había sido rescatado.</text>
</svg>