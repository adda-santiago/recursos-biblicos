<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 835" width="1200" height="835">
<rect width="1200" height="835" fill="#f6f3ec"/>
<text x="600" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">¿Cuál Herodes?</text>
<text x="600" y="88" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal">Los nombres de la familia en el Nuevo Testamento y cómo reconocerlos</text>
<text x="40" y="125" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="bold">Persona</text>
<text x="300" y="125" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="bold">Cómo lo llama el texto</text>
<text x="640" y="125" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="bold">Dónde</text>
<text x="860" y="125" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="bold">Qué pasa</text>
<rect x="30" y="143" width="1140" height="96" rx="8" fill="#fff" stroke="#c9c6be" stroke-width="1"/>
<rect x="30" y="143" width="10" height="96" rx="3" fill="#8a5a44"/>
<text x="56" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="start" font-weight="bold">Herodes el Grande</text>
<text x="300" y="197" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="normal" font-style="italic">«el rey Herodes»</text>
<text x="640" y="185" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9e2b25" text-anchor="start" font-weight="normal">Mateo 2</text>
<text x="640" y="207" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9e2b25" text-anchor="start" font-weight="normal">Lucas 1:5</text>
<text x="860" y="174" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">Nacimiento de Jesús</text>
<text x="860" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">los magos</text>
<text x="860" y="218" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">los niños de Belén</text>
<rect x="30" y="249" width="1140" height="96" rx="8" fill="#fff" stroke="#c9c6be" stroke-width="1"/>
<rect x="30" y="249" width="10" height="96" rx="3" fill="#9e2b25"/>
<text x="56" y="304" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="start" font-weight="bold">Arquelao</text>
<text x="300" y="303" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="normal" font-style="italic">«Arquelao reinaba en Judea»</text>
<text x="640" y="302" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9e2b25" text-anchor="start" font-weight="normal">Mateo 2:22</text>
<text x="860" y="302" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">José no vuelve a Judea y va a Nazaret</text>
<rect x="30" y="355" width="1140" height="96" rx="8" fill="#fff" stroke="#c9c6be" stroke-width="1"/>
<rect x="30" y="355" width="10" height="96" rx="3" fill="#2f8a8a"/>
<text x="56" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="start" font-weight="bold">Herodes Antipas</text>
<text x="300" y="409" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="normal" font-style="italic">«Herodes el tetrarca», «el rey Herodes»</text>
<text x="640" y="386" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9e2b25" text-anchor="start" font-weight="normal">Lucas 3:1, 19</text>
<text x="640" y="408" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9e2b25" text-anchor="start" font-weight="normal">Marcos 6:14-29</text>
<text x="640" y="430" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9e2b25" text-anchor="start" font-weight="normal">Lucas 13:32 y 23:7-12</text>
<text x="860" y="386" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">Juan el Bautista</text>
<text x="860" y="408" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">«esa zorra»</text>
<text x="860" y="430" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">Jesús ante Herodes</text>
<rect x="30" y="461" width="1140" height="96" rx="8" fill="#fff" stroke="#c9c6be" stroke-width="1"/>
<rect x="30" y="461" width="10" height="96" rx="3" fill="#c08a1e"/>
<text x="56" y="516" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="start" font-weight="bold">Felipe</text>
<text x="300" y="515" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="normal" font-style="italic">«su hermano Felipe tetrarca»</text>
<text x="640" y="514" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9e2b25" text-anchor="start" font-weight="normal">Lucas 3:1</text>
<text x="860" y="514" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">Cesarea de Filipo (Mt 16:13)</text>
<rect x="30" y="567" width="1140" height="96" rx="8" fill="#fff" stroke="#c9c6be" stroke-width="1"/>
<rect x="30" y="567" width="10" height="96" rx="3" fill="#4a6b7c"/>
<text x="56" y="622" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="start" font-weight="bold">Agripa I</text>
<text x="300" y="621" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="normal" font-style="italic">«el rey Herodes» en Hechos</text>
<text x="640" y="620" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9e2b25" text-anchor="start" font-weight="normal">Hechos 12</text>
<text x="860" y="598" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">Mata a Jacobo</text>
<text x="860" y="620" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">encarcela a Pedro</text>
<text x="860" y="642" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">muere en Cesarea</text>
<rect x="30" y="673" width="1140" height="96" rx="8" fill="#fff" stroke="#c9c6be" stroke-width="1"/>
<rect x="30" y="673" width="10" height="96" rx="3" fill="#7a3fa0"/>
<text x="56" y="728" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="start" font-weight="bold">Agripa II</text>
<text x="300" y="727" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="normal" font-style="italic">«el rey Agripa»</text>
<text x="640" y="726" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9e2b25" text-anchor="start" font-weight="normal">Hechos 25:13–26:32</text>
<text x="860" y="726" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">«Por poco me persuades a ser cristiano»</text>
<text x="600" y="811" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal">Herodes II, primer esposo de Herodías, aparece solo de paso: Marcos 6:17 lo llama Felipe.</text>
</svg>