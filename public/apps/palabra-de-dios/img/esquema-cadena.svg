<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">De Dios al lector</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Cinco eslabones de la doctrina de la Escritura</text>
<ellipse cx="130" cy="330" rx="104" ry="70" fill="none" stroke="#c08a1e" stroke-width="14"/>
<text x="130" y="320" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#c08a1e" text-anchor="middle" font-weight="bold">Revelación</text>
<text x="130" y="348" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">1</text>
<text x="130" y="455" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Dios se da</text>
<text x="130" y="478" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">a conocer</text>
<text x="130" y="512" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">He 1:1-2</text>
<ellipse cx="365" cy="330" rx="104" ry="70" fill="none" stroke="#b03a2e" stroke-width="14"/>
<text x="365" y="320" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#b03a2e" text-anchor="middle" font-weight="bold">Inspiración</text>
<text x="365" y="348" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">2</text>
<text x="365" y="455" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Dios guía a los</text>
<text x="365" y="478" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">autores al escribir</text>
<text x="365" y="512" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">2 Ti 3:16</text>
<ellipse cx="600" cy="330" rx="104" ry="70" fill="none" stroke="#7a3fa0" stroke-width="14"/>
<text x="600" y="320" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#7a3fa0" text-anchor="middle" font-weight="bold">Canon</text>
<text x="600" y="348" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">3</text>
<text x="600" y="455" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">El pueblo de Dios</text>
<text x="600" y="478" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">reconoce los libros</text>
<text x="600" y="512" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Ro 3:2</text>
<ellipse cx="835" cy="330" rx="104" ry="70" fill="none" stroke="#2a6fb0" stroke-width="14"/>
<text x="835" y="320" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Iluminación</text>
<text x="835" y="348" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">4</text>
<text x="835" y="455" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">El Espíritu abre</text>
<text x="835" y="478" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">el entendimiento</text>
<text x="835" y="512" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Lc 24:45</text>
<ellipse cx="1070" cy="330" rx="104" ry="70" fill="none" stroke="#2f7d4a" stroke-width="14"/>
<text x="1070" y="320" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Obediencia</text>
<text x="1070" y="348" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">5</text>
<text x="1070" y="455" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">El creyente</text>
<text x="1070" y="478" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">recibe y obedece</text>
<text x="1070" y="512" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Stg 1:22</text>
<line x1="70" y1="590" x2="1130" y2="590" stroke="#c9c6be" stroke-width="3" marker-end="url(#fl)"/>
<text x="130" y="625" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Dios habla</text>
<text x="1070" y="625" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">el lector vive</text>
<text x="600" y="700" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">Los tres primeros eslabones ocurrieron una vez; los dos últimos ocurren cada vez que alguien lee.</text>
</svg>