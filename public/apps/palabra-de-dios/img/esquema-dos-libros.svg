<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Dos maneras en que Dios se revela</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Salmo 19: los cielos (vv. 1-6) y la ley de Jehová (vv. 7-11)</text>
<rect x="60" y="140" width="520" height="520" rx="14" fill="#f3e7c9"/>
<text x="320" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#c08a1e" text-anchor="middle" font-weight="bold">Revelación general</text>
<circle cx="120" cy="233" r="6" fill="#c08a1e"/>
<text x="138" y="239" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="start" font-weight="normal">Creación (Sal 19:1)</text>
<circle cx="120" cy="267" r="6" fill="#c08a1e"/>
<text x="138" y="273" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="start" font-weight="normal">Providencia (Hch 14:17)</text>
<circle cx="120" cy="301" r="6" fill="#c08a1e"/>
<text x="138" y="307" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="start" font-weight="normal">Conciencia (Ro 2:15)</text>
<line x1="100" y1="345" x2="540" y2="345" stroke="#c08a1e" stroke-width="2" opacity=".5"/>
<text x="110" y="390" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#c08a1e" text-anchor="start" font-weight="bold">Llega a</text>
<text x="110" y="416" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">todos los seres humanos</text>
<text x="110" y="456" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#c08a1e" text-anchor="start" font-weight="bold">Muestra</text>
<text x="110" y="482" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">su eterno poder y deidad</text>
<text x="110" y="522" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#c08a1e" text-anchor="start" font-weight="bold">Produce</text>
<text x="110" y="548" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">responsabilidad: «no tienen excusa»</text>
<text x="110" y="588" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#c08a1e" text-anchor="start" font-weight="bold">No muestra</text>
<text x="110" y="614" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">el camino de la salvación</text>
<rect x="620" y="140" width="520" height="520" rx="14" fill="#dde8f3"/>
<text x="880" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Revelación especial</text>
<circle cx="680" cy="233" r="6" fill="#2a6fb0"/>
<text x="698" y="239" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="start" font-weight="normal">Palabra a los profetas</text>
<circle cx="680" cy="267" r="6" fill="#2a6fb0"/>
<text x="698" y="273" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="start" font-weight="normal">Cristo, el Verbo hecho carne</text>
<circle cx="680" cy="301" r="6" fill="#2a6fb0"/>
<text x="698" y="307" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="start" font-weight="normal">La Escritura</text>
<line x1="660" y1="345" x2="1100" y2="345" stroke="#2a6fb0" stroke-width="2" opacity=".5"/>
<text x="670" y="390" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2a6fb0" text-anchor="start" font-weight="bold">Llega a</text>
<text x="670" y="416" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">quien la oye o la lee</text>
<text x="670" y="456" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2a6fb0" text-anchor="start" font-weight="bold">Muestra</text>
<text x="670" y="482" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">su nombre, su pacto y su plan</text>
<text x="670" y="522" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2a6fb0" text-anchor="start" font-weight="bold">Produce</text>
<text x="670" y="548" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">fe: «convierte el alma»</text>
<text x="670" y="588" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2a6fb0" text-anchor="start" font-weight="bold">Centro</text>
<text x="670" y="614" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">Jesucristo y el evangelio</text>
<text x="600" y="715" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">La creación deja a todos sin excusa; solo la Palabra lleva a Cristo (Ro 1:20; 10:17).</text>
</svg>