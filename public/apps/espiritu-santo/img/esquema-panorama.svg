<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">El Espíritu de Génesis a Apocalipsis</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Una sola historia: el Espíritu que crea, unge, promete, viene sobre Jesús y es derramado</text>
<line x1="80" y1="330" x2="1120" y2="330" stroke="#c9c6be" stroke-width="6" stroke-linecap="round"/>
<polygon points="760,326 1120,302 1120,358 760,334" fill="#b03a2e38"/>
<circle cx="130" cy="330" r="12" fill="#2f7d4a"/>
<line x1="130" y1="310" x2="130" y2="274" stroke="#2f7d4a" stroke-width="2"/>
<text x="130" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Creación</text>
<text x="130" y="230" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">Da forma y vida</text>
<text x="130" y="252" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 1:2; Sal 104:30</text>
<circle cx="287" cy="330" r="12" fill="#c08a1e"/>
<line x1="287" y1="350" x2="287" y2="370" stroke="#c08a1e" stroke-width="2"/>
<text x="287" y="404" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#c08a1e" text-anchor="middle" font-weight="bold">Antiguo Testamento</text>
<text x="287" y="430" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">Viene sobre algunos</text>
<text x="287" y="452" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Jue 6:34; 1 S 16:13</text>
<circle cx="444" cy="330" r="12" fill="#7a3fa0"/>
<line x1="444" y1="310" x2="444" y2="274" stroke="#7a3fa0" stroke-width="2"/>
<text x="444" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#7a3fa0" text-anchor="middle" font-weight="bold">Los profetas</text>
<text x="444" y="230" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">Anuncian el derramamiento</text>
<text x="444" y="252" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Ez 36:27; Jl 2:28</text>
<circle cx="601" cy="330" r="12" fill="#2a6fb0"/>
<line x1="601" y1="350" x2="601" y2="370" stroke="#2a6fb0" stroke-width="2"/>
<text x="601" y="404" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Jesús</text>
<text x="601" y="430" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">Lo unge sin medida</text>
<text x="601" y="452" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Lc 3:22; 4:18</text>
<circle cx="758" cy="330" r="18" fill="#b03a2e"/>
<line x1="758" y1="310" x2="758" y2="274" stroke="#b03a2e" stroke-width="2"/>
<text x="758" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#b03a2e" text-anchor="middle" font-weight="bold">Pentecostés</text>
<text x="758" y="230" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">Derramado sobre la iglesia</text>
<text x="758" y="252" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Hch 2:1-4</text>
<circle cx="915" cy="330" r="12" fill="#1e8a8a"/>
<line x1="915" y1="350" x2="915" y2="370" stroke="#1e8a8a" stroke-width="2"/>
<text x="915" y="404" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1e8a8a" text-anchor="middle" font-weight="bold">La iglesia</text>
<text x="915" y="430" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">Mora en todos y da poder</text>
<text x="915" y="452" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Ro 8:9; Hch 1:8</text>
<circle cx="1072" cy="330" r="12" fill="#1f2430"/>
<line x1="1072" y1="310" x2="1072" y2="274" stroke="#1f2430" stroke-width="2"/>
<text x="1072" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430" text-anchor="middle" font-weight="bold">La venida</text>
<text x="1072" y="230" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">El Espíritu clama: «Ven»</text>
<text x="1072" y="252" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Ap 22:17</text>
<text x="330" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#c08a1e" text-anchor="middle" font-weight="bold">Antes de Pentecostés</text>
<text x="330" y="588" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">El Espíritu viene sobre algunos, para una tarea</text>
<text x="930" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#b03a2e" text-anchor="middle" font-weight="bold">Desde Pentecostés</text>
<text x="930" y="588" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">Derramado sobre toda carne: mora en cada creyente</text>
<text x="600" y="680" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">«Ojalá todo el pueblo de Jehová fuese profeta» (Nm 11:29)</text>
</svg>