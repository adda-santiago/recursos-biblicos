<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">El Padre, el Hijo y el Espíritu Santo</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Cómo describe Juan 14–16 la relación del Espíritu con el Padre y con el Hijo</text>
<circle cx="600" cy="210" r="88" fill="#c08a1e28" stroke="#c08a1e" stroke-width="4"/>
<text x="600" y="218" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#c08a1e" text-anchor="middle" font-weight="bold">El Padre</text>
<circle cx="300" cy="560" r="88" fill="#2a6fb028" stroke="#2a6fb0" stroke-width="4"/>
<text x="300" y="568" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2a6fb0" text-anchor="middle" font-weight="bold">El Hijo</text>
<circle cx="900" cy="560" r="88" fill="#b03a2e28" stroke="#b03a2e" stroke-width="4"/>
<text x="900" y="568" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#b03a2e" text-anchor="middle" font-weight="bold">El Espíritu Santo</text>
<line x1="670" y1="270" x2="834" y2="472" stroke="#b03a2e" stroke-width="4" stroke-linecap="round"/>
<polygon points="845,485 824,481 845,463" fill="#b03a2e"/>
<text x="800" y="340" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="bold">el Padre enviará</text>
<text x="800" y="362" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">en mi nombre (Jn 14:26)</text>
<line x1="395" y1="548" x2="788" y2="548" stroke="#b03a2e" stroke-width="4" stroke-linecap="round"/>
<polygon points="805,548 788,562 788,534" fill="#b03a2e"/>
<text x="600" y="528" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">yo os enviaré del Padre (Jn 15:26)</text>
<line x1="805" y1="600" x2="412" y2="600" stroke="#2a6fb0" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>
<polygon points="395,600 412,586 412,614" fill="#2a6fb0"/>
<text x="600" y="632" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">él me glorificará (Jn 16:14)</text>
<line x1="540" y1="275" x2="360" y2="490" stroke="#c9c6be" stroke-width="4" stroke-dasharray="4 8"/>
<text x="330" y="360" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">Yo y el Padre</text>
<text x="330" y="382" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">uno somos (Jn 10:30)</text>
<text x="900" y="690" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">procede del Padre (Jn 15:26)</text>
<text x="600" y="720" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">Un solo Dios: «en el nombre del Padre, y del Hijo, y del Espíritu Santo» (Mt 28:19)</text>
</svg>