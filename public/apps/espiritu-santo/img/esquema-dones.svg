<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Los nueve dones de 1 Corintios 12:8-10</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">«A cada uno le es dada la manifestación del Espíritu para provecho» (1 Co 12:7)</text>
<rect x="65" y="150" width="330" height="420" rx="14" fill="#2a6fb019" stroke="#2a6fb0" stroke-width="2"/>
<text x="230" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Para saber</text>
<text x="230" y="228" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Dones de revelación</text>
<rect x="90" y="256" width="280" height="64" rx="32" fill="#f6f3ec" stroke="#2a6fb0" stroke-width="2"/>
<text x="230" y="296" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="bold">Palabra de sabiduría</text>
<rect x="90" y="348" width="280" height="64" rx="32" fill="#f6f3ec" stroke="#2a6fb0" stroke-width="2"/>
<text x="230" y="388" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="bold">Palabra de ciencia</text>
<rect x="90" y="440" width="280" height="64" rx="32" fill="#f6f3ec" stroke="#2a6fb0" stroke-width="2"/>
<text x="230" y="480" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">Discernimiento de espíritus</text>
<rect x="435" y="150" width="330" height="420" rx="14" fill="#b03a2e19" stroke="#b03a2e" stroke-width="2"/>
<text x="600" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#b03a2e" text-anchor="middle" font-weight="bold">Para hacer</text>
<text x="600" y="228" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Dones de poder</text>
<rect x="460" y="256" width="280" height="64" rx="32" fill="#f6f3ec" stroke="#b03a2e" stroke-width="2"/>
<text x="600" y="296" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="bold">Fe</text>
<rect x="460" y="348" width="280" height="64" rx="32" fill="#f6f3ec" stroke="#b03a2e" stroke-width="2"/>
<text x="600" y="388" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="bold">Dones de sanidades</text>
<rect x="460" y="440" width="280" height="64" rx="32" fill="#f6f3ec" stroke="#b03a2e" stroke-width="2"/>
<text x="600" y="480" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="bold">Hacer milagros</text>
<rect x="805" y="150" width="330" height="420" rx="14" fill="#2f7d4a19" stroke="#2f7d4a" stroke-width="2"/>
<text x="970" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Para hablar</text>
<text x="970" y="228" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Dones de expresión</text>
<rect x="830" y="256" width="280" height="64" rx="32" fill="#f6f3ec" stroke="#2f7d4a" stroke-width="2"/>
<text x="970" y="296" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="bold">Profecía</text>
<rect x="830" y="348" width="280" height="64" rx="32" fill="#f6f3ec" stroke="#2f7d4a" stroke-width="2"/>
<text x="970" y="388" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">Diversos géneros de lenguas</text>
<rect x="830" y="440" width="280" height="64" rx="32" fill="#f6f3ec" stroke="#2f7d4a" stroke-width="2"/>
<text x="970" y="480" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">Interpretación de lenguas</text>
<text x="600" y="625" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">«Todas estas cosas las hace uno y el mismo Espíritu,</text>
<text x="600" y="652" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">repartiendo a cada uno en particular como él quiere» (1 Co 12:11)</text>
<text x="600" y="712" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">La agrupación en tres es una ayuda para enseñar; Pablo no la hace.</text>
</svg>