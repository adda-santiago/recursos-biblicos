<polygon points="766,410 783,396 783,424" fill="#c9c6be"/>
<rect x="480" y="350" width="280" height="120" rx="14" fill="#c08a1e1e" stroke="#c08a1e" stroke-width="2"/>
<circle cx="508" cy="380" r="17" fill="#c08a1e"/>
<text x="508" y="386" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#f6f3ec" text-anchor="middle" font-weight="bold">5</text>
<text x="536" y="388" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#c08a1e" text-anchor="start" font-weight="bold">Sella</text>
<text x="502" y="424" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="normal">y es las arras de la herencia</text>
<text x="502" y="450" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">Ef 1:13-14</text>
