<polygon points="406,410 423,396 423,424" fill="#c9c6be"/>
<rect x="120" y="350" width="280" height="120" rx="14" fill="#c08a1e1e" stroke="#c08a1e" stroke-width="2"/>
<circle cx="148" cy="380" r="17" fill="#c08a1e"/>
<text x="148" y="386" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#f6f3ec" text-anchor="middle" font-weight="bold">6</text>
<text x="176" y="388" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#c08a1e" text-anchor="start" font-weight="bold">Da testimonio</text>
<text x="142" y="424" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="normal">«¡Abba, Padre!»</text>
<text x="142" y="450" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">Ro 8:15-16</text>
