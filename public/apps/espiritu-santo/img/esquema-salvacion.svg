<polygon points="980,346 966,329 994,329" fill="#c9c6be"/>
<rect x="840" y="350" width="280" height="120" rx="14" fill="#c08a1e1e" stroke="#c08a1e" stroke-width="2"/>
<circle cx="868" cy="380" r="17" fill="#c08a1e"/>
<text x="868" y="386" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#f6f3ec" text-anchor="middle" font-weight="bold">4</text>
<text x="896" y="388" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#c08a1e" text-anchor="start" font-weight="bold">Mora</text>
<text x="862" y="424" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="normal">somos templo de Dios</text>
<text x="862" y="450" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">1 Co 6:19</text>
