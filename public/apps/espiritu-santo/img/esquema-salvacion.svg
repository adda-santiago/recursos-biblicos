<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">La obra del Espíritu en la salvación</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Aplica al creyente, de principio a fin, lo que Cristo hizo por él</text>
<rect x="120" y="170" width="280" height="120" rx="14" fill="#9e2b251e" stroke="#9e2b25" stroke-width="2"/>
<circle cx="148" cy="200" r="17" fill="#9e2b25"/>
<text x="148" y="206" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#f6f3ec" text-anchor="middle" font-weight="bold">1</text>
<text x="176" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#9e2b25" text-anchor="start" font-weight="bold">Convence</text>
<text x="142" y="244" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="normal">de pecado, justicia y juicio</text>
<text x="142" y="270" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">Jn 16:8</text>
