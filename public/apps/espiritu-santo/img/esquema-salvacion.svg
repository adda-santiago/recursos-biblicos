<text x="508" y="206" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#f6f3ec" text-anchor="middle" font-weight="bold">2</text>
<text x="536" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#b03a2e" text-anchor="start" font-weight="bold">Regenera</text>
<text x="502" y="244" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="normal">nacer del Espíritu</text>
<text x="502" y="270" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">Jn 3:5; Tit 3:5</text>
