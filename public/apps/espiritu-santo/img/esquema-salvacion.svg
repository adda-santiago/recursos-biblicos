<polygon points="474,590 457,604 457,576" fill="#c9c6be"/>
<rect x="480" y="530" width="280" height="120" rx="14" fill="#2f7d4a1e" stroke="#2f7d4a" stroke-width="2"/>
<circle cx="508" cy="560" r="17" fill="#2f7d4a"/>
<text x="508" y="566" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#f6f3ec" text-anchor="middle" font-weight="bold">8</text>
<text x="536" y="568" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#2f7d4a" text-anchor="start" font-weight="bold">Santifica</text>
<text x="502" y="604" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="normal">de gloria en gloria</text>
<text x="502" y="630" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">2 Co 3:18</text>
<line x1="764" y1="590" x2="817" y2="590" stroke="#c9c6be" stroke-width="4" stroke-linecap="round"/>
<polygon points="834,590 817,604 817,576" fill="#c9c6be"/>
<rect x="840" y="530" width="280" height="120" rx="14" fill="#2a6fb01e" stroke="#2a6fb0" stroke-width="2"/>
<circle cx="868" cy="560" r="17" fill="#2a6fb0"/>
<text x="868" y="566" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#f6f3ec" text-anchor="middle" font-weight="bold">9</text>
<text x="896" y="568" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#2a6fb0" text-anchor="start" font-weight="bold">Resucitará</text>
<text x="862" y="604" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="normal">vivificará nuestros cuerpos</text>
<text x="862" y="630" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">Ro 8:11</text>
<text x="600" y="712" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">Rojo: la conversión · Oro: la vida en el Espíritu · Verde: el crecimiento · Azul: la esperanza</text>
</svg>