<polygon points="260,526 246,509 274,509" fill="#c9c6be"/>
<rect x="120" y="530" width="280" height="120" rx="14" fill="#2f7d4a1e" stroke="#2f7d4a" stroke-width="2"/>
<circle cx="148" cy="560" r="17" fill="#2f7d4a"/>
<text x="148" y="566" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#f6f3ec" text-anchor="middle" font-weight="bold">7</text>
<text x="176" y="568" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#2f7d4a" text-anchor="start" font-weight="bold">Intercede</text>
<text x="142" y="604" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="normal">con gemidos indecibles</text>
<text x="142" y="630" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">Ro 8:26</text>
