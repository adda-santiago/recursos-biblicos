<polygon points="834,230 817,244 817,216" fill="#c9c6be"/>
<rect x="840" y="170" width="280" height="120" rx="14" fill="#b03a2e1e" stroke="#b03a2e" stroke-width="2"/>
<circle cx="868" cy="200" r="17" fill="#b03a2e"/>
<text x="868" y="206" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#f6f3ec" text-anchor="middle" font-weight="bold">3</text>
<text x="896" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#b03a2e" text-anchor="start" font-weight="bold">Bautiza en el cuerpo</text>
<text x="862" y="244" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="normal">nos une a Cristo y a la iglesia</text>
