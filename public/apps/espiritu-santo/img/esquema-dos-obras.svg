<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Dos obras del mismo Espíritu</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">La lectura pentecostal clásica de 1 Corintios 12:13 y Hechos 1:5-8</text>
<rect x="90" y="140" width="480" height="470" rx="14" fill="#c08a1e19" stroke="#c08a1e" stroke-width="2"/>
<text x="330" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#c08a1e" text-anchor="middle" font-weight="bold">En la conversión</text>
<text x="120" y="250" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="bold">Quién obra</text>
<text x="260" y="250" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">El Espíritu</text>
<text x="120" y="304" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="bold">Qué hace</text>
<text x="260" y="304" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">Regenera, une al cuerpo,</text>
<text x="260" y="358" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">mora y sella</text>
<text x="120" y="398" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="bold">Para qué</text>
<text x="260" y="398" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">Salvación: vida nueva</text>
<text x="120" y="452" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="bold">Quiénes</text>
<text x="260" y="452" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">Todo creyente</text>
<text x="120" y="506" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="bold">Texto</text>
<text x="260" y="506" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">1 Co 12:13; Ro 8:9</text>
<rect x="630" y="140" width="480" height="470" rx="14" fill="#b03a2e19" stroke="#b03a2e" stroke-width="2"/>
<text x="870" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#b03a2e" text-anchor="middle" font-weight="bold">El bautismo en el Espíritu</text>
<text x="660" y="250" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="bold">Quién obra</text>
<text x="800" y="250" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">Cristo bautiza en el Espíritu</text>
<text x="660" y="304" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="bold">Qué hace</text>
<text x="800" y="304" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">Reviste de poder;</text>
<text x="800" y="358" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">evidencia: otras lenguas</text>
<text x="660" y="398" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="bold">Para qué</text>
<text x="800" y="398" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">Servicio: ser testigos</text>
<text x="660" y="452" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="bold">Quiénes</text>
<text x="800" y="452" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">Prometido a todo creyente</text>
<text x="660" y="506" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="bold">Texto</text>
<text x="800" y="506" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">Hch 1:5, 8; 2:4, 39</text>
<line x1="575" y1="375" x2="603" y2="375" stroke="#c9c6be" stroke-width="6" stroke-linecap="round"/>
<polygon points="625,375 603,393 603,357" fill="#c9c6be"/>
<text x="600" y="340" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">después</text>
<text x="600" y="410" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">o casi a la vez</text>
<text x="330" y="660" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">Samaria: creyeron y fueron bautizados (Hch 8:12)</text>
<text x="870" y="660" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">…y después recibieron el Espíritu (Hch 8:17)</text>
<text x="600" y="715" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Todo creyente tiene el Espíritu; la promesa del bautismo en el Espíritu es para todos</text>
</svg>