<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
<rect width="1200" height="800" fill="#f6f3ec"/>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Las obras de la carne y el fruto del Espíritu</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Gálatas 5:19-23: obras en plural, fruto en singular</text>
<rect x="60" y="140" width="440" height="600" rx="14" fill="#c9c6be59" stroke="#c9c6be" stroke-width="2"/>
<text x="280" y="186" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#6b7080" text-anchor="middle" font-weight="bold">Obras de la carne</text>
<text x="280" y="212" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">muchas, dispersas, en desorden (vv. 19-21)</text>
<text x="172" y="258" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">adulterio</text>
<text x="397" y="266" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">fornicación</text>
<text x="155" y="309" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">inmundicia</text>
<text x="406" y="309" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">lascivia</text>
<text x="175" y="369" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">idolatría</text>
<text x="375" y="368" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">hechicerías</text>
<text x="165" y="412" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">enemistades</text>
<text x="377" y="418" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">pleitos</text>
<text x="178" y="465" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">celos</text>
<text x="387" y="465" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">iras</text>
<text x="187" y="522" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">contiendas</text>
<text x="375" y="525" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">disensiones</text>
<text x="159" y="571" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">herejías</text>
<text x="375" y="577" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">envidias</text>
<text x="177" y="620" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">homicidios</text>
<text x="386" y="620" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">borracheras</text>
<text x="187" y="674" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">orgías</text>
<text x="280" y="722" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">«y cosas semejantes a estas» (v. 21)</text>
<rect x="560" y="140" width="580" height="600" rx="14" fill="#2f7d4a19" stroke="#2f7d4a" stroke-width="2"/>
<text x="850" y="186" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2f7d4a" text-anchor="middle" font-weight="bold">El fruto del Espíritu</text>
<text x="850" y="212" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">uno solo, con nueve aspectos (vv. 22-23)</text>
<text x="590" y="326" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#b03a2e" text-anchor="start" font-weight="bold">Hacia Dios</text>
<circle cx="820" cy="320" r="54" fill="#b03a2e38" stroke="#b03a2e" stroke-width="3"/>
<text x="820" y="326" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">amor</text>
<circle cx="936" cy="320" r="54" fill="#b03a2e38" stroke="#b03a2e" stroke-width="3"/>
<text x="936" y="326" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">gozo</text>
<circle cx="1052" cy="320" r="54" fill="#b03a2e38" stroke="#b03a2e" stroke-width="3"/>
<text x="1052" y="326" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">paz</text>
<text x="590" y="466" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#c08a1e" text-anchor="start" font-weight="bold">Hacia los demás</text>
<circle cx="820" cy="460" r="54" fill="#c08a1e38" stroke="#c08a1e" stroke-width="3"/>
<text x="820" y="466" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">paciencia</text>
<circle cx="936" cy="460" r="54" fill="#c08a1e38" stroke="#c08a1e" stroke-width="3"/>
<text x="936" y="466" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="bold">benignidad</text>
<circle cx="1052" cy="460" r="54" fill="#c08a1e38" stroke="#c08a1e" stroke-width="3"/>
<text x="1052" y="466" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">bondad</text>
<text x="590" y="606" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2a6fb0" text-anchor="start" font-weight="bold">Hacia uno mismo</text>
<circle cx="820" cy="600" r="54" fill="#2a6fb038" stroke="#2a6fb0" stroke-width="3"/>
<text x="820" y="606" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">fe</text>
<circle cx="936" cy="600" r="54" fill="#2a6fb038" stroke="#2a6fb0" stroke-width="3"/>
<text x="936" y="606" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="bold">mansedumbre</text>
<circle cx="1052" cy="600" r="54" fill="#2a6fb038" stroke="#2a6fb0" stroke-width="3"/>
<text x="1052" y="606" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">templanza</text>
<text x="850" y="722" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">«contra tales cosas no hay ley» (v. 23)</text>
</svg>