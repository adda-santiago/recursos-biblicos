<text x="302" y="364" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">purificación del templo</text>
<text x="302" y="384" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Jn 2:13</text>
<line x1="606" y1="230" x2="606" y2="460" stroke="#6b7080" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.6"/>
