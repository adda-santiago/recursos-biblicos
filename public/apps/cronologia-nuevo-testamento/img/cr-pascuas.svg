<text x="606" y="274" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Jn 5:1</text>
<line x1="846" y1="340" x2="846" y2="460" stroke="#9e2b25" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.6"/>
