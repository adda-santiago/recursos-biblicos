<text x="846" y="308" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#9e2b25" text-anchor="middle" font-weight="bold">Pascua</text>
<text x="846" y="364" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">los cinco mil</text>
<text x="846" y="384" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Jn 6:4</text>
<line x1="973" y1="230" x2="973" y2="460" stroke="#c08a1e" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.6"/>
