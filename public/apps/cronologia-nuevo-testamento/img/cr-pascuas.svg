<text x="504" y="150" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">31 d.C.</text>
<line x1="769" y1="140" x2="769" y2="560" stroke="#c9c6be" stroke-width="1"/>
<text x="775" y="150" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">32 d.C.</text>
<line x1="1041" y1="140" x2="1041" y2="560" stroke="#c9c6be" stroke-width="1"/>
<text x="1047" y="150" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">33 d.C.</text>
<rect x="144" y="470" width="326" height="40" rx="6" fill="#5a6b3f" opacity="0.85"/>
<text x="307" y="496" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">Judea, Samaria y Caná</text>
<rect x="471" y="470" width="503" height="40" rx="6" fill="#2f7d4f" opacity="0.85"/>
<text x="722" y="496" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">El gran ministerio en Galilea</text>
<rect x="973" y="470" width="136" height="40" rx="6" fill="#2f6f9e" opacity="0.85"/>
<text x="1041" y="496" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">Hacia Jerusalén</text>
<rect x="144" y="520" width="965" height="8" rx="3" fill="#9e2b25" opacity="0.6"/>
<text x="144" y="552" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9e2b25" text-anchor="start" font-weight="bold">Unos tres años y medio</text>
<line x1="158" y1="230" x2="158" y2="460" stroke="#6b7080" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.6"/>
<circle cx="158" cy="220" r="11" fill="#6b7080" stroke="#f6f3ec" stroke-width="2"/>
<text x="158" y="198" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="bold">Bautismo</text>
<text x="158" y="254" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">otoño del 29</text>
<text x="158" y="274" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Mt 3; Jn 1</text>
<line x1="302" y1="340" x2="302" y2="460" stroke="#9e2b25" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.6"/>
