<text x="973" y="254" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">otoño</text>
<text x="973" y="274" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Jn 7:2</text>
<line x1="1033" y1="340" x2="1033" y2="460" stroke="#c08a1e" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.6"/>
