<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
<rect width="1200" height="700" fill="#f6f3ec"/>
<text x="600" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">El ministerio de Jesús en las fiestas de Juan</text>
<text x="600" y="88" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal">Del bautismo, en el otoño del 29, a la cruz, en la Pascua del 33</text>
<line x1="226" y1="140" x2="226" y2="560" stroke="#c9c6be" stroke-width="1"/>
<text x="232" y="150" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">30 d.C.</text>
