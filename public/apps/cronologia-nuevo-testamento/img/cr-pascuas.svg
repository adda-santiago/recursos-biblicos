<text x="1033" y="308" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#c08a1e" text-anchor="middle" font-weight="bold">Dedicación</text>
<text x="1033" y="364" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">invierno</text>
<text x="1033" y="384" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Jn 10:22</text>
<line x1="1112" y1="230" x2="1112" y2="460" stroke="#9e2b25" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.6"/>
<circle cx="1112" cy="220" r="11" fill="#9e2b25" stroke="#f6f3ec" stroke-width="2"/>
<text x="1112" y="198" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#9e2b25" text-anchor="middle" font-weight="bold">Pascua</text>
<text x="1112" y="254" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">la cruz</text>
<text x="1112" y="274" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Jn 11:55</text>
<text x="600" y="670" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Entre la Pascua de Juan 2 y la de Juan 6 pasó más de un año (Jn 4:35): por eso se cuentan cuatro Pascuas.</text>
</svg>