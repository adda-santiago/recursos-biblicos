<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820">
<rect width="1200" height="820" fill="#f6f3ec"/>
<text x="600" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Del anuncio a Zacarías al regreso a Nazaret</text>
<text x="600" y="88" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal">El orden de los hechos de Mateo 1–2 y Lucas 1–2 (fechas aproximadas)</text>
<line x1="450" y1="144" x2="450" y2="202" stroke="#c9c6be" stroke-width="3"/>
<circle cx="450" cy="144" r="12" fill="#5a6b3f" stroke="#f6f3ec" stroke-width="2"/>
<text x="420" y="150" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="end" font-weight="bold">c. 7–6 a.C.</text>
<text x="480" y="143" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="start" font-weight="bold">Anuncio a Zacarías</text>
<text x="480" y="167" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">en el templo (Lc 1:5-25)</text>
<line x1="450" y1="216" x2="450" y2="274" stroke="#c9c6be" stroke-width="3"/>
<circle cx="450" cy="216" r="12" fill="#9e2b25" stroke="#f6f3ec" stroke-width="2"/>
<text x="420" y="222" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="end" font-weight="bold">c. 6 a.C.</text>
<text x="480" y="215" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="start" font-weight="bold">Anuncio a María</text>
<text x="480" y="239" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">al sexto mes de Elisabet (Lc 1:26-38)</text>
<line x1="450" y1="288" x2="450" y2="346" stroke="#c9c6be" stroke-width="3"/>
<circle cx="450" cy="288" r="12" fill="#5a6b3f" stroke="#f6f3ec" stroke-width="2"/>
<text x="420" y="294" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="end" font-weight="bold">c. 6 a.C.</text>
<text x="480" y="287" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="start" font-weight="bold">Nace Juan el Bautista</text>
<text x="480" y="311" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">en la montaña de Judea (Lc 1:57-80)</text>
<line x1="450" y1="360" x2="450" y2="418" stroke="#c9c6be" stroke-width="3"/>
<circle cx="450" cy="360" r="12" fill="#9e2b25" stroke="#f6f3ec" stroke-width="2"/>
<text x="420" y="366" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="end" font-weight="bold">c. 6–5 a.C.</text>
<text x="480" y="359" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="start" font-weight="bold">Nace Jesús en Belén</text>
<text x="480" y="383" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">el censo de Augusto (Lc 2:1-20)</text>
<line x1="450" y1="432" x2="450" y2="490" stroke="#c9c6be" stroke-width="3"/>
<circle cx="450" cy="432" r="12" fill="#9e2b25" stroke="#f6f3ec" stroke-width="2"/>
<text x="420" y="438" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="end" font-weight="bold">c. 5 a.C.</text>
<text x="480" y="431" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="start" font-weight="bold">Circuncisión y presentación</text>
<text x="480" y="455" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">al octavo y al cuadragésimo día (Lc 2:21-38)</text>
<line x1="450" y1="504" x2="450" y2="562" stroke="#c9c6be" stroke-width="3"/>
<circle cx="450" cy="504" r="12" fill="#c08a1e" stroke="#f6f3ec" stroke-width="2"/>
<text x="420" y="510" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="end" font-weight="bold">c. 5 a.C.</text>
<text x="480" y="503" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="start" font-weight="bold">Los magos en Belén</text>
<text x="480" y="527" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">en una casa (Mt 2:1-12)</text>
<line x1="450" y1="576" x2="450" y2="634" stroke="#c9c6be" stroke-width="3"/>
<circle cx="450" cy="576" r="12" fill="#6b7080" stroke="#f6f3ec" stroke-width="2"/>
<text x="420" y="582" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="end" font-weight="bold">c. 5–4 a.C.</text>
<text x="480" y="575" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="start" font-weight="bold">Huida a Egipto</text>
<text x="480" y="599" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">y muerte de los niños de Belén (Mt 2:13-18)</text>
<line x1="450" y1="648" x2="450" y2="706" stroke="#c9c6be" stroke-width="3"/>
<circle cx="450" cy="648" r="12" fill="#8a5a44" stroke="#f6f3ec" stroke-width="2"/>
<text x="420" y="654" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="end" font-weight="bold">marzo del 4 a.C.</text>
<text x="480" y="647" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="start" font-weight="bold">Muere Herodes</text>
<text x="480" y="671" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">eclipse de luna, antes de la Pascua</text>
<circle cx="450" cy="720" r="12" fill="#9e2b25" stroke="#f6f3ec" stroke-width="2"/>
<text x="420" y="726" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="end" font-weight="bold">4 a.C.</text>
<text x="480" y="719" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="start" font-weight="bold">Regreso a Nazaret</text>
<text x="480" y="743" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">Arquelao reina en Judea (Mt 2:19-23; Lc 2:39)</text>
</svg>