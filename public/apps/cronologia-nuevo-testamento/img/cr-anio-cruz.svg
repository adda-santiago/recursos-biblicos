<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
<rect width="1200" height="720" fill="#f6f3ec"/>
<text x="600" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">¿En qué año murió Jesús?</text>
<text x="600" y="88" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal">Entre el 26 y el 36: los datos que dejan solo dos candidatos</text>
<line x1="291" y1="140" x2="291" y2="560" stroke="#c9c6be" stroke-width="1"/>
<text x="291" y="132" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">26</text>
<line x1="373" y1="140" x2="373" y2="560" stroke="#c9c6be" stroke-width="1"/>
<text x="373" y="132" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">27</text>
<line x1="455" y1="140" x2="455" y2="560" stroke="#c9c6be" stroke-width="1"/>
<text x="455" y="132" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">28</text>
<line x1="536" y1="140" x2="536" y2="560" stroke="#c9c6be" stroke-width="1"/>
<text x="536" y="132" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">29</text>
<line x1="618" y1="140" x2="618" y2="560" stroke="#c9c6be" stroke-width="1"/>
<text x="618" y="132" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">30</text>
<line x1="700" y1="140" x2="700" y2="560" stroke="#c9c6be" stroke-width="1"/>
<text x="700" y="132" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">31</text>
<line x1="782" y1="140" x2="782" y2="560" stroke="#c9c6be" stroke-width="1"/>
<text x="782" y="132" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">32</text>
<line x1="864" y1="140" x2="864" y2="560" stroke="#c9c6be" stroke-width="1"/>
<text x="864" y="132" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">33</text>
<line x1="945" y1="140" x2="945" y2="560" stroke="#c9c6be" stroke-width="1"/>
<text x="945" y="132" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">34</text>
<line x1="1027" y1="140" x2="1027" y2="560" stroke="#c9c6be" stroke-width="1"/>
<text x="1027" y="132" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">35</text>
<line x1="1109" y1="140" x2="1109" y2="560" stroke="#c9c6be" stroke-width="1"/>
<text x="1109" y="132" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">36</text>
<text x="234" y="184" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="end" font-weight="bold">Pilato, prefecto</text>
<rect x="291" y="166" width="835" height="30" rx="5" fill="#6b5a7a" opacity="0.8"/>
<text x="234" y="246" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="end" font-weight="bold">Caifás, sumo sacerdote</text>
<rect x="250" y="228" width="875" height="30" rx="5" fill="#8a5a44" opacity="0.8"/>
<text x="234" y="308" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="end" font-weight="bold">Año 15 de Tiberio</text>
<rect x="504" y="290" width="82" height="30" rx="5" fill="#6b7080" opacity="0.8"/>
<text x="234" y="370" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="end" font-weight="bold">Ministerio (3½ años)</text>
<rect x="594" y="352" width="295" height="30" rx="5" fill="#9e2b25" opacity="0.8"/>
<text x="234" y="432" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="end" font-weight="bold">Cae Sejano en Roma</text>
<circle cx="765" cy="428" r="10" fill="#6b5a7a" stroke="#f6f3ec" stroke-width="2"/>
<text x="781" y="434" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">octubre del 31: Pilato, sin protector (Jn 19:12)</text>
<text x="234" y="494" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#9e2b25" text-anchor="end" font-weight="bold">14 de nisán en viernes</text>
<circle cx="640" cy="490" r="13" fill="#fff" stroke="#6b7080" stroke-width="4"/>
<text x="640" y="526" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="bold">7 de abril del 30</text>
<circle cx="884" cy="490" r="13" fill="#fff" stroke="#9e2b25" stroke-width="4"/>
<text x="884" y="526" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9e2b25" text-anchor="middle" font-weight="bold">3 de abril del 33</text>
<text x="600" y="640" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">El año 33 encaja con la cuenta normal de Tiberio, con un ministerio de tres años y medio y con Juan 2:20.</text>
<text x="600" y="668" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">El año 30 exige contar los años de Tiberio desde el 12 o un ministerio más corto.</text>
</svg>