<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
<rect width="1200" height="640" fill="#f6f3ec"/>
<text x="600" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Tres propuestas para el día de la cruz</text>
<text x="600" y="88" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal">Cómo cuenta cada una los «tres días» hasta la resurrección</text>
<text x="385" y="145" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">Mié</text>
<line x1="300" y1="155" x2="300" y2="540" stroke="#c9c6be" stroke-width="1"/>
<text x="555" y="145" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">Jue</text>
<line x1="470" y1="155" x2="470" y2="540" stroke="#c9c6be" stroke-width="1"/>
<text x="725" y="145" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">Vie</text>
<line x1="640" y1="155" x2="640" y2="540" stroke="#c9c6be" stroke-width="1"/>
<text x="895" y="145" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">Sáb</text>
<line x1="810" y1="155" x2="810" y2="540" stroke="#c9c6be" stroke-width="1"/>
<text x="1065" y="145" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">Dom</text>
<line x1="980" y1="155" x2="980" y2="540" stroke="#c9c6be" stroke-width="1"/>
<line x1="1150" y1="155" x2="1150" y2="540" stroke="#c9c6be" stroke-width="1"/>
<text x="280" y="212" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#9e2b25" text-anchor="end" font-weight="bold">Viernes</text>
<text x="280" y="236" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="end" font-weight="normal">La postura del sitio</text>
<rect x="768" y="194" width="238" height="30" rx="5" fill="#9e2b25" opacity="0.8"/>
<circle cx="768" cy="209" r="8" fill="#1f2430" stroke="#f6f3ec" stroke-width="2"/>
<circle cx="1006" cy="209" r="10" fill="#fff" stroke="#9e2b25" stroke-width="3"/>
<text x="886" y="252" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">Vie, sáb y dom: «al tercer día» (Lc 24:21)</text>
<text x="280" y="332" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6b7080" text-anchor="end" font-weight="bold">Jueves</text>
<text x="280" y="356" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="end" font-weight="normal">Dos días de reposo seguidos</text>
<rect x="598" y="314" width="408" height="30" rx="5" fill="#6b7080" opacity="0.8"/>
<circle cx="598" cy="329" r="8" fill="#1f2430" stroke="#f6f3ec" stroke-width="2"/>
<circle cx="1006" cy="329" r="10" fill="#fff" stroke="#6b7080" stroke-width="3"/>
<text x="802" y="372" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">Cuatro días; la Pascua y el sábado</text>
<text x="280" y="452" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6b7080" text-anchor="end" font-weight="bold">Miércoles</text>
<text x="280" y="476" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="end" font-weight="normal">72 horas exactas</text>
<rect x="428" y="434" width="518" height="30" rx="5" fill="#6b7080" opacity="0.8"/>
<circle cx="428" cy="449" r="8" fill="#1f2430" stroke="#f6f3ec" stroke-width="2"/>
<circle cx="946" cy="449" r="10" fill="#fff" stroke="#6b7080" stroke-width="3"/>
<text x="687" y="492" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">Resurrección el sábado por la tarde</text>
<circle cx="140" cy="568" r="8" fill="#1f2430" stroke="#f6f3ec" stroke-width="2"/>
<text x="156" y="573" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">muerte (hora novena) y sepultura antes del atardecer</text>
<circle cx="720" cy="568" r="9" fill="#fff" stroke="#9e2b25" stroke-width="3"/>
<text x="738" y="573" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">resurrección</text>
<text x="600" y="612" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Recuerda: el día bíblico empieza al atardecer. «Tres días y tres noches» (Mt 12:40) se contaba de forma inclusiva (Est 4:16; 5:1).</text>
</svg>