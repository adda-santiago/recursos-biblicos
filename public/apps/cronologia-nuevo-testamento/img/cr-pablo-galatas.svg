<text x="640" y="478" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2f6f9e" text-anchor="end" font-weight="bold">14 años</text>
<text x="600" y="798" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">«Pasados catorce años» se cuenta desde la conversión: la visita de Gálatas 2 es la de la ofrenda o la del concilio.</text>
