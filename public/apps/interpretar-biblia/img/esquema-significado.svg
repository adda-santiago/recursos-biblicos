<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Un significado, muchas aplicaciones</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">El ejemplo del buen samaritano (Lucas 10:25-37)</text>
<rect x="60" y="300" width="250" height="140" rx="14" fill="#fff" stroke="#c9c6be" stroke-width="2"/>
<text x="185" y="345" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1f2430" text-anchor="middle" font-weight="normal">El texto</text>
<text x="185" y="375" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal">Lucas 10:25-37</text>
<text x="185" y="405" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">lo que está escrito</text>
<line x1="318" y1="370" x2="440" y2="370" stroke="#1f2430" stroke-width="4" marker-end="url(#fl)"/>
<text x="380" y="352" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">uno solo</text>
<rect x="450" y="270" width="300" height="200" rx="14" fill="#9e2b25"/>
<text x="600" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#fff" text-anchor="middle" font-weight="normal">Significado</text>
<text x="600" y="360" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="normal">El prójimo es aquel</text>
<text x="600" y="386" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="normal">a quien muestro</text>
<text x="600" y="412" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="normal">misericordia, sin importar</text>
<text x="600" y="438" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="normal">su origen</text>
<line x1="756" y1="370" x2="850" y2="200" stroke="#2a6fb0" stroke-width="3" marker-end="url(#fl)"/>
<rect x="860" y="170" width="290" height="60" rx="10" fill="#e2ebf3"/>
<text x="1005" y="207" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Visitar a un enfermo</text>
<line x1="756" y1="370" x2="850" y2="305" stroke="#2a6fb0" stroke-width="3" marker-end="url(#fl)"/>
<rect x="860" y="275" width="290" height="60" rx="10" fill="#e2ebf3"/>
<text x="1005" y="312" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Ayudar a un inmigrante</text>
<line x1="756" y1="370" x2="850" y2="410" stroke="#2a6fb0" stroke-width="3" marker-end="url(#fl)"/>
<rect x="860" y="380" width="290" height="60" rx="10" fill="#e2ebf3"/>
<text x="1005" y="417" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Reconciliarme con un vecino</text>
<line x1="756" y1="370" x2="850" y2="515" stroke="#2a6fb0" stroke-width="3" marker-end="url(#fl)"/>
<rect x="860" y="485" width="290" height="60" rx="10" fill="#e2ebf3"/>
<text x="1005" y="522" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Servir en un comedor</text>
<line x1="756" y1="370" x2="850" y2="620" stroke="#2a6fb0" stroke-width="3" marker-end="url(#fl)"/>
<rect x="860" y="590" width="290" height="60" rx="10" fill="#e2ebf3"/>
<text x="1005" y="627" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Cuidar a un desconocido</text>
<text x="1005" y="150" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Aplicaciones</text>
<text x="600" y="700" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">Las aplicaciones varían; ninguna puede contradecir el significado.</text>
</svg>