<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Los círculos del contexto</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Cuanto más cerca del versículo, más peso tiene para decidir su sentido</text>
<circle cx="430" cy="420" r="300" fill="#e9e4d8" stroke="#fff" stroke-width="3"/>
<circle cx="430" cy="420" r="250" fill="#e2ddce" stroke="#fff" stroke-width="3"/>
<circle cx="430" cy="420" r="200" fill="#d9e3ec" stroke="#fff" stroke-width="3"/>
<circle cx="430" cy="420" r="150" fill="#c8d8e6" stroke="#fff" stroke-width="3"/>
<circle cx="430" cy="420" r="100" fill="#b3cadf" stroke="#fff" stroke-width="3"/>
<text x="430" y="150" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">Toda la Biblia</text>
<text x="430" y="200" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">El testamento</text>
<text x="430" y="250" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">El libro</text>
<text x="430" y="300" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">El capítulo o sección</text>
<text x="430" y="350" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">El párrafo</text>
<circle cx="430" cy="420" r="52" fill="#9e2b25"/>
<text x="430" y="427" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">Versículo</text>
<text x="800" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#9e2b25" text-anchor="start" font-weight="bold">Ejemplo: Colosenses 2:21</text>
<text x="800" y="260" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal"></text>
<text x="800" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal" font-style="italic">«No manejes, ni gustes, ni aun toques»</text>
<text x="800" y="320" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal"></text>
<text x="800" y="350" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">Solo: parece un mandamiento.</text>
<text x="800" y="380" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal"></text>
<text x="800" y="410" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">Con el párrafo (2:20-23):</text>
<text x="800" y="440" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">Pablo cita reglas humanas</text>
<text x="800" y="470" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">para rechazarlas: «no tienen</text>
<text x="800" y="500" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">valor alguno contra los</text>
<text x="800" y="530" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">apetitos de la carne».</text>
<text x="600" y="735" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">«Un texto fuera de contexto es un pretexto»</text>
</svg>