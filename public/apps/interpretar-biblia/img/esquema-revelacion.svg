<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">La revelación progresiva</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">La promesa del Redentor se va aclarando a lo largo de la Escritura</text>
<path d="M80,400 L1130,400" stroke="#c9c6be" stroke-width="4"/>
<path d="M100,394 L880,330 L880,470 L100,406 Z" fill="#c08a1e" opacity="0.22"/>
<rect x="880" y="330" width="250" height="140" fill="#c08a1e" opacity="0.22"/>
<circle cx="110" cy="400" r="11" fill="#c08a1e"/>
<text x="110" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="bold">Génesis 3:15</text>
<text x="110" y="515" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">La simiente</text>
<text x="110" y="537" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">de la mujer</text>
<circle cx="300" cy="400" r="14" fill="#c08a1e"/>
<text x="300" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="bold">Abraham</text>
<text x="300" y="515" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">En tu simiente</text>
<text x="300" y="537" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">serán benditas</text>
<circle cx="490" cy="400" r="17" fill="#c08a1e"/>
<text x="490" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="bold">David</text>
<text x="490" y="515" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">Un hijo suyo</text>
<text x="490" y="537" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">reinará para siempre</text>
<circle cx="680" cy="400" r="20" fill="#c08a1e"/>
<text x="680" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="bold">Los profetas</text>
<text x="680" y="515" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">Nacerá de una virgen,</text>
<text x="680" y="537" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">sufrirá, reinará</text>
<circle cx="880" cy="400" r="23" fill="#9e2b25"/>
<text x="880" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="bold">Cristo</text>
<text x="880" y="515" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">Vino en el cumplimiento</text>
<text x="880" y="537" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">del tiempo (Gá 4:4)</text>
<circle cx="1070" cy="400" r="23" fill="#9e2b25"/>
<text x="1070" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="bold">Su venida</text>
<text x="1070" y="515" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">Reinará y hará</text>
<text x="1070" y="537" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">nuevas todas las cosas</text>
<text x="110" y="565" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 3:15</text>
<text x="300" y="565" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 12:3; 22:18</text>
<text x="490" y="565" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">2 S 7:12-16</text>
<text x="680" y="565" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Is 7:14; 53; Dn 7</text>
<text x="880" y="565" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gá 4:4-5</text>
<text x="1070" y="565" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Ap 19–22</text>
<text x="600" y="690" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">«Dios, habiendo hablado muchas veces y de muchas maneras… nos ha hablado por el Hijo» (He 1:1-2)</text>
</svg>