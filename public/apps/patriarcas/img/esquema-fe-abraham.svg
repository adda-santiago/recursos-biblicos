<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">La fe de Abraham en tres momentos</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Pablo y Santiago miran momentos distintos de la misma fe</text>
<line x1="100" y1="380" x2="1100" y2="380" stroke="#1f2430" stroke-width="3"/>
<circle cx="220" cy="380" r="16" fill="#2f7d4a"/>
<rect x="50" y="150" width="340" height="170" rx="14" fill="#2f7d4a26" stroke="#2f7d4a" stroke-width="2"/>
<text x="220" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Génesis 15</text>
<text x="220" y="216" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal">hacia 2081 a.C. · unos 85 años</text>
<text x="220" y="256" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">«Y creyó a Jehová, y le fue</text>
<text x="220" y="280" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">contado por justicia» (v. 6)</text>
<rect x="50" y="440" width="340" height="100" rx="14" fill="#f6f3ec" stroke="#2f7d4a" stroke-width="2"/>
<text x="220" y="482" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Romanos 4; Gálatas 3:</text>
<text x="220" y="506" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f7d4a" text-anchor="middle" font-weight="bold">justificado por la fe</text>
<circle cx="600" cy="380" r="16" fill="#c08a1e"/>
<rect x="430" y="150" width="340" height="170" rx="14" fill="#c08a1e26" stroke="#c08a1e" stroke-width="2"/>
<text x="600" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#c08a1e" text-anchor="middle" font-weight="bold">Génesis 17</text>
<text x="600" y="216" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal">hacia 2067 a.C. · 99 años</text>
<text x="600" y="256" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">La circuncisión, señal</text>
<text x="600" y="280" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">del pacto</text>
<rect x="430" y="440" width="340" height="100" rx="14" fill="#f6f3ec" stroke="#c08a1e" stroke-width="2"/>
<text x="600" y="482" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#c08a1e" text-anchor="middle" font-weight="bold">Romanos 4:10-11: señal</text>
<text x="600" y="506" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#c08a1e" text-anchor="middle" font-weight="bold">de una fe que ya tenía</text>
<circle cx="980" cy="380" r="16" fill="#2a6fb0"/>
<rect x="810" y="150" width="340" height="170" rx="14" fill="#2a6fb026" stroke="#2a6fb0" stroke-width="2"/>
<text x="980" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Génesis 22</text>
<text x="980" y="216" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal">hacia 2050 a.C. · más de 110 años</text>
<text x="980" y="256" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Ofrece a Isaac</text>
<text x="980" y="280" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">en el monte Moriah</text>
<rect x="810" y="440" width="340" height="100" rx="14" fill="#f6f3ec" stroke="#2a6fb0" stroke-width="2"/>
<text x="980" y="482" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Santiago 2:21-23: la fe</text>
<text x="980" y="506" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2a6fb0" text-anchor="middle" font-weight="bold">se perfecciona por las obras</text>
<text x="410" y="372" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">14 años</text>
<text x="790" y="372" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">unos 17 años</text>
<text x="600" y="620" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Dios declara justo al que cree (Génesis 15); la fe verdadera se muestra en la obediencia (Génesis 22).</text>
<text x="600" y="650" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Fechas aproximadas; la edad de Isaac en Moriah no se conoce con exactitud.</text>
</svg>