<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Atlas bíblico · Recursos Bíblicos</title>
<meta name="theme-color" content="#fafaf8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="atlas.css">
</head>
<body>
<div id="atlas" class="at">
  <div id="at-mapa" class="at-mapa" aria-label="Mapa de los lugares bíblicos"></div>

  <header class="at-barra">
    <div class="at-marca">
      <a class="mark" href="../../" target="_top">Recursos Bíblicos</a>
      <h1>Atlas bíblico</h1>
    </div>
    <div class="at-buscar">
      <label class="at-oculto" for="at-q">Buscar un lugar, un sitio o un libro</label>
      <input id="at-q" type="search" placeholder="Buscar lugar o libro (Betel, Getsemaní, Hechos…)" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="at-res" aria-autocomplete="list">
      <ul id="at-res" class="at-res" role="listbox" hidden></ul>
    </div>
    <div class="at-filtros">
      <label class="at-oculto" for="at-epoca">Época</label>
      <select id="at-epoca"></select>
      <button type="button" id="at-tipos-btn" class="at-chip" aria-expanded="false" aria-controls="at-tipos">Tipos</button>
      <button type="button" id="at-rec-btn" class="at-chip at-chip-fuerte" aria-expanded="false" aria-controls="at-rec">Recorridos</button>
    </div>
    <div id="at-activos" class="at-activos" hidden></div>
    <div id="at-tipos" class="at-tipos" hidden>
      <div id="at-tipos-lista"></div>
      <label class="at-imperio"><input type="checkbox" id="at-imperio" checked> Mostrar el imperio de la época</label>
    </div>
    <p id="at-cuenta" class="at-cuenta" aria-live="polite"></p>
  </header>

  <aside id="at-ficha" class="at-ficha" hidden aria-labelledby="at-ficha-n">
    <button type="button" id="at-cerrar" class="at-cerrar" aria-label="Cerrar">×</button>
    <div id="at-ficha-cuerpo" class="at-ficha-cuerpo"></div>
  </aside>

  <aside id="at-rec" class="at-rec" hidden aria-label="Recorridos en mapas">
    <div class="at-rec-cab"><h2>Recorridos</h2><button type="button" id="at-rec-cerrar" class="at-cerrar" aria-label="Cerrar">×</button></div>
    <p class="at-rec-intro">Los viajes y las campañas se estudian en sus propios recursos, paso a paso. El atlas sirve para ubicar cualquier lugar.</p>
    <div id="at-rec-lista"></div>
    <div class="at-rec-pie">
      <button type="button" id="at-tema" class="at-chip">Fondo oscuro</button>
      <p>Fronteras aproximadas. Mapa base: Natural Earth.</p>
    </div>
  </aside>
</div>
<noscript><p style="padding:2rem">El atlas necesita JavaScript.</p></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="../assets/js/mapa-base.js"></script>
<script src="../assets/js/mapa-detalle-palestina.js"></script>
<script src="../assets/js/imperios-geo.js"></script>
<script src="../assets/js/mapa-imperios.js"></script>
<script src="lugares.js"></script>
<script src="recursos.js"></script>
<script src="atlas.js"></script>
<!-- Citas bíblicas en burbuja (DIRECTRICES §15) -->
<script src="../assets/js/citas.js"></script>
<script src="../visor-bridge.js"></script>
</body>
</html>
