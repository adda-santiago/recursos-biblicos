<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1f2430" text-anchor="middle" font-weight="normal">Las setenta semanas de Daniel (Dn 9:24-27)</text>
<text x="600" y="102" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#8a8f98" text-anchor="middle" font-weight="normal">70 semanas de años = 490 años determinados sobre Israel y Jerusalén</text>
<rect x="130" y="314" width="100" height="32" fill="#2f7d4a"/>
<text x="180" y="336" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">7</text>
<text x="180" y="294" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">7 semanas</text>
<text x="180" y="382" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">49 años</text>
<text x="180" y="402" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a8f98" text-anchor="middle" font-weight="normal" font-style="italic">Jerusalén</text>
<text x="180" y="420" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a8f98" text-anchor="middle" font-weight="normal" font-style="italic">reconstruida</text>
<rect x="230" y="314" width="410" height="32" fill="#2a6fb0"/>
<text x="435" y="336" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">62</text>
<text x="435" y="294" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">62 semanas</text>
<text x="435" y="382" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">434 años</text>
<line x1="130" y1="270" x2="130" y2="450" stroke="#1f2430" stroke-width="2" stroke-dasharray="4 4"/>
<text x="130" y="476" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="bold">Orden de restaurar</text>
<text x="130" y="496" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="bold">y edificar Jerusalén</text>
<text x="130" y="516" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a8f98" text-anchor="middle" font-weight="normal">(Neh 2:1-8; c. 444 a.C.)</text>
<line x1="640" y1="270" x2="640" y2="450" stroke="#b03a2e" stroke-width="3"/>
<text x="640" y="476" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#b03a2e" text-anchor="middle" font-weight="bold">El Mesías Príncipe</text>
<text x="640" y="496" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">«se quitará la vida al Mesías»</text>
<text x="640" y="516" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a8f98" text-anchor="middle" font-weight="normal">(Dn 9:25-26; c. 33 d.C.)</text>
<line x1="652" y1="330" x2="900" y2="330" stroke="#8a8f98" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>
<text x="776" y="294" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8a8f98" text-anchor="middle" font-weight="bold">Paréntesis</text>
<text x="776" y="382" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8a8f98" text-anchor="middle" font-weight="normal">La era de la iglesia</text>
<text x="776" y="402" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a8f98" text-anchor="middle" font-weight="normal" font-style="italic">(no se cuenta)</text>
<text x="776" y="250" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a8f98" text-anchor="middle" font-weight="normal" font-style="italic">Destrucción de Jerusalén, año 70 (Dn 9:26)</text>
<rect x="910" y="314" width="110" height="32" fill="#b03a2e" opacity="0.75"/><rect x="1020" y="314" width="110" height="32" fill="#b03a2e"/>
<text x="1020" y="294" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#b03a2e" text-anchor="middle" font-weight="bold">Semana 70</text>
<text x="965" y="336" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">3½</text>
<text x="1075" y="336" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">3½</text>
<text x="1020" y="382" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">7 años: la tribulación</text>
<line x1="1020" y1="430" x2="1020" y2="450" stroke="#1f2430" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="910" y1="270" x2="910" y2="450" stroke="#1f2430" stroke-width="2" stroke-dasharray="4 4"/>
<text x="910" y="476" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="bold">Pacto del</text>
<text x="910" y="496" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="bold">príncipe que</text>
<text x="910" y="516" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="bold">ha de venir</text>
<line x1="1020" y1="270" x2="1020" y2="350" stroke="#1f2430" stroke-width="2" stroke-dasharray="4 4"/>
<text x="1090" y="476" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="bold">Rompe el pacto:</text>
<text x="1090" y="496" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="bold">la abominación</text>
<text x="1090" y="516" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a8f98" text-anchor="middle" font-weight="normal">(Dn 9:27; Mt 24:15)</text>
<text x="600" y="690" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8a8f98" text-anchor="middle" font-weight="normal" font-style="italic">Interpretación premilenial dispensacionalista. Las fechas de inicio y fin de las 69 semanas varían según los autores.</text>
</svg>