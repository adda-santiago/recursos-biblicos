<rect x="710" y="653" width="3" height="7" fill="#1f2430"/>
<text x="712" y="646" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2430" text-anchor="middle" font-weight="normal">persona</text>
<line x1="60" y1="660" x2="1150" y2="660" stroke="#8a5a2b" stroke-width="3"/>
<text x="960" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">El Etemenanki de Babilonia:</text>
<text x="960" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">«casa del fundamento</text>
<text x="960" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">del cielo y de la tierra»</text>
<text x="960" y="300" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">Ladrillo cocido y betún</text>
<text x="960" y="322" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">«les sirvió el ladrillo</text>
<text x="960" y="344" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">en lugar de piedra,</text>
<text x="960" y="366" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">y el asfalto en lugar</text>
<text x="960" y="388" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">de mezcla» (Gn 11:3)</text>
<text x="960" y="440" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Medidas según una tablilla</text>
<text x="960" y="460" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">babilónica y Heródoto:</text>
<text x="960" y="480" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">reconstrucción aproximada.</text>
</svg>