<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Génesis 1 a 11: los orígenes</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Cinco momentos que explican el mundo y desembocan en el llamado de Abraham</text>
<line x1="70" y1="300" x2="1000" y2="300" stroke="#c9c6be" stroke-width="6" stroke-linecap="round"/>
<circle cx="140" cy="300" r="16" fill="#2f7d4a"/>
<text x="140" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#2f7d4a" text-anchor="middle" font-weight="bold">La creación</text>
<text x="140" y="258" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 1–2</text>
<text x="140" y="352" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">Dios crea todo</text>
<text x="140" y="373" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">bueno en gran manera</text>
<circle cx="340" cy="300" r="16" fill="#b03a2e"/>
<text x="340" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#b03a2e" text-anchor="middle" font-weight="bold">La caída</text>
<text x="340" y="258" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 3</text>
<text x="340" y="352" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">El pecado entra</text>
<text x="340" y="373" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">y con él la muerte</text>
<circle cx="540" cy="300" r="16" fill="#8a5a2b"/>
<text x="540" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#8a5a2b" text-anchor="middle" font-weight="bold">De Caín a Noé</text>
<text x="540" y="258" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 4–6</text>
<text x="540" y="352" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">El pecado se extiende</text>
<text x="540" y="373" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">y llena la tierra</text>
<circle cx="740" cy="300" r="16" fill="#2a6fb0"/>
<text x="740" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#2a6fb0" text-anchor="middle" font-weight="bold">El diluvio</text>
<text x="740" y="258" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 6–9</text>
<text x="740" y="352" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">Juicio y salvación</text>
<text x="740" y="373" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">pacto con toda carne</text>
<circle cx="940" cy="300" r="16" fill="#7a3fa0"/>
<text x="940" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#7a3fa0" text-anchor="middle" font-weight="bold">Babel</text>
<text x="940" y="258" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 10–11</text>
<text x="940" y="352" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">Orgullo y dispersión</text>
<text x="940" y="373" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">de las naciones</text>
<line x1="1000" y1="300" x2="1071" y2="300" stroke="#c08a1e" stroke-width="6" stroke-linecap="round"/>
<polygon points="1090,300 1071,316 1071,284" fill="#c08a1e"/>
<rect x="1040" y="180" width="140" height="96" rx="14" fill="#c08a1e2d" stroke="#c08a1e" stroke-width="2"/>
<text x="1110" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#c08a1e" text-anchor="middle" font-weight="bold">Abraham</text>
<text x="1110" y="242" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 12</text>
<text x="1110" y="264" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">la promesa</text>
<text x="600" y="470" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1f2430" text-anchor="middle" font-weight="bold">En cada juicio, una gracia</text>
<rect x="35" y="500" width="210" height="56" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="140" y="534" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">La promesa a Eva (Gn 3:15)</text>
<rect x="265" y="500" width="210" height="56" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="370" y="534" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">La señal de Caín (Gn 4:15)</text>
<rect x="495" y="500" width="210" height="56" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="600" y="534" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">Noé halló gracia (Gn 6:8)</text>
<rect x="725" y="500" width="210" height="56" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="830" y="534" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">El arco iris (Gn 9:13)</text>
<rect x="955" y="500" width="210" height="56" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="1060" y="534" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">El llamado de Abram (Gn 12:3)</text>
<text x="600" y="640" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">«Serán benditas en ti todas las familias de la tierra» (Gn 12:3)</text>
<text x="600" y="680" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">Desde Génesis 12, la historia se concentra en Abraham y su descendencia.</text>
</svg>