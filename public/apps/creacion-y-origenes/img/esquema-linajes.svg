<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Dos linajes desde Adán</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Génesis 4 y 5: una línea construye sin Dios; la otra invoca su nombre</text>
<rect x="500" y="120" width="200" height="56" rx="14" fill="#1f243014" stroke="#1f2430" stroke-width="2"/>
<text x="600" y="155" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1f2430" text-anchor="middle" font-weight="bold">Adán y Eva</text>
<line x1="560" y1="178" x2="346" y2="224" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round"/>
<polygon points="330,228 343,211 349,238" fill="#8a5a2b"/>
<line x1="640" y1="178" x2="854" y2="224" stroke="#2a6fb0" stroke-width="3" stroke-linecap="round"/>
<polygon points="870,228 851,238 857,211" fill="#2a6fb0"/>
<rect x="150" y="250" width="360" height="40" rx="10" fill="#8a5a2b23" stroke="#8a5a2b" stroke-width="2"/>
<text x="330" y="277" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Caín</text>
<rect x="150" y="302" width="360" height="40" rx="10" fill="#8a5a2b23" stroke="#8a5a2b" stroke-width="2"/>
<text x="330" y="329" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Enoc (la ciudad)</text>
<rect x="150" y="354" width="360" height="40" rx="10" fill="#8a5a2b23" stroke="#8a5a2b" stroke-width="2"/>
<text x="330" y="381" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Irad</text>
<rect x="150" y="406" width="360" height="40" rx="10" fill="#8a5a2b23" stroke="#8a5a2b" stroke-width="2"/>
<text x="330" y="433" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Mehujael</text>
<rect x="150" y="458" width="360" height="40" rx="10" fill="#8a5a2b23" stroke="#8a5a2b" stroke-width="2"/>
<text x="330" y="485" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Metusael</text>
<rect x="150" y="510" width="360" height="40" rx="10" fill="#8a5a2b23" stroke="#8a5a2b" stroke-width="2"/>
<text x="330" y="537" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Lamec (dos mujeres, la venganza)</text>
<rect x="690" y="250" width="360" height="40" rx="10" fill="#2a6fb023" stroke="#2a6fb0" stroke-width="2"/>
<text x="870" y="277" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Set</text>
<rect x="690" y="302" width="360" height="40" rx="10" fill="#2a6fb023" stroke="#2a6fb0" stroke-width="2"/>
<text x="870" y="329" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Enós («invocar el nombre»)</text>
<rect x="690" y="354" width="360" height="40" rx="10" fill="#2a6fb023" stroke="#2a6fb0" stroke-width="2"/>
<text x="870" y="381" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Cainán, Mahalaleel, Jared</text>
<rect x="690" y="406" width="360" height="40" rx="10" fill="#2a6fb023" stroke="#2a6fb0" stroke-width="2"/>
<text x="870" y="433" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Enoc (caminó con Dios)</text>
<rect x="690" y="458" width="360" height="40" rx="10" fill="#2a6fb023" stroke="#2a6fb0" stroke-width="2"/>
<text x="870" y="485" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Matusalén, Lamec</text>
<rect x="690" y="510" width="360" height="40" rx="10" fill="#2a6fb023" stroke="#2a6fb0" stroke-width="2"/>
<text x="870" y="537" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Noé</text>
<text x="330" y="590" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8a5a2b" text-anchor="middle" font-weight="bold">Jabal · Jubal · Tubal-caín · Naama</text>
<text x="330" y="618" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">ganado, música y metal (Gn 4:20-22)</text>
<text x="330" y="639" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">«setenta veces siete» de venganza (Gn 4:24)</text>
<text x="870" y="590" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Sem · Cam · Jafet</text>
<text x="870" y="618" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">hasta Abraham, David y Cristo (Lc 3:23-38)</text>
<text x="870" y="639" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">«comenzaron a invocar» (Gn 4:26)</text>
<text x="600" y="712" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">La cultura es buena; lo que la santifica o la corrompe es a quién sirve.</text>
</svg>