<rect x="40" y="520" width="1120" height="200" rx="14" fill="#ffffff" stroke="#1f2430" stroke-width="2"/>
<text x="600" y="558" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430" text-anchor="middle" font-weight="bold">Lo que afirman todas las lecturas cristianas ortodoxas</text>
<text x="230" y="600" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">• Un solo Dios creó todo de la nada</text>
<text x="600" y="600" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">• La creación es buena y tiene propósito</text>
<text x="970" y="600" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">• Cristo es Creador y sustentador</text>
<text x="230" y="640" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">• El ser humano lleva la imagen de Dios</text>
<text x="600" y="640" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">• Dios juzga el pecado y salva por gracia</text>
<text x="970" y="640" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">• La Escritura es Palabra de Dios</text>
<text x="600" y="700" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Las cuatro primeras rechazan que el ser humano descienda de otras especies.</text>
