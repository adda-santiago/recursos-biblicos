<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Formar y llenar</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">La tierra estaba «desordenada y vacía» (Gn 1:2): Dios la ordena y la llena</text>
<text x="330" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Formar los espacios</text>
<text x="330" y="164" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">«desordenada» → orden</text>
<text x="870" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Llenarlos con habitantes</text>
<text x="870" y="164" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">«vacía» → plenitud</text>
<rect x="110" y="190" width="440" height="110" rx="14" fill="#c08a1e23" stroke="#c08a1e" stroke-width="2"/>
<rect x="650" y="190" width="440" height="110" rx="14" fill="#c08a1e38" stroke="#c08a1e" stroke-width="2"/>
<text x="150" y="234" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#c08a1e" text-anchor="start" font-weight="bold">Día 1</text>
<text x="150" y="264" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1f2430" text-anchor="start" font-weight="normal">Luz y tinieblas</text>
<text x="150" y="288" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">separa el día de la noche</text>
<text x="690" y="234" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#c08a1e" text-anchor="start" font-weight="bold">Día 4</text>
<text x="690" y="264" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1f2430" text-anchor="start" font-weight="normal">Sol, luna y estrellas</text>
<text x="690" y="288" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">lumbreras para el día y la noche</text>
<line x1="560" y1="245" x2="623" y2="245" stroke="#c08a1e" stroke-width="4" stroke-linecap="round"/>
<polygon points="640,245 623,259 623,231" fill="#c08a1e"/>
<rect x="110" y="330" width="440" height="110" rx="14" fill="#2a6fb023" stroke="#2a6fb0" stroke-width="2"/>
<rect x="650" y="330" width="440" height="110" rx="14" fill="#2a6fb038" stroke="#2a6fb0" stroke-width="2"/>
<text x="150" y="374" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2a6fb0" text-anchor="start" font-weight="bold">Día 2</text>
<text x="150" y="404" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1f2430" text-anchor="start" font-weight="normal">Cielo y mar</text>
<text x="150" y="428" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">separa las aguas</text>
<text x="690" y="374" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2a6fb0" text-anchor="start" font-weight="bold">Día 5</text>
<text x="690" y="404" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1f2430" text-anchor="start" font-weight="normal">Aves y peces</text>
<text x="690" y="428" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">habitantes del cielo y del agua</text>
<line x1="560" y1="385" x2="623" y2="385" stroke="#2a6fb0" stroke-width="4" stroke-linecap="round"/>
<polygon points="640,385 623,399 623,371" fill="#2a6fb0"/>
<rect x="110" y="470" width="440" height="110" rx="14" fill="#2f7d4a23" stroke="#2f7d4a" stroke-width="2"/>
<rect x="650" y="470" width="440" height="110" rx="14" fill="#2f7d4a38" stroke="#2f7d4a" stroke-width="2"/>
<text x="150" y="514" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2f7d4a" text-anchor="start" font-weight="bold">Día 3</text>
<text x="150" y="544" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1f2430" text-anchor="start" font-weight="normal">Tierra seca y plantas</text>
<text x="150" y="568" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">junta las aguas, brota la vida</text>
<text x="690" y="514" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2f7d4a" text-anchor="start" font-weight="bold">Día 6</text>
<text x="690" y="544" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1f2430" text-anchor="start" font-weight="normal">Animales y ser humano</text>
<text x="690" y="568" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">habitantes de la tierra</text>
<line x1="560" y1="525" x2="623" y2="525" stroke="#2f7d4a" stroke-width="4" stroke-linecap="round"/>
<polygon points="640,525 623,539 623,511" fill="#2f7d4a"/>
<rect x="300" y="625" width="600" height="90" rx="14" fill="#9e2b2523" stroke="#9e2b25" stroke-width="2"/>
<text x="600" y="662" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#9e2b25" text-anchor="middle" font-weight="bold">Día 7: Dios reposa</text>
<text x="600" y="692" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">bendice el día y lo santifica (Gn 2:1-3)</text>
</svg>