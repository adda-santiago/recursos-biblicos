<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">El año del diluvio</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Las fechas de Génesis 7 y 8, en la vida de Noé (meses de 30 días)</text>
<rect x="90" y="386" width="414" height="28" fill="#2a6fb059"/>
<rect x="504" y="386" width="606" height="28" fill="#2f7d4a38"/>
<rect x="330" y="150" width="26" height="16" fill="#2a6fb059"/>
<text x="364" y="164" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">Las aguas prevalecen: 150 días</text>
<rect x="640" y="150" width="26" height="16" fill="#2f7d4a38"/>
<text x="674" y="164" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">Las aguas bajan y la tierra se seca</text>
<line x1="90" y1="384" x2="90" y2="308" stroke="#2a6fb0" stroke-width="2"/>
<circle cx="90" cy="400" r="9" fill="#2a6fb0"/>
<text x="90.0" y="250" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2a6fb0" text-anchor="start" font-weight="bold">Comienza la lluvia</text>
<text x="90.0" y="272" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">600, mes 2, día 17</text>
<text x="90.0" y="292" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">Gn 7:11</text>
<line x1="200" y1="416" x2="200" y2="462" stroke="#2a6fb0" stroke-width="2"/>
<circle cx="200" cy="400" r="9" fill="#2a6fb0"/>
<text x="200.27027027027026" y="510" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Fin de los 40 días</text>
<text x="200.27027027027026" y="532" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">de lluvia</text>
<text x="200.27027027027026" y="552" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 7:12</text>
<line x1="504" y1="384" x2="504" y2="308" stroke="#8a5a2b" stroke-width="2"/>
<circle cx="504" cy="400" r="9" fill="#8a5a2b"/>
<text x="503.51351351351354" y="250" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8a5a2b" text-anchor="middle" font-weight="bold">El arca reposa</text>
<text x="503.51351351351354" y="272" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">mes 7, día 17 (150 días)</text>
<text x="503.51351351351354" y="292" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 7:24; 8:4</text>
<line x1="708" y1="416" x2="708" y2="462" stroke="#8a5a2b" stroke-width="2"/>
<circle cx="708" cy="400" r="9" fill="#8a5a2b"/>
<text x="707.5135135135135" y="510" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8a5a2b" text-anchor="middle" font-weight="bold">Se ven las cimas</text>
<text x="707.5135135135135" y="532" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">mes 10, día 1</text>
<text x="707.5135135135135" y="552" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 8:5</text>
<line x1="818" y1="384" x2="818" y2="308" stroke="#2f7d4a" stroke-width="2"/>
<circle cx="818" cy="400" r="9" fill="#2f7d4a"/>
<text x="817.7837837837839" y="250" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Cuervo y paloma</text>
<text x="817.7837837837839" y="272" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">40 días después</text>
<text x="817.7837837837839" y="292" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 8:6-12</text>
<line x1="956" y1="416" x2="956" y2="462" stroke="#2f7d4a" stroke-width="2"/>
<circle cx="956" cy="400" r="9" fill="#2f7d4a"/>
<text x="955.6216216216216" y="510" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Superficie seca</text>
<text x="955.6216216216216" y="532" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">601, mes 1, día 1</text>
<text x="955.6216216216216" y="552" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 8:13</text>
<line x1="1110" y1="384" x2="1110" y2="308" stroke="#9e2b25" stroke-width="2"/>
<circle cx="1110" cy="400" r="9" fill="#9e2b25"/>
<text x="1110.0" y="250" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#9e2b25" text-anchor="end" font-weight="bold">Salen del arca</text>
<text x="1110.0" y="272" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="end" font-weight="normal">601, mes 2, día 27</text>
<text x="1110.0" y="292" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">Gn 8:14-16</text>
<text x="600" y="650" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1f2430" text-anchor="middle" font-weight="bold">Noé estuvo en el arca un año y diez días.</text>
<text x="600" y="684" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">«Y se acordó Dios de Noé… e hizo pasar Dios un viento sobre la tierra» (Gn 8:1)</text>
</svg>