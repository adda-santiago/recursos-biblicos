<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Del Edén a la nueva Jerusalén</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">El final de la Biblia responde a su comienzo</text>
<text x="320" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Génesis 1–3</text>
<text x="880" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#c08a1e" text-anchor="middle" font-weight="bold">Apocalipsis 21–22</text>
<rect x="80" y="168" width="480" height="60" rx="10" fill="#2f7d4a1e" stroke="#2f7d4a" stroke-width="2"/>
<rect x="640" y="168" width="480" height="60" rx="10" fill="#c08a1e28" stroke="#c08a1e" stroke-width="2"/>
<text x="320" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Dios creó los cielos y la tierra</text>
<text x="320" y="218" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 1:1</text>
<text x="880" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Un cielo nuevo y una tierra nueva</text>
<text x="880" y="218" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Ap 21:1</text>
<line x1="566" y1="198" x2="622" y2="198" stroke="#c9c6be" stroke-width="3" stroke-linecap="round"/>
<polygon points="634,198 622,208 622,188" fill="#c9c6be"/>
<rect x="80" y="242" width="480" height="60" rx="10" fill="#2f7d4a1e" stroke="#2f7d4a" stroke-width="2"/>
<rect x="640" y="242" width="480" height="60" rx="10" fill="#c08a1e28" stroke="#c08a1e" stroke-width="2"/>
<text x="320" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Dios separa la luz de las tinieblas</text>
<text x="320" y="292" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 1:4</text>
<text x="880" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">No habrá allí más noche</text>
<text x="880" y="292" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Ap 22:5</text>
<line x1="566" y1="272" x2="622" y2="272" stroke="#c9c6be" stroke-width="3" stroke-linecap="round"/>
<polygon points="634,272 622,282 622,262" fill="#c9c6be"/>
<rect x="80" y="316" width="480" height="60" rx="10" fill="#2f7d4a1e" stroke="#2f7d4a" stroke-width="2"/>
<rect x="640" y="316" width="480" height="60" rx="10" fill="#c08a1e28" stroke="#c08a1e" stroke-width="2"/>
<text x="320" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Un río sale del Edén</text>
<text x="320" y="366" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 2:10</text>
<text x="880" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Un río de agua de vida sale del trono</text>
<text x="880" y="366" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Ap 22:1</text>
<line x1="566" y1="346" x2="622" y2="346" stroke="#c9c6be" stroke-width="3" stroke-linecap="round"/>
<polygon points="634,346 622,356 622,336" fill="#c9c6be"/>
<rect x="80" y="390" width="480" height="60" rx="10" fill="#2f7d4a1e" stroke="#2f7d4a" stroke-width="2"/>
<rect x="640" y="390" width="480" height="60" rx="10" fill="#c08a1e28" stroke="#c08a1e" stroke-width="2"/>
<text x="320" y="418" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">El árbol de vida, custodiado</text>
<text x="320" y="440" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 3:24</text>
<text x="880" y="418" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">El árbol de vida, para las naciones</text>
<text x="880" y="440" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Ap 22:2</text>
<line x1="566" y1="420" x2="622" y2="420" stroke="#c9c6be" stroke-width="3" stroke-linecap="round"/>
<polygon points="634,420 622,430 622,410" fill="#c9c6be"/>
<rect x="80" y="464" width="480" height="60" rx="10" fill="#2f7d4a1e" stroke="#2f7d4a" stroke-width="2"/>
<rect x="640" y="464" width="480" height="60" rx="10" fill="#c08a1e28" stroke="#c08a1e" stroke-width="2"/>
<text x="320" y="492" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">«Maldita será la tierra»</text>
<text x="320" y="514" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 3:17</text>
<text x="880" y="492" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">«No habrá más maldición»</text>
<text x="880" y="514" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Ap 22:3</text>
<line x1="566" y1="494" x2="622" y2="494" stroke="#c9c6be" stroke-width="3" stroke-linecap="round"/>
<polygon points="634,494 622,504 622,484" fill="#c9c6be"/>
<rect x="80" y="538" width="480" height="60" rx="10" fill="#2f7d4a1e" stroke="#2f7d4a" stroke-width="2"/>
<rect x="640" y="538" width="480" height="60" rx="10" fill="#c08a1e28" stroke="#c08a1e" stroke-width="2"/>
<text x="320" y="566" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Dios se pasea en el huerto</text>
<text x="320" y="588" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 3:8</text>
<text x="880" y="566" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">El tabernáculo de Dios con los hombres</text>
<text x="880" y="588" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Ap 21:3</text>
<line x1="566" y1="568" x2="622" y2="568" stroke="#c9c6be" stroke-width="3" stroke-linecap="round"/>
<polygon points="634,568 622,578 622,558" fill="#c9c6be"/>
<rect x="80" y="612" width="480" height="60" rx="10" fill="#2f7d4a1e" stroke="#2f7d4a" stroke-width="2"/>
<rect x="640" y="612" width="480" height="60" rx="10" fill="#c08a1e28" stroke="#c08a1e" stroke-width="2"/>
<text x="320" y="640" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Llanto, dolor y muerte</text>
<text x="320" y="662" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 3:16-19</text>
<text x="880" y="640" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Dios enjugará toda lágrima</text>
<text x="880" y="662" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Ap 21:4</text>
<line x1="566" y1="642" x2="622" y2="642" stroke="#c9c6be" stroke-width="3" stroke-linecap="round"/>
<polygon points="634,642 622,652 622,632" fill="#c9c6be"/>
<text x="600" y="708" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">«He aquí, yo hago nuevas todas las cosas» (Ap 21:5)</text>
</svg>