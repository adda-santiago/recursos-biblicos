<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860">
<rect width="1200" height="860" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">¿Quién gobernaba?</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">La tierra de Israel durante el ministerio de Jesús (hacia el año 28 d.C.)</text>
<defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7080"/></marker></defs>
<rect x="390" y="125" width="420" height="92" rx="12" fill="#9e2b25" stroke="#9e2b25" stroke-width="2"/>
<text x="600" y="159" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#fff" text-anchor="middle" font-weight="bold">Roma: el emperador Tiberio</text>
<text x="600" y="185" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="normal">14–37 d.C. · «Dad, pues, a César lo que es de César»</text>
<rect x="420" y="262" width="360" height="74" rx="12" fill="#fff" stroke="#9e2b25" stroke-width="2"/>
<text x="600" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430" text-anchor="middle" font-weight="bold">Gobernador de Siria</text>
<text x="600" y="322" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">legado con las legiones · vigila la región</text>
<line x1="600" y1="217" x2="600" y2="260" stroke="#6b7080" stroke-width="2.5" marker-end="url(#pf)"/>
<rect x="30" y="400" width="270" height="132" rx="12" fill="#9e2b25" stroke="#9e2b25" stroke-width="2"/>
<text x="165" y="434" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#fff" text-anchor="middle" font-weight="bold">Prefecto de Judea</text>
<text x="165" y="460" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="normal">Poncio Pilato, 26–36 d.C.</text>
<text x="165" y="481" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="normal">Judea, Samaria e Idumea</text>
<text x="165" y="502" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="normal">Reside en Cesarea</text>
<path d="M600,336 V368 H165 V396" fill="none" stroke="#6b7080" stroke-width="2.5" marker-end="url(#pf)"/>
<rect x="320" y="400" width="270" height="132" rx="12" fill="#2f8a8a" stroke="#2f8a8a" stroke-width="2"/>
<text x="455" y="434" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#fff" text-anchor="middle" font-weight="bold">Herodes Antipas</text>
<text x="455" y="460" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="normal">Tetrarca, 4 a.C.–39 d.C.</text>
<text x="455" y="481" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="normal">Galilea y Perea</text>
<text x="455" y="502" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="normal">Capital: Tiberíades</text>
<path d="M600,336 V368 H455 V396" fill="none" stroke="#6b7080" stroke-width="2.5" marker-end="url(#pf)"/>
<rect x="610" y="400" width="270" height="132" rx="12" fill="#a0603a" stroke="#a0603a" stroke-width="2"/>
<text x="745" y="434" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#fff" text-anchor="middle" font-weight="bold">Felipe</text>
<text x="745" y="460" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="normal">Tetrarca, 4 a.C.–34 d.C.</text>
<text x="745" y="481" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="normal">Gaulanítide, Traconite…</text>
<text x="745" y="502" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="normal">Capital: Cesarea de Filipo</text>
<path d="M600,336 V368 H745 V396" fill="none" stroke="#6b7080" stroke-width="2.5" marker-end="url(#pf)"/>
<rect x="900" y="400" width="270" height="132" rx="12" fill="#5d6fb0" stroke="#5d6fb0" stroke-width="2"/>
<text x="1035" y="434" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#fff" text-anchor="middle" font-weight="bold">La Decápolis</text>
<text x="1035" y="460" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="normal">Ciudades griegas</text>
<text x="1035" y="481" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="normal">bajo la provincia de Siria</text>
<text x="1035" y="502" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="normal">Gadara, Gerasa, Escitópolis</text>
<path d="M600,336 V368 H1035 V396" fill="none" stroke="#6b7080" stroke-width="2.5" marker-end="url(#pf)"/>
<text x="612" y="356" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">Roma decide quién gobierna cada región</text>
<rect x="30" y="610" width="270" height="112" rx="12" fill="#c08a1e" stroke="#c08a1e" stroke-width="2"/>
<text x="165" y="644" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#fff" text-anchor="middle" font-weight="bold">Sumo sacerdote</text>
<text x="165" y="670" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="normal">Caifás, 18–36 d.C.</text>
<text x="165" y="691" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="normal">nombrado por el prefecto</text>
<line x1="165" y1="532" x2="165" y2="606" stroke="#6b7080" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#pf)"/>
<text x="178" y="560" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">nombra</text>
<rect x="320" y="610" width="270" height="112" rx="12" fill="#fff" stroke="#c08a1e" stroke-width="2"/>
<text x="455" y="644" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430" text-anchor="middle" font-weight="bold">El Sanedrín</text>
<text x="455" y="670" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">Consejo de Jerusalén</text>
<text x="455" y="691" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">sacerdotes, escribas y ancianos</text>
<line x1="300" y1="666" x2="318" y2="666" stroke="#c08a1e" stroke-width="3"/>
<text x="455" y="750" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Preside el sumo sacerdote</text>
<rect x="640" y="610" width="520" height="112" rx="12" fill="#fff" stroke="#c9c6be" stroke-width="2"/>
<text x="900" y="644" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="bold">Lo que podía y no podía hacer</text>
<text x="900" y="672" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">Juzgaba según la ley de Moisés y cuidaba el templo,</text>
<text x="900" y="694" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">pero no podía ejecutar sin el prefecto: «A nosotros no</text>
<text x="900" y="714" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">nos está permitido dar muerte a nadie» (Juan 18:31).</text>
<text x="600" y="800" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">Por eso Jesús fue juzgado dos veces: ante el Sanedrín y ante Pilato.</text>
</svg>