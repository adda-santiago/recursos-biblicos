<text x="560" y="576" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8a8f98" text-anchor="middle" font-weight="normal" font-style="italic">Dentro de 6–18, los paréntesis (7; 10:1–11:14; 12–14; 17–18) explican lo que pasa mientras avanzan los juicios</text>
<text x="600" y="630" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">Lectura futurista: la iglesia aparece en la tierra en los capítulos 1–3 y vuelve a verse con Cristo en 19</text>
<text x="600" y="654" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">(Ap 19:7-8, 14); los capítulos 4–18 describen la tribulación sobre la tierra.</text>
