<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1f2430" text-anchor="middle" font-weight="normal">El bosquejo de Apocalipsis</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#8a8f98" text-anchor="middle" font-weight="normal">El propio libro da su estructura en 1:19</text>
<rect x="60" y="130" width="250" height="150" rx="14" fill="#fff" stroke="#7a3fa0" stroke-width="4"/>
<text x="185.0" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#7a3fa0" text-anchor="middle" font-weight="bold">Las cosas que has visto</text>
<text x="185.0" y="202" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">Capítulo 1</text>
<text x="185.0" y="236" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8a8f98" text-anchor="middle" font-weight="normal">Cristo glorificado</text>
<text x="185.0" y="260" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8a8f98" text-anchor="middle" font-weight="normal">entre los candeleros</text>
<rect x="330" y="130" width="250" height="150" rx="14" fill="#fff" stroke="#2f7d4a" stroke-width="4"/>
<text x="455.0" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Las que son</text>
<text x="455.0" y="202" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">Capítulos 2–3</text>
<text x="455.0" y="236" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8a8f98" text-anchor="middle" font-weight="normal">Las siete iglesias:</text>
<text x="455.0" y="260" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8a8f98" text-anchor="middle" font-weight="normal">la era de la iglesia</text>
<rect x="600" y="130" width="540" height="150" rx="14" fill="#fff" stroke="#b03a2e" stroke-width="4"/>
<text x="870.0" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#b03a2e" text-anchor="middle" font-weight="bold">Las que han de ser después de estas</text>
<text x="870.0" y="202" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">Capítulos 4–22</text>
<text x="870.0" y="236" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8a8f98" text-anchor="middle" font-weight="normal">Lo que vendrá después de</text>
<text x="870.0" y="260" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8a8f98" text-anchor="middle" font-weight="normal">la era de la iglesia</text>
<text x="600" y="318" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">«Escribe las cosas que has visto, y las que son, y las que han de ser después de estas» (Ap 1:19)</text>
