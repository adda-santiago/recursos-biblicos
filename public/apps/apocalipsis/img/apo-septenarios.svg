<text x="600" y="690" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">Cada serie sale de la anterior y es más intensa: un cuarto de la tierra (6:8), un tercio (8:7-12), toda la tierra (16).</text>
<text x="600" y="716" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">Después vienen la caída de Babilonia (17–18) y la venida de Cristo (19).</text>
