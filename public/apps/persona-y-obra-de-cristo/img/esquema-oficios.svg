<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Profeta, sacerdote y rey</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Lo que Cristo hizo, lo que hace y lo que hará</text>
<text x="400.0" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1f2430" text-anchor="middle" font-weight="bold">Lo que hizo</text>
<text x="400.0" y="184" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">en la tierra</text>
<text x="700.0" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1f2430" text-anchor="middle" font-weight="bold">Lo que hace</text>
<text x="700.0" y="184" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">desde la diestra del Padre</text>
<text x="1000.0" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1f2430" text-anchor="middle" font-weight="bold">Lo que hará</text>
<text x="1000.0" y="184" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">cuando vuelva</text>
<rect x="40" y="210" width="195" height="145" rx="14" fill="#1e8a8a"/>
<text x="137" y="280.5" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#fff" text-anchor="middle" font-weight="bold">Profeta</text>
<text x="137" y="308.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="normal" font-style="italic">habla de parte de Dios</text>
<rect x="260" y="210" width="280" height="145" rx="12" fill="#fff" stroke="#1e8a8a" stroke-width="2"/>
<text x="400.0" y="276.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Enseñó con autoridad y</text>
<text x="400.0" y="302.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">anunció el reino</text>
<rect x="560" y="210" width="280" height="145" rx="12" fill="#fff" stroke="#1e8a8a" stroke-width="2"/>
<text x="700.0" y="276.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Habla por su Palabra y</text>
<text x="700.0" y="302.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">su Espíritu</text>
<rect x="860" y="210" width="280" height="145" rx="12" fill="#fff" stroke="#1e8a8a" stroke-width="2"/>
<text x="1000.0" y="276.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Su palabra juzgará</text>
<text x="1000.0" y="302.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">(Jn 12:48)</text>
<rect x="40" y="375" width="195" height="145" rx="14" fill="#b03a2e"/>
<text x="137" y="445.5" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#fff" text-anchor="middle" font-weight="bold">Sacerdote</text>
<text x="137" y="473.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="normal" font-style="italic">nos representa ante Dios</text>
<rect x="260" y="375" width="280" height="145" rx="12" fill="#fff" stroke="#b03a2e" stroke-width="2"/>
<text x="400.0" y="441.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Se ofreció una vez para</text>
<text x="400.0" y="467.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">siempre</text>
<rect x="560" y="375" width="280" height="145" rx="12" fill="#fff" stroke="#b03a2e" stroke-width="2"/>
<text x="700.0" y="441.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Intercede por los suyos</text>
<text x="700.0" y="467.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">(He 7:25)</text>
<rect x="860" y="375" width="280" height="145" rx="12" fill="#fff" stroke="#b03a2e" stroke-width="2"/>
<text x="1000.0" y="441.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Nos presentará sin</text>
<text x="1000.0" y="467.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">mancha (Jud 24)</text>
<rect x="40" y="540" width="195" height="145" rx="14" fill="#c08a1e"/>
<text x="137" y="610.5" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#fff" text-anchor="middle" font-weight="bold">Rey</text>
<text x="137" y="638.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="normal" font-style="italic">gobierna en nombre de Dios</text>
<rect x="260" y="540" width="280" height="145" rx="12" fill="#fff" stroke="#c08a1e" stroke-width="2"/>
<text x="400.0" y="606.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Venció en la cruz y la</text>
<text x="400.0" y="632.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">resurrección</text>
<rect x="560" y="540" width="280" height="145" rx="12" fill="#fff" stroke="#c08a1e" stroke-width="2"/>
<text x="700.0" y="606.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Reina sobre su iglesia y</text>
<text x="700.0" y="632.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">todo poder</text>
<rect x="860" y="540" width="280" height="145" rx="12" fill="#fff" stroke="#c08a1e" stroke-width="2"/>
<text x="1000.0" y="606.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Reinará visiblemente en</text>
<text x="1000.0" y="632.5" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">la tierra</text>
<text x="600" y="735" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Por la ignorancia necesitamos un profeta; por la culpa, un sacerdote; por la esclavitud, un rey.</text>
</svg>