<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Se humilló… por lo cual Dios le exaltó</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Filipenses 2:6-11: el camino que baja hasta la cruz y sube hasta el trono</text>
<polyline points="330,150 378,220 426,290 474,360 522,430 570,500 600,600" fill="none" stroke="#2a6fb0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="600,600 660,520 718,430 776,340 834,250 892,160" fill="none" stroke="#c08a1e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="330" cy="150" r="9" fill="#2a6fb0"/>
<text x="312" y="156" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="end" font-weight="bold">En forma de Dios</text>
<text x="312" y="177" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">v. 6</text>
<circle cx="378" cy="220" r="9" fill="#2a6fb0"/>
<text x="360" y="226" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="end" font-weight="bold">Se despojó a sí mismo</text>
<text x="360" y="247" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">v. 7</text>
<circle cx="426" cy="290" r="9" fill="#2a6fb0"/>
<text x="408" y="296" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="end" font-weight="bold">Forma de siervo</text>
<text x="408" y="317" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">v. 7</text>
<circle cx="474" cy="360" r="9" fill="#2a6fb0"/>
<text x="456" y="366" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="end" font-weight="bold">Semejante a los hombres</text>
<text x="456" y="387" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">v. 7</text>
<circle cx="522" cy="430" r="9" fill="#2a6fb0"/>
<text x="504" y="436" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="end" font-weight="bold">Se humilló</text>
<text x="504" y="457" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">v. 8</text>
<circle cx="570" cy="500" r="9" fill="#2a6fb0"/>
<text x="552" y="506" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="end" font-weight="bold">Obediente hasta la muerte</text>
<text x="552" y="527" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">v. 8</text>
<circle cx="660" cy="520" r="9" fill="#c08a1e"/>
<text x="678" y="526" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="bold">Dios le exaltó hasta lo sumo</text>
<text x="678" y="547" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">v. 9</text>
<circle cx="718" cy="430" r="9" fill="#c08a1e"/>
<text x="736" y="436" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="bold">Un nombre sobre todo nombre</text>
<text x="736" y="457" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">v. 9</text>
<circle cx="776" cy="340" r="9" fill="#c08a1e"/>
<text x="794" y="346" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="bold">Se doble toda rodilla</text>
<text x="794" y="367" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">v. 10</text>
<circle cx="834" cy="250" r="9" fill="#c08a1e"/>
<text x="852" y="256" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="bold">Toda lengua confiese</text>
<text x="852" y="277" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">v. 11</text>
<circle cx="892" cy="160" r="9" fill="#c08a1e"/>
<text x="910" y="166" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="bold">Para gloria de Dios Padre</text>
<text x="910" y="187" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">v. 11</text>
<rect x="595" y="558" width="10" height="74" fill="#b03a2e"/>
<rect x="574" y="574" width="52" height="10" fill="#b03a2e"/>
<text x="600" y="662" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#b03a2e" text-anchor="middle" font-weight="normal" font-style="italic">y muerte de cruz</text>
<text x="330" y="690" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Él se humilló</text>
<text x="330" y="716" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">vv. 6-8: lo que hizo el Hijo</text>
<text x="880" y="690" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#c08a1e" text-anchor="middle" font-weight="bold">Dios lo exaltó</text>
<text x="880" y="716" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">vv. 9-11: lo que hizo el Padre</text>
</svg>