<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Cuatro imágenes de la cruz</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Palabras del mundo antiguo para explicar lo que Cristo hizo</text>
<rect x="60" y="130" width="530" height="270" rx="18" fill="#f6e2df" stroke="#b03a2e" stroke-width="2"/>
<text x="90" y="176" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#b03a2e" text-anchor="start" font-weight="bold">EL TEMPLO</text>
<text x="90" y="218" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="start" font-weight="bold">Propiciación</text>
<text x="90" y="262" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">El problema:</text>
<text x="90" y="288" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">La ira justa de Dios contra el pecado</text>
<text x="90" y="326" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">Lo que hizo Cristo:</text>
<text x="90" y="352" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="bold">Cristo satisfizo su justicia con su sangre</text>
<text x="560" y="380" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#b03a2e" text-anchor="end" font-weight="normal" font-style="italic">1 Jn 4:10</text>
<rect x="610" y="130" width="530" height="270" rx="18" fill="#f6ecd6" stroke="#c08a1e" stroke-width="2"/>
<text x="640" y="176" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c08a1e" text-anchor="start" font-weight="bold">EL MERCADO</text>
<text x="640" y="218" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="start" font-weight="bold">Redención</text>
<text x="640" y="262" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">El problema:</text>
<text x="640" y="288" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">La esclavitud del pecado</text>
<text x="640" y="326" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">Lo que hizo Cristo:</text>
<text x="640" y="352" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="bold">Cristo pagó el precio de nuestra libertad</text>
<text x="1110" y="380" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c08a1e" text-anchor="end" font-weight="normal" font-style="italic">1 P 1:18-19</text>
<rect x="60" y="420" width="530" height="270" rx="18" fill="#e0eaf4" stroke="#2a6fb0" stroke-width="2"/>
<text x="90" y="466" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2a6fb0" text-anchor="start" font-weight="bold">EL TRIBUNAL</text>
<text x="90" y="508" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="start" font-weight="bold">Justificación</text>
<text x="90" y="552" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">El problema:</text>
<text x="90" y="578" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">La culpa ante el Juez</text>
<text x="90" y="616" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">Lo que hizo Cristo:</text>
<text x="90" y="642" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="bold">Dios declara justo al que cree</text>
<text x="560" y="670" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2a6fb0" text-anchor="end" font-weight="normal" font-style="italic">Ro 5:1</text>
<rect x="610" y="420" width="530" height="270" rx="18" fill="#e0eee4" stroke="#2f7d4a" stroke-width="2"/>
<text x="640" y="466" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2f7d4a" text-anchor="start" font-weight="bold">LA FAMILIA</text>
<text x="640" y="508" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="start" font-weight="bold">Reconciliación</text>
<text x="640" y="552" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">El problema:</text>
<text x="640" y="578" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal">La enemistad con Dios</text>
<text x="640" y="616" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">Lo que hizo Cristo:</text>
<text x="640" y="642" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="bold">Cristo hizo la paz</text>
<text x="1110" y="670" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2f7d4a" text-anchor="end" font-weight="normal" font-style="italic">2 Co 5:18-19</text>
</svg>