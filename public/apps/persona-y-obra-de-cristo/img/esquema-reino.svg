<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">El reino de Cristo</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Sus etapas según la lectura premilenial</text>
<line x1="60" y1="330" x2="1140" y2="330" stroke="#c9c6be" stroke-width="6" stroke-linecap="round"/>
<circle cx="120" cy="330" r="22" fill="#6b7080"/>
<text x="120" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#6b7080" text-anchor="middle" font-weight="bold">Prometido</text>
<text x="120" y="390" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">a David</text>
<text x="120" y="418" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">2 S 7:12-16</text>
<circle cx="310" cy="330" r="22" fill="#1e8a8a"/>
<text x="310" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1e8a8a" text-anchor="middle" font-weight="bold">Anunciado</text>
<text x="310" y="390" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">el reino se ha</text>
<text x="310" y="412" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">acercado</text>
<text x="310" y="440" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Mt 4:17</text>
<circle cx="500" cy="330" r="22" fill="#b03a2e"/>
<text x="500" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#b03a2e" text-anchor="middle" font-weight="bold">Rechazado</text>
<text x="500" y="390" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">por los líderes</text>
<text x="500" y="412" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">de Israel</text>
<text x="500" y="440" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Mt 23:37-39</text>
<circle cx="700" cy="330" r="22" fill="#2f7d4a"/>
<text x="700" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Presente</text>
<text x="700" y="390" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">en forma</text>
<text x="700" y="412" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">espiritual, en</text>
<text x="700" y="434" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">la iglesia</text>
<text x="700" y="462" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Col 1:13</text>
<circle cx="900" cy="330" r="22" fill="#c08a1e"/>
<text x="900" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#c08a1e" text-anchor="middle" font-weight="bold">Visible</text>
<text x="900" y="390" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">mil años en la</text>
<text x="900" y="412" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">tierra</text>
<text x="900" y="440" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Ap 20:4-6</text>
<circle cx="1080" cy="330" r="22" fill="#7a3fa0"/>
<text x="1080" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#7a3fa0" text-anchor="middle" font-weight="bold">Eterno</text>
<text x="1080" y="390" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">cielos nuevos y</text>
<text x="1080" y="412" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">tierra nueva</text>
<text x="1080" y="440" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Ap 22:3-5</text>
<line x1="215" y1="210" x2="215" y2="350" stroke="#1f2430" stroke-width="2" stroke-dasharray="6 6"/>
<text x="215" y="202" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">Primera venida</text>
<line x1="800" y1="210" x2="800" y2="350" stroke="#1f2430" stroke-width="2" stroke-dasharray="6 6"/>
<text x="800" y="202" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">Segunda venida</text>
<rect x="160" y="560" width="880" height="120" rx="14" fill="#fff" stroke="#c9c6be" stroke-width="2"/>
<text x="600" y="598" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="normal">El rechazo de los líderes de Israel no anuló la promesa: la postergó.</text>
<text x="600" y="628" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">«Desde ahora no me veréis, hasta que digáis: Bendito el que viene en el nombre del Señor» (Mt 23:39).</text>
<text x="600" y="656" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Hoy Cristo reina desde la diestra del Padre; cuando vuelva, reinará visiblemente.</text>
</svg>