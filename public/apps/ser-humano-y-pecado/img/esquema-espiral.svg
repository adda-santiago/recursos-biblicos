<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">De la tentación a la esclavitud</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Santiago 1:14-15 y Juan 8:34</text>
<rect x="120" y="150" width="380" height="76" rx="14" fill="#c08a1e28" stroke="#c08a1e" stroke-width="2"/>
<text x="310" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#c08a1e" text-anchor="middle" font-weight="bold">El deseo atrae</text>
<text x="310" y="210" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">«atraído y seducido»</text>
<line x1="320" y1="228" x2="400" y2="247" stroke="#c9c6be" stroke-width="3" stroke-linecap="round"/>
<polygon points="410,250 397,256 402,239" fill="#c9c6be"/>
<rect x="225" y="250" width="380" height="76" rx="14" fill="#8a5a2b28" stroke="#8a5a2b" stroke-width="2"/>
<text x="415" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#8a5a2b" text-anchor="middle" font-weight="bold">El deseo concibe</text>
<text x="415" y="310" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">«después que ha concebido»</text>
<line x1="425" y1="328" x2="505" y2="347" stroke="#c9c6be" stroke-width="3" stroke-linecap="round"/>
<polygon points="515,350 502,356 507,339" fill="#c9c6be"/>
<rect x="330" y="350" width="380" height="76" rx="14" fill="#b03a2e28" stroke="#b03a2e" stroke-width="2"/>
<text x="520" y="384" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#b03a2e" text-anchor="middle" font-weight="bold">Nace el pecado</text>
<text x="520" y="410" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">«da a luz el pecado»</text>
<line x1="530" y1="428" x2="610" y2="447" stroke="#c9c6be" stroke-width="3" stroke-linecap="round"/>
<polygon points="620,450 607,456 612,439" fill="#c9c6be"/>
<rect x="435" y="450" width="380" height="76" rx="14" fill="#7a3fa028" stroke="#7a3fa0" stroke-width="2"/>
<text x="625" y="484" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#7a3fa0" text-anchor="middle" font-weight="bold">Costumbre y cadena</text>
<text x="625" y="510" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">«esclavo es del pecado»</text>
<line x1="635" y1="528" x2="715" y2="547" stroke="#c9c6be" stroke-width="3" stroke-linecap="round"/>
<polygon points="725,550 712,556 717,539" fill="#c9c6be"/>
<rect x="540" y="550" width="380" height="76" rx="14" fill="#1f243028" stroke="#1f2430" stroke-width="2"/>
<text x="730" y="584" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="bold">La muerte</text>
<text x="730" y="610" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">«da a luz la muerte»</text>
<rect x="860" y="170" width="290" height="300" rx="14" fill="#2a6fb023" stroke="#2a6fb0" stroke-width="2"/>
<line x1="895" y1="450" x2="895" y2="219" stroke="#2a6fb0" stroke-width="6" stroke-linecap="round"/>
<polygon points="895,200 911,219 879,219" fill="#2a6fb0"/>
<text x="1025" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2a6fb0" text-anchor="middle" font-weight="bold">«Si el Hijo</text>
<text x="1025" y="298" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2a6fb0" text-anchor="middle" font-weight="bold">os libertare,</text>
<text x="1025" y="326" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2a6fb0" text-anchor="middle" font-weight="bold">seréis</text>
<text x="1025" y="354" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2a6fb0" text-anchor="middle" font-weight="bold">verdaderamente</text>
<text x="1025" y="382" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2a6fb0" text-anchor="middle" font-weight="bold">libres»</text>
<text x="1025" y="430" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Jn 8:36</text>
<text x="600" y="700" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Lo que comienza como una elección termina como una cadena; Cristo rompe la cadena.</text>
</svg>