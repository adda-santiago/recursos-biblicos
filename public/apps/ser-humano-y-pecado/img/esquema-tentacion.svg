<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Tres puertas de la tentación</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">En el Edén, en el mundo y en el desierto</text>
<rect x="70" y="130" width="360" height="70" rx="14" fill="#b03a2e33" stroke="#b03a2e" stroke-width="2"/>
<text x="250.0" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#b03a2e" text-anchor="middle" font-weight="bold">Eva en el Edén</text>
<text x="250.0" y="186" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 3:6</text>
<rect x="450" y="130" width="360" height="70" rx="14" fill="#8a5a2b33" stroke="#8a5a2b" stroke-width="2"/>
<text x="630.0" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#8a5a2b" text-anchor="middle" font-weight="bold">El mundo</text>
<text x="630.0" y="186" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">1 Jn 2:16</text>
<rect x="830" y="130" width="320" height="70" rx="14" fill="#2a6fb033" stroke="#2a6fb0" stroke-width="2"/>
<text x="990.0" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Jesús en el desierto</text>
<text x="990.0" y="186" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Mt 4:1-11</text>
<rect x="70" y="230" width="360" height="96" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="250.0" y="284" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">«bueno para comer»</text>
<rect x="450" y="230" width="360" height="96" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="630.0" y="284" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">«los deseos de la carne»</text>
<rect x="830" y="230" width="320" height="96" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="990.0" y="272" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">piedras en pan</text>
<text x="990.0" y="298" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2a6fb0" text-anchor="middle" font-weight="bold">«No sólo de pan»</text>
<rect x="70" y="350" width="360" height="96" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="250.0" y="404" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">«agradable a los ojos»</text>
<rect x="450" y="350" width="360" height="96" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="630.0" y="404" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">«los deseos de los ojos»</text>
<rect x="830" y="350" width="320" height="96" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="990.0" y="392" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">los reinos del mundo</text>
<text x="990.0" y="418" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2a6fb0" text-anchor="middle" font-weight="bold">«A él sólo servirás»</text>
<rect x="70" y="470" width="360" height="96" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="250.0" y="524" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">«codiciable para alcanzar la sabiduría»</text>
<rect x="450" y="470" width="360" height="96" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="630.0" y="524" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">«la vanagloria de la vida»</text>
<rect x="830" y="470" width="320" height="96" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="990.0" y="512" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">echarse del templo</text>
<text x="990.0" y="538" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2a6fb0" text-anchor="middle" font-weight="bold">«No tentarás»</text>
<text x="600" y="640" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">Donde Eva cayó, Jesús venció respondiendo con la Escritura: «Escrito está».</text>
<text x="600" y="676" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal">Mateo 4 cuenta las tentaciones en otro orden; la correspondencia entre las tres columnas es una ayuda didáctica.</text>
</svg>