<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">¿Dos o tres partes?</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Dos maneras evangélicas de describir al ser humano</text>
<circle cx="320" cy="330" r="150" fill="#8a5a2b28" stroke="#8a5a2b" stroke-width="3"/>
<circle cx="320" cy="330" r="80" fill="#2a6fb033" stroke="#2a6fb0" stroke-width="3"/>
<text x="320" y="218" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8a5a2b" text-anchor="middle" font-weight="bold">Cuerpo</text>
<text x="320" y="326" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Alma</text>
<text x="320" y="347" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#2a6fb0" text-anchor="middle" font-weight="bold">o espíritu</text>
<text x="320" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1f2430" text-anchor="middle" font-weight="bold">Dos partes</text>
<text x="320" y="520" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Mt 10:28; Ec 12:7; 2 Co 7:1</text>
<circle cx="880" cy="330" r="150" fill="#8a5a2b28" stroke="#8a5a2b" stroke-width="3"/>
<circle cx="880" cy="330" r="100" fill="#2f7d4a2d" stroke="#2f7d4a" stroke-width="3"/>
<circle cx="880" cy="330" r="52" fill="#2a6fb038" stroke="#2a6fb0" stroke-width="3"/>
<text x="880" y="212" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8a5a2b" text-anchor="middle" font-weight="bold">Cuerpo</text>
<text x="880" y="262" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Alma</text>
<text x="880" y="337" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Espíritu</text>
<text x="880" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1f2430" text-anchor="middle" font-weight="bold">Tres partes</text>
<text x="880" y="520" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">1 Ts 5:23; He 4:12</text>
<rect x="150" y="570" width="900" height="140" rx="14" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="600" y="606" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#9e2b25" text-anchor="middle" font-weight="bold">Lo que las dos afirman</text>
<text x="600" y="638" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">La persona es una unidad creada por Dios, con una parte material y otra inmaterial;</text>
<text x="600" y="659" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">sigue existiendo consciente después de la muerte y resucitará en cuerpo.</text>
<text x="600" y="680" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">Las Asambleas de Dios no fijan ninguna de las dos.</text>
</svg>