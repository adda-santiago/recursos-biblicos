<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">El ser humano en cuatro estados</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Una historia que va del Edén a la nueva Jerusalén</text>
<rect x="60" y="170" width="240" height="280" rx="14" fill="#2f7d4a23" stroke="#2f7d4a" stroke-width="2"/>
<text x="180.0" y="206" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Creado</text>
<text x="180.0" y="230" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 1–2</text>
<text x="180.0" y="256" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">Bueno y libre</text>
<text x="180.0" y="282" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">en comunión con Dios</text>
<text x="180.0" y="308" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal"></text>
<text x="180.0" y="334" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">podía no pecar</text>
<line x1="304" y1="310" x2="324" y2="310" stroke="#c9c6be" stroke-width="4" stroke-linecap="round"/>
<polygon points="336,310 324,320 324,300" fill="#c9c6be"/>
<rect x="340" y="170" width="240" height="280" rx="14" fill="#b03a2e23" stroke="#b03a2e" stroke-width="2"/>
<text x="460.0" y="206" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#b03a2e" text-anchor="middle" font-weight="bold">Caído</text>
<text x="460.0" y="230" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 3; Ro 5</text>
<text x="460.0" y="256" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">Separado de Dios</text>
<text x="460.0" y="282" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">esclavo del pecado</text>
<text x="460.0" y="308" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal"></text>
<text x="460.0" y="334" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">no puede dejar de</text>
<text x="460.0" y="360" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">pecar por sí mismo</text>
<line x1="584" y1="310" x2="604" y2="310" stroke="#c9c6be" stroke-width="4" stroke-linecap="round"/>
<polygon points="616,310 604,320 604,300" fill="#c9c6be"/>
<rect x="620" y="170" width="240" height="280" rx="14" fill="#2a6fb023" stroke="#2a6fb0" stroke-width="2"/>
<text x="740.0" y="206" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Redimido</text>
<text x="740.0" y="230" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Ro 6; 2 Co 5:17</text>
<text x="740.0" y="256" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">Nueva criatura</text>
<text x="740.0" y="282" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">con el Espíritu</text>
<text x="740.0" y="308" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal"></text>
<text x="740.0" y="334" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">puede no pecar</text>
<text x="740.0" y="360" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">por la gracia</text>
<line x1="864" y1="310" x2="884" y2="310" stroke="#c9c6be" stroke-width="4" stroke-linecap="round"/>
<polygon points="896,310 884,320 884,300" fill="#c9c6be"/>
<rect x="900" y="170" width="240" height="280" rx="14" fill="#c08a1e23" stroke="#c08a1e" stroke-width="2"/>
<text x="1020.0" y="206" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#c08a1e" text-anchor="middle" font-weight="bold">Glorificado</text>
<text x="1020.0" y="230" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">1 Jn 3:2; Ap 21</text>
<text x="1020.0" y="256" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">Semejante a Cristo</text>
<text x="1020.0" y="282" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">cuerpo glorioso</text>
<text x="1020.0" y="308" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal"></text>
<text x="1020.0" y="334" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">ya no podrá pecar</text>
<text x="600" y="530" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Adán podía no pecar; el pecador no puede dejar de pecar por sí mismo;</text>
<text x="600" y="560" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">el redimido puede no pecar por la gracia; el glorificado ya no podrá pecar.</text>
<text x="600" y="620" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Fórmula clásica desde Agustín de Hipona (siglo V)</text>
</svg>