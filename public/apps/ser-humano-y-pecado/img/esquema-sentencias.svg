<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Juicio y gracia en Génesis 3</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Las consecuencias del pecado y la primera promesa</text>
<rect x="60" y="140" width="240" height="200" rx="14" fill="#7a3fa023" stroke="#7a3fa0" stroke-width="2"/>
<text x="180.0" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#7a3fa0" text-anchor="middle" font-weight="bold">La serpiente</text>
<text x="180.0" y="200" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 3:14-15</text>
<text x="180.0" y="226" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">maldita</text>
<text x="180.0" y="249" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">humillada: «polvo comerás»</text>
<text x="180.0" y="272" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">su cabeza será herida</text>
<rect x="340" y="140" width="240" height="200" rx="14" fill="#b03a2e23" stroke="#b03a2e" stroke-width="2"/>
<text x="460.0" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#b03a2e" text-anchor="middle" font-weight="bold">La mujer</text>
<text x="460.0" y="200" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 3:16</text>
<text x="460.0" y="226" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">dolor en el parto</text>
<text x="460.0" y="249" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">conflicto en el matrimonio</text>
<rect x="620" y="140" width="240" height="200" rx="14" fill="#8a5a2b23" stroke="#8a5a2b" stroke-width="2"/>
<text x="740.0" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#8a5a2b" text-anchor="middle" font-weight="bold">El hombre</text>
<text x="740.0" y="200" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 3:17-19</text>
<text x="740.0" y="226" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">trabajo con fatiga</text>
<text x="740.0" y="249" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">«al polvo volverás»</text>
<rect x="900" y="140" width="240" height="200" rx="14" fill="#2f7d4a23" stroke="#2f7d4a" stroke-width="2"/>
<text x="1020.0" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f7d4a" text-anchor="middle" font-weight="bold">La tierra</text>
<text x="1020.0" y="200" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Gn 3:17-18</text>
<text x="1020.0" y="226" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">maldita por su causa</text>
<text x="1020.0" y="249" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">espinos y cardos</text>
<rect x="60" y="400" width="1080" height="200" rx="14" fill="#c08a1e23" stroke="#c08a1e" stroke-width="2"/>
<text x="600" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#c08a1e" text-anchor="middle" font-weight="bold">En medio del juicio, la gracia</text>
<text x="195" y="490" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">La promesa</text>
<text x="195" y="518" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal">«ésta te herirá en la cabeza» (Gn 3:15)</text>
<text x="465" y="490" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">El nombre de Eva</text>
<text x="465" y="518" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal">«madre de todos los vivientes» (Gn 3:20)</text>
<text x="735" y="490" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">Túnicas de pieles</text>
<text x="735" y="518" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal">Dios mismo los vistió (Gn 3:21)</text>
<text x="1005" y="490" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">Al final</text>
<text x="1005" y="518" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal">«no habrá más maldición» (Ap 22:3)</text>
<text x="600" y="570" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">Dios maldijo a la serpiente y a la tierra, pero no maldijo a Adán ni a Eva.</text>
<text x="600" y="660" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">Con la caída entraron el dolor, el conflicto, la fatiga y la muerte; con la promesa, la esperanza.</text>
</svg>