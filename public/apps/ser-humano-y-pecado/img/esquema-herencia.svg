<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">¿Qué heredamos de Adán?</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Tres explicaciones evangélicas del pecado original</text>
<rect x="470" y="120" width="260" height="70" rx="14" fill="#b03a2e33" stroke="#b03a2e" stroke-width="2"/>
<text x="600" y="165" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#b03a2e" text-anchor="middle" font-weight="bold">Adán</text>
<line x1="600" y1="192" x2="242" y2="266" stroke="#c9c6be" stroke-width="3" stroke-linecap="round"/>
<polygon points="230,268 240,256 244,275" fill="#c9c6be"/>
<rect x="70" y="275" width="320" height="230" rx="14" fill="#2a6fb023" stroke="#2a6fb0" stroke-width="2"/>
<text x="230.0" y="311" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Representación</text>
<text x="230.0" y="335" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">reformada (federal)</text>
<text x="230.0" y="361" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Adán actuó como cabeza</text>
<text x="230.0" y="384" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">del pacto; su culpa</text>
<text x="230.0" y="407" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">se imputa a todos</text>
<text x="230.0" y="430" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">(Ro 5:18-19)</text>
<line x1="600" y1="192" x2="592" y2="256" stroke="#c9c6be" stroke-width="3" stroke-linecap="round"/>
<polygon points="590,268 582,255 601,257" fill="#c9c6be"/>
<rect x="430" y="275" width="320" height="230" rx="14" fill="#7a3fa023" stroke="#7a3fa0" stroke-width="2"/>
<text x="590.0" y="311" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#7a3fa0" text-anchor="middle" font-weight="bold">Unidad</text>
<text x="590.0" y="335" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">realista</text>
<text x="590.0" y="361" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">toda la humanidad</text>
<text x="590.0" y="384" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">estaba en Adán, como</text>
<text x="590.0" y="407" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Leví en Abraham</text>
<text x="590.0" y="430" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">(He 7:9-10)</text>
<line x1="600" y1="192" x2="938" y2="265" stroke="#c9c6be" stroke-width="3" stroke-linecap="round"/>
<polygon points="950,268 936,275 940,256" fill="#c9c6be"/>
<rect x="790" y="275" width="320" height="230" rx="14" fill="#2f7d4a23" stroke="#2f7d4a" stroke-width="2"/>
<text x="950.0" y="311" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Naturaleza</text>
<text x="950.0" y="335" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">wesleyana y muchos pentecostales</text>
<text x="950.0" y="361" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">heredamos la naturaleza</text>
<text x="950.0" y="384" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">caída y la muerte; la culpa</text>
<text x="950.0" y="407" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">es personal al pecar</text>
<text x="950.0" y="430" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">(Ez 18:20; Ro 5:12)</text>
<rect x="70" y="555" width="1040" height="140" rx="14" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="600" y="592" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#9e2b25" text-anchor="middle" font-weight="bold">Lo que todas afirman</text>
<text x="600" y="624" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">Todos nacemos con una naturaleza caída, inclinada al pecado y bajo la muerte (Sal 51:5; Ef 2:3).</text>
<text x="600" y="645" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">Nadie se salva sin Cristo, y los niños que mueren pequeños están cubiertos por su obra.</text>
</svg>