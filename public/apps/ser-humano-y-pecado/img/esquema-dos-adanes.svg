<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Dos hombres, dos resultados</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Romanos 5:12-21 y 1 Corintios 15:22, 45</text>
<rect x="230" y="120" width="370" height="70" rx="14" fill="#b03a2e33" stroke="#b03a2e" stroke-width="2"/>
<text x="415" y="165" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#b03a2e" text-anchor="middle" font-weight="bold">Adán</text>
<rect x="690" y="120" width="370" height="70" rx="14" fill="#2a6fb033" stroke="#2a6fb0" stroke-width="2"/>
<text x="875" y="165" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Cristo, el postrer Adán</text>
<text x="200" y="255" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="end" font-weight="bold">Un acto</text>
<rect x="230" y="215" width="370" height="62" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="415" y="253" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">desobediencia (Ro 5:19)</text>
<rect x="690" y="215" width="370" height="62" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="875" y="253" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">obediencia (Ro 5:19)</text>
<text x="200" y="333" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="end" font-weight="bold">Entró</text>
<rect x="230" y="293" width="370" height="62" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="415" y="331" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">el pecado (Ro 5:12)</text>
<rect x="690" y="293" width="370" height="62" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="875" y="331" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">la gracia y el don (Ro 5:15)</text>
<text x="200" y="411" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="end" font-weight="bold">Veredicto</text>
<rect x="230" y="371" width="370" height="62" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="415" y="409" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">condenación (Ro 5:18)</text>
<rect x="690" y="371" width="370" height="62" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="875" y="409" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">justificación de vida (Ro 5:18)</text>
<text x="200" y="489" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="end" font-weight="bold">Reina</text>
<rect x="230" y="449" width="370" height="62" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="415" y="487" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">la muerte (Ro 5:17)</text>
<rect x="690" y="449" width="370" height="62" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="875" y="487" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">la vida (Ro 5:17, 21)</text>
<text x="200" y="567" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="end" font-weight="bold">Los suyos</text>
<rect x="230" y="527" width="370" height="62" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="415" y="565" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">«en Adán todos mueren»</text>
<rect x="690" y="527" width="370" height="62" rx="10" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="875" y="565" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">«en Cristo todos serán vivificados»</text>
<text x="645" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#c08a1e" text-anchor="middle" font-weight="bold">«mucho</text>
<text x="645" y="446" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#c08a1e" text-anchor="middle" font-weight="bold">más»</text>
<text x="600" y="640" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">«Mas cuando el pecado abundó, sobreabundó la gracia» (Ro 5:20)</text>
<text x="600" y="680" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">Pertenecemos a Adán por nacimiento; a Cristo, por la fe.</text>
</svg>