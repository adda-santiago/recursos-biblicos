<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">La imagen de Dios</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Tres aspectos que Génesis 1:26-28 mantiene juntos</text>
<circle cx="600" cy="305" r="165" fill="#2a6fb028" stroke="#2a6fb0" stroke-width="3"/>
<circle cx="490" cy="480" r="165" fill="#2f7d4a28" stroke="#2f7d4a" stroke-width="3"/>
<circle cx="710" cy="480" r="165" fill="#c08a1e28" stroke="#c08a1e" stroke-width="3"/>
<text x="600" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Lo que es</text>
<text x="600" y="240" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">razón, voluntad, conciencia,</text>
<text x="600" y="261" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">capacidad de amar y adorar</text>
<text x="435" y="520" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Su relación</text>
<text x="435" y="548" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">con Dios y con</text>
<text x="435" y="569" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">los demás: «varón</text>
<text x="435" y="590" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">y hembra» (Gn 1:27)</text>
<text x="765" y="520" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#c08a1e" text-anchor="middle" font-weight="bold">Su tarea</text>
<text x="765" y="548" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">gobernar la tierra</text>
<text x="765" y="569" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">en nombre de Dios</text>
<text x="765" y="590" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="normal">(Gn 1:28)</text>
<circle cx="600" cy="422" r="52" fill="#ffffff" stroke="#9e2b25" stroke-width="3"/>
<text x="600" y="418" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#9e2b25" text-anchor="middle" font-weight="bold">Cristo</text>
<text x="600" y="442" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Col 1:15</text>
<text x="170" y="180" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#b03a2e" text-anchor="start" font-weight="bold">Dañada por el pecado</text>
<text x="170" y="206" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">pero no perdida</text>
<text x="170" y="227" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">(Gn 9:6; Stg 3:9)</text>
<text x="1030" y="180" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2a6fb0" text-anchor="end" font-weight="bold">Renovada en Cristo</text>
<text x="1030" y="206" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="end" font-weight="normal">de gloria en gloria</text>
<text x="1030" y="227" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="end" font-weight="normal">(2 Co 3:18; Col 3:10)</text>
</svg>