<text x="600.0" y="720.0" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">«hoy es ya el tercer día que esto ha acontecido» (Lucas 24:21)</text>
<text x="600.0" y="756.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal">Ester: ayuno de tres días, noche y día, y «al tercer día» entra al rey (Est 4:16; 5:1).</text>
