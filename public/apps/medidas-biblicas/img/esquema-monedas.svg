<text x="360.0" y="536.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1f2430" text-anchor="start" font-weight="bold">4 dracmas</text>
<text x="610.0" y="536.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f7d4a" text-anchor="start" font-weight="bold">= 1 estatero (siclo de Tiro)</text>
<text x="1025.0" y="536.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">Mt 17:27</text>
<rect x="320.0" y="580.0" width="760.0" height="70.0" rx="12" fill="#ffffff" stroke="#c08a1e" stroke-width="3"/>
