<text x="200.0" y="270.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="240.0" y="272.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1f2430" text-anchor="start" font-weight="bold">4 cuadrantes</text>
<text x="490.0" y="272.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#7a3fa0" text-anchor="start" font-weight="bold">= 1 cuarto (as)</text>
<text x="905.0" y="272.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">Mt 10:29</text>
<rect x="200.0" y="316.0" width="760.0" height="70.0" rx="12" fill="#ffffff" stroke="#2a6fb0" stroke-width="3"/>
