<text x="360.0" y="622.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
<text x="400.0" y="624.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1f2430" text-anchor="start" font-weight="bold">100 dracmas</text>
<text x="650.0" y="624.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#c08a1e" text-anchor="start" font-weight="bold">= 1 mina</text>
<text x="1065.0" y="624.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">Lc 19:13</text>
<rect x="360.0" y="668.0" width="760.0" height="70.0" rx="12" fill="#ffffff" stroke="#b03a2e" stroke-width="3"/>
<circle cx="400" cy="703" r="22" fill="#b03a2e"/>
<text x="400.0" y="710.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">7</text>
<text x="440.0" y="712.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1f2430" text-anchor="start" font-weight="bold">6.000 denarios</text>
<text x="690.0" y="712.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#b03a2e" text-anchor="start" font-weight="bold">= 1 talento</text>
<text x="1105.0" y="712.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">Mt 25:15</text>
<rect x="120.0" y="770.0" width="960.0" height="56.0" rx="10" fill="#e7e2d6"/>
<text x="600.0" y="806.0" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="normal">1 denario = el pago de un día de trabajo · 1 denario = 128 blancas</text>
</svg>