<text x="240.0" y="358.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="280.0" y="360.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1f2430" text-anchor="start" font-weight="bold">16 cuartos</text>
<text x="530.0" y="360.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2a6fb0" text-anchor="start" font-weight="bold">= 1 denario = 1 dracma</text>
<text x="945.0" y="360.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">Mt 20:2; Lc 15:8</text>
<rect x="240.0" y="404.0" width="760.0" height="70.0" rx="12" fill="#ffffff" stroke="#1e8a8a" stroke-width="3"/>
<circle cx="280" cy="439" r="22" fill="#1e8a8a"/>
<text x="280.0" y="446.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="320.0" y="448.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1f2430" text-anchor="start" font-weight="bold">2 dracmas</text>
<text x="570.0" y="448.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1e8a8a" text-anchor="start" font-weight="bold">= impuesto del templo</text>
<text x="985.0" y="448.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">Mt 17:24</text>
<rect x="280.0" y="492.0" width="760.0" height="70.0" rx="12" fill="#ffffff" stroke="#2f7d4a" stroke-width="3"/>
