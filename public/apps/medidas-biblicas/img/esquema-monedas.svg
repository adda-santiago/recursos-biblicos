<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860">
<rect width="1200" height="860" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600.0" y="64.0" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Las monedas del Nuevo Testamento</text>
<text x="600.0" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Equivalencias en tiempos de Jesús</text>
<rect x="120.0" y="140.0" width="760.0" height="70.0" rx="12" fill="#ffffff" stroke="#4a4a4a" stroke-width="3"/>
<circle cx="160" cy="175" r="22" fill="#4a4a4a"/>
<text x="160.0" y="182.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="200.0" y="184.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1f2430" text-anchor="start" font-weight="bold">2 blancas (leptos)</text>
<text x="450.0" y="184.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#4a4a4a" text-anchor="start" font-weight="bold">= 1 cuadrante</text>
<text x="865.0" y="184.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="normal" font-style="italic">Mr 12:42</text>
<rect x="160.0" y="228.0" width="760.0" height="70.0" rx="12" fill="#ffffff" stroke="#7a3fa0" stroke-width="3"/>
