<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860">
<rect width="1200" height="860" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600.0" y="64.0" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">¿Cuándo empieza el día?</text>
<text x="600.0" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">«Y fue la tarde y la mañana un día» (Génesis 1:5)</text>
<text x="120.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7080" text-anchor="start" font-weight="bold">Día moderno</text>
<rect x="120.0" y="200" width="120.0" height="60" fill="#2b3350"/>
<rect x="240.0" y="200" width="240.0" height="60" fill="#f2d48a"/>
<rect x="480.0" y="200" width="240.0" height="60" fill="#2b3350"/>
<rect x="720.0" y="200" width="240.0" height="60" fill="#f2d48a"/>
<rect x="960.0" y="200" width="120.0" height="60" fill="#2b3350"/>
<text x="120.0" y="370.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7080" text-anchor="start" font-weight="bold">Día bíblico</text>
<rect x="120.0" y="420" width="120.0" height="60" fill="#2b3350"/>
<rect x="240.0" y="420" width="240.0" height="60" fill="#f2d48a"/>
<rect x="480.0" y="420" width="240.0" height="60" fill="#2b3350"/>
<rect x="720.0" y="420" width="240.0" height="60" fill="#f2d48a"/>
<rect x="960.0" y="420" width="120.0" height="60" fill="#2b3350"/>
<line x1="360.0" y1="190.0" x2="360.0" y2="270.0" stroke="#9e2b25" stroke-width="4"/>
<text x="360.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9e2b25" text-anchor="middle" font-weight="normal">viernes 0:00</text>
<line x1="840.0" y1="190.0" x2="840.0" y2="270.0" stroke="#9e2b25" stroke-width="4"/>
<text x="840.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9e2b25" text-anchor="middle" font-weight="normal">sábado 0:00</text>
<line x1="360.0" y1="176.0" x2="840.0" y2="176.0" stroke="#1f2430" stroke-width="2"/>
<text x="600.0" y="168.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="bold">viernes</text>
<line x1="240.0" y1="410.0" x2="240.0" y2="490.0" stroke="#9e2b25" stroke-width="4"/>
<text x="240.0" y="520.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9e2b25" text-anchor="middle" font-weight="normal">jueves al ponerse el sol</text>
<line x1="720.0" y1="410.0" x2="720.0" y2="490.0" stroke="#9e2b25" stroke-width="4"/>
<text x="720.0" y="520.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9e2b25" text-anchor="middle" font-weight="normal">viernes al ponerse el sol</text>
<line x1="240.0" y1="396.0" x2="720.0" y2="396.0" stroke="#1f2430" stroke-width="2"/>
<text x="480.0" y="388.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="bold">sexto día: la preparación</text>
<line x1="720.0" y1="396.0" x2="1080.0" y2="396.0" stroke="#9e2b25" stroke-width="2"/>
<text x="900.0" y="388.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#9e2b25" text-anchor="middle" font-weight="bold">día de reposo →</text>
<rect x="160.0" y="600.0" width="880.0" height="150.0" rx="12" fill="#ffffff" stroke="#c9c6be" stroke-width="2"/>
<text x="600.0" y="640.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">El sábado comienza el viernes al ponerse el sol y termina el sábado al ponerse el sol.</text>
<text x="600.0" y="676.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Por eso Jesús fue sepultado de prisa: «estaba para comenzar el día de reposo» (Lc 23:54).</text>
<text x="600.0" y="712.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Las doce horas del día van del amanecer a la puesta del sol (Jn 11:9).</text>
</svg>