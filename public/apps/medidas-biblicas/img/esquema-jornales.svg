<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860">
<rect width="1200" height="860" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600.0" y="64.0" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Sumas de los evangelios en días de trabajo</text>
<text x="600.0" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">1 denario = 1 día; unos 300 días de trabajo al año</text>
<text x="404.0" y="176.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="end" font-weight="bold">2 denarios</text>
<text x="404.0" y="200.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="normal">Lc 10:35 · el buen samaritano</text>
<rect x="420.0" y="160.0" width="6.0" height="36.0" rx="6" fill="#1e8a8a"/>
<text x="435.5" y="185.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="bold">2 días</text>
<text x="404.0" y="276.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="end" font-weight="bold">100 denarios</text>
<text x="404.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="normal">Mt 18:28 · la deuda del consiervo</text>
<rect x="420.0" y="260.0" width="173.3" height="36.0" rx="6" fill="#2a6fb0"/>
<text x="605.3" y="285.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="bold">100 días · unos 4 meses</text>
<text x="404.0" y="376.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="end" font-weight="bold">1 mina</text>
<text x="404.0" y="400.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="normal">Lc 19:13</text>
<rect x="420.0" y="360.0" width="173.3" height="36.0" rx="6" fill="#7a3fa0"/>
<text x="605.3" y="385.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="bold">100 días · unos 4 meses</text>
<text x="404.0" y="476.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="end" font-weight="bold">200 denarios</text>
<text x="404.0" y="500.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="normal">Jn 6:7 · pan para la multitud</text>
<rect x="420.0" y="460.0" width="346.7" height="36.0" rx="6" fill="#2f7d4a"/>
<text x="778.7" y="485.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="bold">200 días · unos 8 meses</text>
<text x="404.0" y="576.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="end" font-weight="bold">300 denarios</text>
<text x="404.0" y="600.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="normal">Jn 12:5 · el perfume de María</text>
<rect x="420.0" y="560.0" width="520.0" height="36.0" rx="6" fill="#c08a1e"/>
<text x="952.0" y="585.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="bold">300 días · un año</text>
<text x="404.0" y="676.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="end" font-weight="bold">1 talento</text>
<text x="404.0" y="700.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="normal">Mt 25:15</text>
<rect x="420.0" y="660.0" width="520.0" height="36.0" rx="6" fill="#b03a2e"/>
<path d="M936.0,660 l14,18 l-14,18" fill="none" stroke="#f6f3ec" stroke-width="4"/>
<text x="430.0" y="728.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#b03a2e" text-anchor="start" font-weight="bold">6.000 días · unos 20 años: la barra real sería 20 veces más larga</text>
<text x="600.0" y="815.0" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">Diez mil talentos (Mt 18:24) serían unos 200.000 años de trabajo.</text>
