<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860">
<rect width="1200" height="860" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600.0" y="64.0" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Tres maneras de decir lo mismo</text>
<text x="600.0" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Daniel y Apocalipsis: el mismo período con meses de treinta días</text>
<rect x="110.0" y="160.0" width="980.0" height="100.0" rx="14" fill="#ffffff" stroke="#7a3fa0" stroke-width="3"/>
<text x="140.0" y="204.0" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#7a3fa0" text-anchor="start" font-weight="bold">Tiempo, y tiempos, y medio tiempo</text>
<text x="140.0" y="236.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">Dn 7:25; 12:7; Ap 12:14</text>
<text x="1060.0" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1f2430" text-anchor="end" font-weight="bold">1 + 2 + ½ = 3½ años</text>
<rect x="110.0" y="284.0" width="980.0" height="100.0" rx="14" fill="#ffffff" stroke="#2a6fb0" stroke-width="3"/>
<text x="140.0" y="328.0" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#2a6fb0" text-anchor="start" font-weight="bold">Cuarenta y dos meses</text>
<text x="140.0" y="360.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">Ap 11:2; 13:5</text>
<text x="1060.0" y="344.0" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1f2430" text-anchor="end" font-weight="bold">3½ × 12 = 42 meses</text>
<rect x="110.0" y="408.0" width="980.0" height="100.0" rx="14" fill="#ffffff" stroke="#2f7d4a" stroke-width="3"/>
<text x="140.0" y="452.0" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#2f7d4a" text-anchor="start" font-weight="bold">Mil doscientos sesenta días</text>
<text x="140.0" y="484.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="start" font-weight="normal" font-style="italic">Ap 11:3; 12:6</text>
<text x="1060.0" y="468.0" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1f2430" text-anchor="end" font-weight="bold">42 × 30 = 1.260 días</text>
<text x="600.0" y="574.0" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="normal">La semana setenta de Daniel (Dn 9:27): siete años</text>
<rect x="160.0" y="600.0" width="440.0" height="70.0" rx="8" fill="#2a6fb0"/>
<rect x="600.0" y="600.0" width="440.0" height="70.0" rx="8" fill="#b03a2e"/>
<text x="380.0" y="644.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">3½ años · 1.260 días</text>
<text x="820.0" y="644.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">3½ años · 1.260 días</text>
<line x1="600.0" y1="586.0" x2="600.0" y2="696.0" stroke="#1f2430" stroke-width="3"/>
<text x="600.0" y="724.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">A la mitad de la semana cesa el sacrificio</text>
<text x="600.0" y="800.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">El tiempo profético no permite fijar fechas: del día y la hora nadie sabe (Mt 24:36).</text>
</svg>