<text x="600.0" y="688.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">Éxodo 38:25-26: 603.550 hombres × medio siclo = 301.775 siclos</text>
<text x="600.0" y="720.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#9e2b25" text-anchor="middle" font-weight="bold">= 100 talentos + 1.775 siclos  →  1 talento = 3.000 siclos</text>
<text x="600.0" y="750.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">El propio texto bíblico conserva la clave del sistema.</text>
<text x="600.0" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Las pesas no están a escala: un talento pesa unas 60.000 veces más que un gera.</text>
