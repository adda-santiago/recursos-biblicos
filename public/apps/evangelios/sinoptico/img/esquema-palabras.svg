<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<rect width="1200" height="520" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Un mismo paréntesis en tres evangelios</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">El narrador interrumpe a Jesús en el mismo punto de la frase</text>
<rect x="40" y="130" width="360" height="300" rx="10" fill="#ffffff" fill-opacity="1.0" stroke="#2a6fb0" stroke-width="2"/>
<rect x="40" y="130" width="360" height="8" fill="#2a6fb0"/>
<text x="220" y="175" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Mateo 9:6</text>
<text x="60" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430">Pues para que sepáis que el Hijo</text>
<text x="60" y="251" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430">del Hombre tiene potestad en la</text>
<text x="60" y="282" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430">tierra para perdonar pecados</text>
<text x="60" y="313" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430"><tspan fill="#9e2b25" font-weight="bold">(dice entonces al paralítico)</tspan>:</text>
<text x="60" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430">Levántate, toma tu cama, y vete</text>
<text x="60" y="375" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430">a tu casa.</text>
<rect x="420" y="130" width="360" height="300" rx="10" fill="#ffffff" fill-opacity="1.0" stroke="#b03a2e" stroke-width="2"/>
<rect x="420" y="130" width="360" height="8" fill="#b03a2e"/>
<text x="600" y="175" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#b03a2e" text-anchor="middle" font-weight="bold">Marcos 2:10-11</text>
<text x="440" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430">Pues para que sepáis que el Hijo</text>
<text x="440" y="251" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430">del Hombre tiene potestad en la</text>
<text x="440" y="282" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430">tierra para perdonar pecados</text>
<text x="440" y="313" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430"><tspan fill="#9e2b25" font-weight="bold">(dijo al paralítico)</tspan>: A ti te</text>
<text x="440" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430">digo: Levántate, toma tu lecho,</text>
<text x="440" y="375" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430">y vete a tu casa.</text>
<rect x="800" y="130" width="360" height="300" rx="10" fill="#ffffff" fill-opacity="1.0" stroke="#2f7d4a" stroke-width="2"/>
<rect x="800" y="130" width="360" height="8" fill="#2f7d4a"/>
<text x="980" y="175" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Lucas 5:24</text>
<text x="820" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430">Pues para que sepáis que el Hijo</text>
<text x="820" y="251" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430">del Hombre tiene potestad en la</text>
<text x="820" y="282" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430">tierra para perdonar pecados</text>
<text x="820" y="313" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430"><tspan fill="#9e2b25" font-weight="bold">(dijo al paralítico)</tspan>: A ti te</text>
<text x="820" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430">digo: Levántate, toma tu lecho,</text>
<text x="820" y="375" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430">y vete a tu casa.</text>
<text x="600" y="480" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">Texto de la Reina-Valera 1960. En rojo, la nota del narrador; en griego las tres frases coinciden casi palabra por palabra.</text>
</svg>