<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
<rect width="1200" height="720" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Del hecho al evangelio escrito</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">El Espíritu Santo acompaña todo el proceso</text>
<rect x="80" y="500" width="760" height="110" rx="10" fill="#b03a2e" fill-opacity="0.14" stroke="#b03a2e" stroke-width="2"/>
<text x="460" y="544" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1f2430" text-anchor="middle" font-weight="bold">Los hechos y las palabras de Jesús</text>
<text x="460" y="576" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">Lo que Jesús hizo y enseñó (Hch 1:1)</text>
<rect x="80" y="350" width="760" height="110" rx="10" fill="#c08a1e" fill-opacity="0.14" stroke="#c08a1e" stroke-width="2"/>
<text x="460" y="394" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1f2430" text-anchor="middle" font-weight="bold">Los testigos y la investigación</text>
<text x="460" y="426" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">Los apóstoles enseñan; el evangelista recuerda, investiga y elige (Lc 1:1-3)</text>
<rect x="80" y="200" width="760" height="110" rx="10" fill="#2a6fb0" fill-opacity="0.14" stroke="#2a6fb0" stroke-width="2"/>
<text x="460" y="244" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1f2430" text-anchor="middle" font-weight="bold">El evangelio escrito</text>
<text x="460" y="276" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">Palabra de un autor humano y Palabra de Dios (2 P 1:21)</text>
<line x1="460" y1="495" x2="460.0" y2="474.0" stroke="#1f2430" stroke-width="3"/>
<polygon points="460,466 465.5,478.9 454.5,478.9" fill="#1f2430"/>
<line x1="460" y1="345" x2="460.0" y2="324.0" stroke="#1f2430" stroke-width="3"/>
<polygon points="460,316 465.5,328.9 454.5,328.9" fill="#1f2430"/>
<rect x="890" y="200" width="230" height="450" rx="10" fill="#7a3fa0" fill-opacity="0.12" stroke="#7a3fa0" stroke-width="2"/>
<text x="1005" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#7a3fa0" text-anchor="middle" font-weight="bold">El Espíritu Santo</text>
<text x="1005" y="320" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="bold">recuerda</text>
<text x="1005" y="354" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">(Jn 14:26)</text>
<text x="1005" y="388" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="normal"></text>
<text x="1005" y="422" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="bold">guía</text>
<text x="1005" y="456" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">(Jn 16:13)</text>
<text x="1005" y="490" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="normal"></text>
<text x="1005" y="524" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="bold">inspira</text>
<text x="1005" y="558" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">(2 Ti 3:16)</text>
</svg>