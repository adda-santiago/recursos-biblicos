<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 896" width="1200" height="896">
<rect width="1200" height="896" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#1f2430" text-anchor="middle" font-weight="normal">El sentido básico de las preposiciones</text>
<text x="600" y="106" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#6b7080" text-anchor="middle" font-weight="normal">Casi todas nacen de una idea de lugar o de movimiento</text>
<circle cx="600" cy="470" r="130" fill="#fff" stroke="#1f2430" stroke-width="4"/>
<circle cx="600" cy="470" r="12" fill="#9e2b25"/>
<text x="600" y="520" font-family="'Noto Serif', 'Gentium Plus', 'Times New Roman', serif" font-size="36" fill="#9e2b25" text-anchor="middle" font-weight="normal">ἐν</text>
<text x="600" y="550" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal">en, dentro</text>
<line x1="240" y1="470" x2="560" y2="470" stroke="#2a6fb0" stroke-width="5" marker-end="url(#fl)"/>
<text x="300" y="450" font-family="'Noto Serif', 'Gentium Plus', 'Times New Roman', serif" font-size="34" fill="#2a6fb0" text-anchor="middle" font-weight="normal">εἰς</text>
<text x="300" y="510" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal">hacia dentro</text>
<line x1="640" y1="470" x2="960" y2="470" stroke="#2f7d4a" stroke-width="5" marker-end="url(#fl)"/>
<text x="900" y="450" font-family="'Noto Serif', 'Gentium Plus', 'Times New Roman', serif" font-size="34" fill="#2f7d4a" text-anchor="middle" font-weight="normal">ἐκ</text>
<text x="900" y="510" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal">de dentro hacia fuera</text>
<line x1="700" y1="370" x2="900" y2="220" stroke="#c08a1e" stroke-width="5" marker-end="url(#fl)"/>
<text x="985" y="215" font-family="'Noto Serif', 'Gentium Plus', 'Times New Roman', serif" font-size="34" fill="#c08a1e" text-anchor="middle" font-weight="normal">ἀπό</text>
<text x="985" y="252" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal">desde, lejos de</text>
<line x1="300" y1="220" x2="500" y2="370" stroke="#7a3fa0" stroke-width="5" marker-end="url(#fl)"/>
<text x="270" y="205" font-family="'Noto Serif', 'Gentium Plus', 'Times New Roman', serif" font-size="34" fill="#7a3fa0" text-anchor="middle" font-weight="normal">πρός</text>
<text x="270" y="245" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal">hacia, junto a</text>
<rect x="540" y="300" width="120" height="30" rx="6" fill="#1e8a8a"/>
<text x="600" y="280" font-family="'Noto Serif', 'Gentium Plus', 'Times New Roman', serif" font-size="34" fill="#1e8a8a" text-anchor="middle" font-weight="normal">ἐπί</text>
<text x="730" y="320" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal">sobre</text>
<rect x="540" y="612" width="120" height="30" rx="6" fill="#2a6fb0"/>
<text x="600" y="682" font-family="'Noto Serif', 'Gentium Plus', 'Times New Roman', serif" font-size="34" fill="#2a6fb0" text-anchor="middle" font-weight="normal">ὑπό</text>
<text x="525" y="634" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="end" font-weight="normal">debajo</text>
<circle cx="790" cy="590" r="22" fill="#c08a1e"/>
<text x="870" y="605" font-family="'Noto Serif', 'Gentium Plus', 'Times New Roman', serif" font-size="30" fill="#c08a1e" text-anchor="middle" font-weight="normal">παρά</text>
<text x="870" y="635" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal">al lado de</text>
<circle cx="410" cy="590" r="22" fill="#7a3fa0"/><circle cx="454" cy="590" r="22" fill="none" stroke="#7a3fa0" stroke-width="3"/>
<text x="320" y="605" font-family="'Noto Serif', 'Gentium Plus', 'Times New Roman', serif" font-size="30" fill="#7a3fa0" text-anchor="middle" font-weight="normal">μετά</text>
<text x="320" y="635" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal">con</text>
<path d="M 380 430 Q 600 460 820 430" fill="none" stroke="#9e2b25" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#fl)"/>
<text x="430" y="410" font-family="'Noto Serif', 'Gentium Plus', 'Times New Roman', serif" font-size="30" fill="#9e2b25" text-anchor="middle" font-weight="normal">διά</text>
<text x="430" y="378" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal">a través de</text>
<circle cx="600" cy="470" r="180" fill="none" stroke="#c9c6be" stroke-width="3" stroke-dasharray="4 8"/>
<text x="385" y="685" font-family="'Noto Serif', 'Gentium Plus', 'Times New Roman', serif" font-size="30" fill="#1f2430" text-anchor="middle" font-weight="normal">περί</text>
<text x="385" y="715" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b7080" text-anchor="middle" font-weight="normal">alrededor</text>
<text x="600" y="870" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">Del lugar nacen los demás sentidos: εἰς σωτηρίαν, «para salvación»; ἐκ πίστεως, «por la fe».</text>
</svg>