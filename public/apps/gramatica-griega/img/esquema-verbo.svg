<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 896" width="1200" height="896">
<rect width="1200" height="896" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#1f2430" text-anchor="middle" font-weight="normal">Las piezas de una forma verbal</text>
<text x="600" y="106" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#6b7080" text-anchor="middle" font-weight="normal">ἐλύσαμεν, «desatamos» (aoristo)</text>
<rect x="190.0" y="220" width="140" height="170" rx="16" fill="#fff" stroke="#2a6fb0" stroke-width="4"/>
<text x="260.0" y="335" font-family="'Noto Serif', 'Gentium Plus', 'Times New Roman', serif" font-size="84" fill="#2a6fb0" text-anchor="middle" font-weight="normal">ἐ</text>
<line x1="260.0" y1="400" x2="260.0" y2="470" stroke="#2a6fb0" stroke-width="3"/>
<text x="260.0" y="505" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2a6fb0" text-anchor="middle" font-weight="bold">aumento</text>
<text x="260.0" y="537" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">en el pasado</text>
<rect x="340.0" y="220" width="220" height="170" rx="16" fill="#fff" stroke="#9e2b25" stroke-width="4"/>
<text x="450.0" y="335" font-family="'Noto Serif', 'Gentium Plus', 'Times New Roman', serif" font-size="84" fill="#9e2b25" text-anchor="middle" font-weight="normal">λυ</text>
<line x1="450.0" y1="400" x2="450.0" y2="470" stroke="#9e2b25" stroke-width="3"/>
<text x="450.0" y="505" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#9e2b25" text-anchor="middle" font-weight="bold">raíz</text>
<text x="450.0" y="537" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">desatar</text>
<rect x="570.0" y="220" width="190" height="170" rx="16" fill="#fff" stroke="#c08a1e" stroke-width="4"/>
<text x="665.0" y="335" font-family="'Noto Serif', 'Gentium Plus', 'Times New Roman', serif" font-size="84" fill="#c08a1e" text-anchor="middle" font-weight="normal">σα</text>
<line x1="665.0" y1="400" x2="665.0" y2="470" stroke="#c08a1e" stroke-width="3"/>
<text x="665.0" y="505" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#c08a1e" text-anchor="middle" font-weight="bold">marca del aoristo</text>
<text x="665.0" y="537" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">la acción como un todo</text>
<rect x="770.0" y="220" width="230" height="170" rx="16" fill="#fff" stroke="#2f7d4a" stroke-width="4"/>
<text x="885.0" y="335" font-family="'Noto Serif', 'Gentium Plus', 'Times New Roman', serif" font-size="84" fill="#2f7d4a" text-anchor="middle" font-weight="normal">μεν</text>
<line x1="885.0" y1="400" x2="885.0" y2="470" stroke="#2f7d4a" stroke-width="3"/>
<text x="885.0" y="505" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f7d4a" text-anchor="middle" font-weight="bold">terminación</text>
<text x="885.0" y="537" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">nosotros</text>
<text x="330" y="640" font-family="'Noto Serif', 'Gentium Plus', 'Times New Roman', serif" font-size="34" fill="#1f2430" text-anchor="end" font-weight="normal">ἔλυσα</text>
<text x="360" y="636" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430" text-anchor="start" font-weight="normal" font-style="italic">desaté</text>
<text x="1000" y="636" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#6b7080" text-anchor="end" font-weight="normal">otra terminación: otra persona</text>
<text x="330" y="702" font-family="'Noto Serif', 'Gentium Plus', 'Times New Roman', serif" font-size="34" fill="#1f2430" text-anchor="end" font-weight="normal">λύομεν</text>
<text x="360" y="698" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430" text-anchor="start" font-weight="normal" font-style="italic">desatamos (presente)</text>
<text x="1000" y="698" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#6b7080" text-anchor="end" font-weight="normal">sin aumento ni -σα-: otro tiempo</text>
<text x="330" y="764" font-family="'Noto Serif', 'Gentium Plus', 'Times New Roman', serif" font-size="34" fill="#1f2430" text-anchor="end" font-weight="normal">ἐλύθημεν</text>
<text x="360" y="760" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430" text-anchor="start" font-weight="normal" font-style="italic">fuimos desatados</text>
<text x="1000" y="760" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#6b7080" text-anchor="end" font-weight="normal">-θη-: voz pasiva</text>
<text x="600" y="860" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">Cada pieza responde una pregunta: cuándo, qué, cómo se mira y quién.</text>
</svg>