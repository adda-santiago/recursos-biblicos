<text x="118" y="565" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">E</text>
<text x="144" y="557" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal">Edicto a favor de los judíos</text>
<text x="144" y="575" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a5a2b" text-anchor="start" font-weight="normal" font-style="italic">tras 8:12</text>
<rect x="90" y="592" width="420" height="34" rx="6" fill="#fff" stroke="#c9c6be" stroke-width="2"/>
<text x="300" y="615" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">Capítulos 9–10 (texto hebreo)</text>
<rect x="90" y="636" width="420" height="46" rx="6" fill="#f3e7c9" stroke="#c08a1e" stroke-width="2"/>
<circle cx="118" cy="659" r="15" fill="#c08a1e"/>
<text x="118" y="665" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">F</text>
<text x="144" y="657" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal">Explicación del sueño</text>
<text x="144" y="675" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a5a2b" text-anchor="start" font-weight="normal" font-style="italic">tras 10:3</text>
<text x="900" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1f2430" text-anchor="middle" font-weight="bold">Daniel</text>
<rect x="690" y="180" width="420" height="70" rx="6" fill="#fff" stroke="#c9c6be" stroke-width="2"/>
<text x="900" y="222" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">Daniel 1–3:23 (texto hebreo y arameo)</text>
<rect x="690" y="262" width="420" height="70" rx="6" fill="#f3e7c9" stroke="#c08a1e" stroke-width="2"/>
<text x="900" y="292" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">Oración de Azarías y cántico de los tres jóvenes</text>
<text x="900" y="316" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a5a2b" text-anchor="middle" font-weight="normal" font-style="italic">Dentro del capítulo 3, entre los versículos 23 y 24</text>
<rect x="690" y="344" width="420" height="70" rx="6" fill="#fff" stroke="#c9c6be" stroke-width="2"/>
<text x="900" y="386" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">Daniel 3:24–12 (texto hebreo y arameo)</text>
<rect x="690" y="426" width="420" height="70" rx="6" fill="#f3e7c9" stroke="#c08a1e" stroke-width="2"/>
<text x="900" y="456" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">Susana</text>
<text x="900" y="480" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a5a2b" text-anchor="middle" font-weight="normal" font-style="italic">Capítulo 13 en las Biblias católicas</text>
<rect x="690" y="508" width="420" height="70" rx="6" fill="#f3e7c9" stroke="#c08a1e" stroke-width="2"/>
<text x="900" y="538" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="bold">Bel y el dragón</text>
<text x="900" y="562" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a5a2b" text-anchor="middle" font-weight="normal" font-style="italic">Capítulo 14 en las Biblias católicas</text>
<text x="600" y="725" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">En amarillo, lo que solo está en la versión griega. Jerónimo puso las de Ester al final del libro.</text>
</svg>