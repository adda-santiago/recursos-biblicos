<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Las adiciones griegas a Ester y Daniel</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Dónde aparecen en las Biblias católicas y ortodoxas</text>
<text x="300" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1f2430" text-anchor="middle" font-weight="bold">Ester</text>
<rect x="90" y="180" width="420" height="46" rx="6" fill="#f3e7c9" stroke="#c08a1e" stroke-width="2"/>
<circle cx="118" cy="203" r="15" fill="#c08a1e"/>
<text x="118" y="209" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">A</text>
<text x="144" y="201" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal">Sueño de Mardoqueo</text>
<text x="144" y="219" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a5a2b" text-anchor="start" font-weight="normal" font-style="italic">antes de 1:1</text>
<rect x="90" y="236" width="420" height="34" rx="6" fill="#fff" stroke="#c9c6be" stroke-width="2"/>
<text x="300" y="259" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">Capítulos 1–3 (texto hebreo)</text>
<rect x="90" y="280" width="420" height="46" rx="6" fill="#f3e7c9" stroke="#c08a1e" stroke-width="2"/>
<circle cx="118" cy="303" r="15" fill="#c08a1e"/>
<text x="118" y="309" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">B</text>
<text x="144" y="301" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal">Edicto de Amán</text>
<text x="144" y="319" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a5a2b" text-anchor="start" font-weight="normal" font-style="italic">tras 3:13</text>
<rect x="90" y="336" width="420" height="34" rx="6" fill="#fff" stroke="#c9c6be" stroke-width="2"/>
<text x="300" y="359" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">Capítulo 4 (texto hebreo)</text>
<rect x="90" y="380" width="420" height="46" rx="6" fill="#f3e7c9" stroke="#c08a1e" stroke-width="2"/>
<circle cx="118" cy="403" r="15" fill="#c08a1e"/>
<text x="118" y="409" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">C</text>
<text x="144" y="401" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal">Oraciones de Mardoqueo y Ester</text>
<text x="144" y="419" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a5a2b" text-anchor="start" font-weight="normal" font-style="italic">tras 4:17</text>
<rect x="90" y="436" width="420" height="46" rx="6" fill="#f3e7c9" stroke="#c08a1e" stroke-width="2"/>
<circle cx="118" cy="459" r="15" fill="#c08a1e"/>
<text x="118" y="465" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">D</text>
<text x="144" y="457" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal">Ester ante el rey</text>
<text x="144" y="475" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a5a2b" text-anchor="start" font-weight="normal" font-style="italic">en lugar de 5:1-2</text>
<rect x="90" y="492" width="420" height="34" rx="6" fill="#fff" stroke="#c9c6be" stroke-width="2"/>
<text x="300" y="515" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">Capítulos 5–8 (texto hebreo)</text>
<rect x="90" y="536" width="420" height="46" rx="6" fill="#f3e7c9" stroke="#c08a1e" stroke-width="2"/>
