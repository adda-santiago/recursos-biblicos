<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Las lenguas de la Biblia</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Dios hizo escribir su Palabra en tres lenguas</text>
<rect x="50" y="140" width="350" height="520" rx="14" fill="#f3e7c9"/>
<text x="225" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#c08a1e" text-anchor="middle" font-weight="bold">Hebreo</text>
<text x="225" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">בְּרֵאשִׁית</text>
<text x="225" y="312" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">bereshit, «en el</text>
<text x="225" y="333" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">principio» (Gn 1:1)</text>
<line x1="80" y1="365" x2="370" y2="365" stroke="#c08a1e" stroke-width="2" opacity=".5"/>
<circle cx="90" cy="408" r="6" fill="#c08a1e"/>
<text x="108" y="414" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal">Casi todo el Antiguo Testamento</text>
<circle cx="90" cy="464" r="6" fill="#c08a1e"/>
<text x="108" y="470" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal">Se escribe de derecha a izquierda</text>
<circle cx="90" cy="520" r="6" fill="#c08a1e"/>
<text x="108" y="526" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal">Antiguamente, solo consonantes</text>
<circle cx="90" cy="576" r="6" fill="#c08a1e"/>
<text x="108" y="582" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal">Lengua de Israel</text>
<rect x="425" y="140" width="350" height="520" rx="14" fill="#d6ece9"/>
<text x="600" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1e8a8a" text-anchor="middle" font-weight="bold">Arameo</text>
<text x="600" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">טַלְיְתָא קוּמִי</text>
<text x="600" y="312" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">talitá cumi, «niña,</text>
<text x="600" y="333" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">levántate» (Mr 5:41)</text>
<line x1="455" y1="365" x2="745" y2="365" stroke="#1e8a8a" stroke-width="2" opacity=".5"/>
<circle cx="465" cy="408" r="6" fill="#1e8a8a"/>
<text x="483" y="414" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal">Daniel 2:4–7:28 y partes de Esdras</text>
<circle cx="465" cy="464" r="6" fill="#1e8a8a"/>
<text x="483" y="470" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal">Jeremías 10:11 y palabras sueltas</text>
<circle cx="465" cy="520" r="6" fill="#1e8a8a"/>
<text x="483" y="526" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal">Lengua del imperio persa</text>
<circle cx="465" cy="576" r="6" fill="#1e8a8a"/>
<text x="483" y="582" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal">Lengua cotidiana de Jesús</text>
<rect x="800" y="140" width="350" height="520" rx="14" fill="#dde8f3"/>
<text x="975" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Griego</text>
<text x="975" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Ἐν ἀρχῇ ἦν ὁ λόγος</text>
<text x="975" y="312" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">en arjé en ho lógos, «en el</text>
<text x="975" y="333" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">principio era el Verbo» (Jn 1:1)</text>
<line x1="830" y1="365" x2="1120" y2="365" stroke="#2a6fb0" stroke-width="2" opacity=".5"/>
<circle cx="840" cy="408" r="6" fill="#2a6fb0"/>
<text x="858" y="414" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal">Todo el Nuevo Testamento</text>
<circle cx="840" cy="464" r="6" fill="#2a6fb0"/>
<text x="858" y="470" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal">Griego koiné, el griego común</text>
<circle cx="840" cy="520" r="6" fill="#2a6fb0"/>
<text x="858" y="526" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal">Lengua de todo el Mediterráneo</text>
<circle cx="840" cy="576" r="6" fill="#2a6fb0"/>
<text x="858" y="582" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal">También la Septuaginta</text>
<text x="600" y="715" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">El título de la cruz estaba «en hebreo, en griego y en latín» (Jn 19:20).</text>
</svg>