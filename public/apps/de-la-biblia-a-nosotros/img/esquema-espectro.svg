<text x="600" y="705" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">La posición de cada versión es aproximada: toda traducción combina ambas formas en distinta medida.</text>
