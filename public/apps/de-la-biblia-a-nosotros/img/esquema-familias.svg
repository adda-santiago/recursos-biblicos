<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Familias de manuscritos y ediciones impresas</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Cómo se agrupan los testigos del Nuevo Testamento</text>
<rect x="450" y="125" width="300" height="70" rx="14" fill="#1f2430"/>
<text x="600" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="normal">Escritos originales (siglo I)</text>
<line x1="600" y1="198" x2="200" y2="248" stroke="#2f7d4a" stroke-width="3" marker-end="url(#fl)"/>
<rect x="40" y="252" width="320" height="200" rx="14" fill="#fff" stroke="#2f7d4a" stroke-width="2"/>
<text x="200" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Alejandrina</text>
<text x="200" y="315" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Egipto</text>
<text x="200" y="352" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">P66, P75, P46</text>
<text x="200" y="378" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Vaticano, Sinaítico</text>
<text x="200" y="428" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">texto breve y sobrio</text>
<line x1="600" y1="198" x2="600" y2="248" stroke="#c08a1e" stroke-width="3" marker-end="url(#fl)"/>
<rect x="440" y="252" width="320" height="200" rx="14" fill="#fff" stroke="#c08a1e" stroke-width="2"/>
<text x="600" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#c08a1e" text-anchor="middle" font-weight="bold">Occidental</text>
<text x="600" y="315" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Roma, Galia, África</text>
<text x="600" y="352" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Códice de Beza</text>
<text x="600" y="378" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">latín antiguo</text>
<text x="600" y="428" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">paráfrasis y añadidos</text>
<line x1="600" y1="198" x2="1000" y2="248" stroke="#2a6fb0" stroke-width="3" marker-end="url(#fl)"/>
<rect x="840" y="252" width="320" height="200" rx="14" fill="#fff" stroke="#2a6fb0" stroke-width="2"/>
<text x="1000" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Bizantina</text>
<text x="1000" y="315" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Constantinopla</text>
<text x="1000" y="352" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Alejandrino (evangelios)</text>
<text x="1000" y="378" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">la mayoría tardía</text>
<text x="1000" y="428" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">texto pleno y armonizado</text>
<rect x="760" y="520" width="400" height="120" rx="14" fill="#dde8f3" stroke="#2a6fb0" stroke-width="2"/>
<text x="960" y="558" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Textus Receptus</text>
<text x="960" y="586" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">Erasmo 1516 → Estienne → Elzevir 1633</text>
<text x="960" y="612" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Reina-Valera, versión del rey Jacobo</text>
<line x1="1000" y1="455" x2="980" y2="515" stroke="#2a6fb0" stroke-width="3" marker-end="url(#fl)"/>
<rect x="40" y="520" width="600" height="120" rx="14" fill="#e3efe6" stroke="#2f7d4a" stroke-width="2"/>
<text x="340" y="558" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Texto crítico</text>
<text x="340" y="586" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">Westcott y Hort 1881 → Nestle-Aland</text>
<text x="340" y="612" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">compara todas las familias; da más peso a los testigos antiguos</text>
<line x1="200" y1="455" x2="240.0" y2="515" stroke="#2f7d4a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#fl)"/>
<line x1="600" y1="455" x2="340.0" y2="515" stroke="#2f7d4a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#fl)"/>
<line x1="1000" y1="455" x2="440.0" y2="515" stroke="#2f7d4a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#fl)"/>
<text x="600" y="705" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">Ambos textos coinciden en la inmensa mayoría de los versículos y en todas las doctrinas.</text>
</svg>