<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">De los escritos originales a tu Biblia</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">El camino de la Palabra escrita</text>
<rect x="45" y="200" width="160" height="200" rx="14" fill="#fff" stroke="#c08a1e" stroke-width="2"/>
<rect x="45" y="200" width="160" height="12" rx="6" fill="#c08a1e"/>
<text x="125" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#c08a1e" text-anchor="middle" font-weight="bold">Escritos</text>
<text x="125" y="296" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">originales</text>
<text x="125" y="350" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Moisés … Juan</text>
<line x1="208" y1="300" x2="232" y2="300" stroke="#c9c6be" stroke-width="4" marker-end="url(#fl)"/>
<rect x="235" y="200" width="160" height="200" rx="14" fill="#fff" stroke="#b03a2e" stroke-width="2"/>
<rect x="235" y="200" width="160" height="12" rx="6" fill="#b03a2e"/>
<text x="315" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#b03a2e" text-anchor="middle" font-weight="bold">Copias</text>
<text x="315" y="296" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">a mano</text>
<text x="315" y="350" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">durante siglos</text>
<line x1="398" y1="300" x2="422" y2="300" stroke="#c9c6be" stroke-width="4" marker-end="url(#fl)"/>
<rect x="425" y="200" width="160" height="200" rx="14" fill="#fff" stroke="#7a3fa0" stroke-width="2"/>
<rect x="425" y="200" width="160" height="12" rx="6" fill="#7a3fa0"/>
<text x="505" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#7a3fa0" text-anchor="middle" font-weight="bold">Manuscritos</text>
<text x="505" y="296" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">conservados</text>
<text x="505" y="350" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">papiros, rollos, códices</text>
<line x1="588" y1="300" x2="612" y2="300" stroke="#c9c6be" stroke-width="4" marker-end="url(#fl)"/>
<rect x="615" y="200" width="160" height="200" rx="14" fill="#fff" stroke="#1e8a8a" stroke-width="2"/>
<rect x="615" y="200" width="160" height="12" rx="6" fill="#1e8a8a"/>
<text x="695" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1e8a8a" text-anchor="middle" font-weight="bold">Comparación</text>
<text x="695" y="296" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">de los testigos</text>
<text x="695" y="350" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">crítica textual</text>
<line x1="778" y1="300" x2="802" y2="300" stroke="#c9c6be" stroke-width="4" marker-end="url(#fl)"/>
<rect x="805" y="200" width="160" height="200" rx="14" fill="#fff" stroke="#2a6fb0" stroke-width="2"/>
<rect x="805" y="200" width="160" height="12" rx="6" fill="#2a6fb0"/>
<text x="885" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#2a6fb0" text-anchor="middle" font-weight="bold">Texto</text>
<text x="885" y="296" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">hebreo y griego</text>
<text x="885" y="350" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">ediciones impresas</text>
<line x1="968" y1="300" x2="992" y2="300" stroke="#c9c6be" stroke-width="4" marker-end="url(#fl)"/>
<rect x="995" y="200" width="160" height="200" rx="14" fill="#fff" stroke="#2f7d4a" stroke-width="2"/>
<rect x="995" y="200" width="160" height="12" rx="6" fill="#2f7d4a"/>
<text x="1075" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Traducción</text>
<text x="1075" y="296" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">al español</text>
<text x="1075" y="350" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Reina-Valera y otras</text>
<path d="M1095,405 C1095,480 600,470 600,520" fill="none" stroke="#2f7d4a" stroke-width="4" marker-end="url(#fl)"/>
<rect x="440" y="525" width="320" height="90" rx="14" fill="#1f2430"/>
<text x="600" y="570" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#fff" text-anchor="middle" font-weight="normal">Tu Biblia</text>
<text x="600" y="598" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#e8e4da" text-anchor="middle" font-weight="normal">Palabra de Dios en tu lengua</text>
<text x="360" y="445" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#c08a1e" text-anchor="middle" font-weight="normal" font-style="italic">Dios inspiró los originales</text>
<text x="600" y="700" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">Los originales no se conservan; las copias fieles y las buenas traducciones transmiten lo que Dios dijo.</text>
</svg>