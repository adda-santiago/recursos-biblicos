<text x="626.8421052631579" y="395" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">200 d.C.</text>
<line x1="734.2105263157895" y1="352" x2="734.2105263157895" y2="368" stroke="#1f2430" stroke-width="2"/>
<text x="734.2105263157895" y="395" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">400 d.C.</text>
<line x1="841.578947368421" y1="352" x2="841.578947368421" y2="368" stroke="#1f2430" stroke-width="2"/>
<text x="841.578947368421" y="395" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">600 d.C.</text>
<line x1="948.9473684210526" y1="352" x2="948.9473684210526" y2="368" stroke="#1f2430" stroke-width="2"/>
<text x="948.9473684210526" y="395" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">800 d.C.</text>
<line x1="1056.3157894736842" y1="352" x2="1056.3157894736842" y2="368" stroke="#1f2430" stroke-width="2"/>
