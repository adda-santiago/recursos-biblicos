<circle cx="143.68421052631578" cy="360" r="12" fill="#c08a1e"/>
<line x1="143.68421052631578" y1="348" x2="143.68421052631578" y2="310" stroke="#c08a1e" stroke-width="2"/>
<text x="143.68421052631578" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#c08a1e" text-anchor="start" font-weight="bold">Isaías profetiza</text>
<text x="143.68421052631578" y="296" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">hacia 700 a.C.</text>
<circle cx="452.36842105263156" cy="360" r="12" fill="#2f7d4a"/>
<line x1="452.36842105263156" y1="348" x2="452.36842105263156" y2="230" stroke="#2f7d4a" stroke-width="2"/>
<text x="452.36842105263156" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Gran rollo de Isaías</text>
<text x="452.36842105263156" y="216" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">Qumrán, hacia 125 a.C.</text>
<circle cx="1018.7368421052632" cy="360" r="12" fill="#2a6fb0"/>
<line x1="1018.7368421052632" y1="348" x2="1018.7368421052632" y2="270" stroke="#2a6fb0" stroke-width="2"/>
<text x="1018.7368421052632" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#2a6fb0" text-anchor="end" font-weight="bold">Códice de Alepo</text>
<text x="1018.7368421052632" y="256" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="normal">la copia completa más antigua antes de 1947</text>
<path d="M452.36842105263156,430 L452.36842105263156,450 L1018.7368421052632,450 L1018.7368421052632,430" fill="none" stroke="#b03a2e" stroke-width="3"/>
<text x="735.5526315789474" y="485" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#b03a2e" text-anchor="middle" font-weight="bold">unos mil años de copias a mano</text>
<rect x="160" y="540" width="880" height="110" rx="14" fill="#fff" stroke="#c9c6be" stroke-width="2"/>
<text x="600" y="582" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="bold">Resultado de la comparación</text>
<text x="600" y="615" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Las dos copias coinciden en la inmensa mayoría de los versículos;</text>
<text x="600" y="638" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">las diferencias son sobre todo de ortografía.</text>
<text x="600" y="715" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">«La palabra del Dios nuestro permanece para siempre» (Is 40:8).</text>
</svg>