<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Cuántas copias y qué tan cercanas</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">El Nuevo Testamento comparado con otras obras antiguas (cifras aproximadas)</text>
<text x="470" y="150" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">Manuscritos conservados</text>
<text x="970" y="150" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">Distancia hasta la copia más antigua</text>
<text x="60" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="bold">Nuevo Testamento</text>
<text x="60" y="244" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal">griego, siglo I d.C.</text>
<rect x="320" y="202" width="320.0" height="40" rx="5" fill="#2a6fb0"/>
<text x="630.0" y="230" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#fff" text-anchor="end" font-weight="bold">más de 5.800</text>
<rect x="760" y="202" width="16.5" height="40" rx="5" fill="#2a6fb0" opacity=".55"/>
<text x="786.5" y="230" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">unos 50 años (P52)</text>
<text x="60" y="335" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="bold">Homero</text>
<text x="60" y="359" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal">Ilíada, siglo VIII a.C.</text>
<rect x="320" y="317" width="99.3103448275862" height="40" rx="5" fill="#c08a1e"/>
<text x="429.3103448275862" y="345" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="bold">unas 1.800</text>
<text x="760" y="345" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">siglos; casi todas medievales</text>
<text x="60" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="bold">César</text>
<text x="60" y="474" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal">Guerra de las Galias, siglo I a.C.</text>
<rect x="320" y="432" width="13.793103448275863" height="40" rx="5" fill="#4a4a4a"/>
<text x="343.7931034482759" y="460" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="bold">unas 250</text>
<rect x="760" y="432" width="297.0" height="40" rx="5" fill="#4a4a4a" opacity=".55"/>
<text x="1067.0" y="460" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">unos 900 años</text>
<text x="60" y="565" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="start" font-weight="bold">Tácito</text>
<text x="60" y="589" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="start" font-weight="normal">Anales 1–6, siglo II d.C.</text>
<rect x="320" y="547" width="4" height="40" rx="5" fill="#4a4a4a"/>
<text x="334" y="575" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="bold">1 manuscrito</text>
<rect x="760" y="547" width="247.5" height="40" rx="5" fill="#4a4a4a" opacity=".55"/>
<text x="1017.5" y="575" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">unos 750 años</text>
<text x="600" y="700" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">Más copias y más cercanas al original permiten reconocer con más seguridad lo que se escribió.</text>
</svg>