<text x="1005" y="541.5" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1f2430" text-anchor="middle" font-weight="bold">Verdad</text>
<text x="1005" y="563.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Jn 17:17</text>
<line x1="680" y1="615" x2="1080" y2="615" stroke="#2f7d4a" stroke-width="2" opacity=".5"/>
<text x="880" y="648" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2f7d4a" text-anchor="middle" font-weight="normal" font-style="italic">nos llaman a imitarle</text>
<text x="600" y="722" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">Cada atributo es Dios entero: su amor es santo, su justicia es amorosa, su poder es sabio.</text>
