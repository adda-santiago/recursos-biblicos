<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Los atributos de Dios</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Lo que solo Dios es, y lo que Dios forma en sus hijos</text>
<rect x="60" y="130" width="520" height="545" rx="14" fill="#ece3f2"/>
<text x="320" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#7a3fa0" text-anchor="middle" font-weight="bold">Solo Dios es…</text>
<text x="320" y="204" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">atributos incomunicables</text>
<rect x="100" y="290.5" width="210" height="66" rx="10" fill="#fff" stroke="#7a3fa0" stroke-width="2"/>
