<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Una salvación, tres personas</text>
<text x="600" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Efesios 1:3-14, un solo párrafo de alabanza en el texto griego</text>
<rect x="60" y="135" width="340" height="420" rx="14" fill="#f3e7c9"/>
<text x="230" y="185" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#c08a1e" text-anchor="middle" font-weight="bold">El Padre</text>
<text x="230" y="212" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">vv. 3-6</text>
<text x="230" y="255" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="bold">planea y elige</text>
<text x="230" y="300" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">nos bendijo</text>
<text x="230" y="332" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">nos escogió en Cristo</text>
<text x="230" y="364" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">antes de la fundación</text>
<text x="230" y="396" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">del mundo</text>
<text x="230" y="428" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">nos predestinó para ser</text>
<text x="230" y="460" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">adoptados hijos</text>
<line x1="230" y1="560" x2="230" y2="597" stroke="#c08a1e" stroke-width="4" stroke-linecap="round"/>
<polygon points="230,610 219,597 241,597" fill="#c08a1e"/>
<rect x="430" y="135" width="340" height="420" rx="14" fill="#f6dcd8"/>
<text x="600" y="185" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#b03a2e" text-anchor="middle" font-weight="bold">El Hijo</text>
<text x="600" y="212" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">vv. 7-12</text>
<text x="600" y="255" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="bold">redime y une</text>
<text x="600" y="300" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">en quien tenemos</text>
<text x="600" y="332" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">redención por su sangre</text>
<text x="600" y="364" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">el perdón de pecados</text>
<text x="600" y="396" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">en Él reunirá</text>
<text x="600" y="428" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">todas las cosas</text>
<text x="600" y="460" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">en Él tuvimos herencia</text>
<line x1="600" y1="560" x2="600" y2="597" stroke="#b03a2e" stroke-width="4" stroke-linecap="round"/>
<polygon points="600,610 589,597 611,597" fill="#b03a2e"/>
<rect x="800" y="135" width="340" height="420" rx="14" fill="#dde8f3"/>
<text x="970" y="185" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2a6fb0" text-anchor="middle" font-weight="bold">El Espíritu Santo</text>
<text x="970" y="212" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">vv. 13-14</text>
<text x="970" y="255" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="bold">sella y garantiza</text>
<text x="970" y="300" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">oímos la palabra</text>
<text x="970" y="332" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">de verdad y creímos</text>
<text x="970" y="364" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">fuimos sellados con</text>
<text x="970" y="396" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">el Espíritu de la promesa</text>
<text x="970" y="428" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">que es las arras</text>
<text x="970" y="460" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">de nuestra herencia</text>
<line x1="970" y1="560" x2="970" y2="597" stroke="#2a6fb0" stroke-width="4" stroke-linecap="round"/>
<polygon points="970,610 959,597 981,597" fill="#2a6fb0"/>
<rect x="60" y="615" width="1080" height="72" rx="14" fill="#1f2430"/>
<text x="600" y="659" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#fff" text-anchor="middle" font-weight="normal">«para alabanza de la gloria de su gracia» · «para alabanza de su gloria» (vv. 6, 12, 14)</text>
<text x="600" y="732" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">El Padre planea, el Hijo cumple y el Espíritu aplica: una sola obra del único Dios.</text>
</svg>