<text x="600" y="540" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal">Comienza en el templo con un sacerdote (1:9) y termina en el templo con los discípulos alabando (24:53).</text>
<text x="600" y="572" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">La parte más larga y más propia de Lucas es el viaje: casi diez capítulos «en el camino».</text>
