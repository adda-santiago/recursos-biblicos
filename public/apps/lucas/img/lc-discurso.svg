<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
<rect width="1200" height="620" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Lucas 21: dos horizontes</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">La destrucción de Jerusalén y la venida del Hijo del Hombre</text>
<line x1="110" y1="300" x2="1070" y2="300" stroke="#c9c6be" stroke-width="6"/>
<line x1="1050" y1="300" x2="1082.0" y2="300.0" stroke="#c9c6be" stroke-width="6"/>
<polygon points="1090,300 1077.1,305.5 1077.1,294.5" fill="#c9c6be"/>
<rect x="330" y="286" width="600" height="28" fill="#c08a1e" fill-opacity="0.35"/>
<text x="630.0" y="308" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">«los tiempos de los gentiles» (21:24)</text>
<circle cx="110" cy="300" r="14" fill="#ffffff" stroke="#1f2430" stroke-width="5"/>
<text x="130" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2430" text-anchor="start" font-weight="bold">Año 33</text>
<text x="130" y="236" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="start" font-weight="normal">Jesús habla en el templo</text>
<circle cx="330" cy="300" r="14" fill="#ffffff" stroke="#9e2b25" stroke-width="5"/>
<text x="330" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#9e2b25" text-anchor="middle" font-weight="bold">Año 70</text>
<text x="330" y="406" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">Jerusalén rodeada de ejércitos (21:20-24)</text>
<circle cx="930" cy="300" r="14" fill="#ffffff" stroke="#c08a1e" stroke-width="5"/>
<text x="930" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#c08a1e" text-anchor="middle" font-weight="bold">Señales en el cielo</text>
<text x="930" y="236" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="middle" font-weight="normal">angustia de las naciones (21:25-26)</text>
<circle cx="1090" cy="300" r="14" fill="#ffffff" stroke="#2f7d4a" stroke-width="5"/>
<text x="1080" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#2f7d4a" text-anchor="end" font-weight="bold">La venida</text>
<text x="1080" y="406" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="normal">en una nube con poder y gran gloria (21:27)</text>
<text x="600" y="500" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Jerusalén sería «hollada por los gentiles, hasta que los tiempos de los gentiles se cumplan» (Lc 21:24).</text>
<text x="600" y="530" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">Antes de la venida en gloria: la gran tribulación; antes de ella, el arrebatamiento de la iglesia (1 Ts 4:16-17).</text>
</svg>