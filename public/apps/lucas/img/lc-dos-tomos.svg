<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
<rect width="1200" height="720" fill="#f6f3ec"/>
<text x="600" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Lucas y Hechos: una obra en dos tomos</text>
<text x="600" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Los dos se encuentran en Jerusalén</text>
<rect x="60" y="140" width="470" height="470" rx="14" fill="#dcebdf" fill-opacity="1.0" stroke="#2f7d4a" stroke-width="2"/>
<text x="295" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Tomo 1: Lucas</text>
<text x="295" y="210" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">«lo que Jesús comenzó a hacer y a enseñar»</text>
<text x="295" y="260" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">El templo: Zacarías (1)</text>
<text x="295" y="312" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">Belén y Nazaret (2)</text>
<text x="295" y="364" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">Galilea (4–9)</text>
<text x="295" y="416" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">El viaje (9–19)</text>
<text x="295" y="468" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">Jerusalén: cruz y resurrección</text>
<text x="295" y="520" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">La ascensión (24:50-53)</text>
<line x1="295" y1="268" x2="295.0" y2="282.0" stroke="#2f7d4a" stroke-width="2"/>
<polygon points="295,290 289.5,277.1 300.5,277.1" fill="#2f7d4a"/>
<line x1="295" y1="320" x2="295.0" y2="334.0" stroke="#2f7d4a" stroke-width="2"/>
<polygon points="295,342 289.5,329.1 300.5,329.1" fill="#2f7d4a"/>
<line x1="295" y1="372" x2="295.0" y2="386.0" stroke="#2f7d4a" stroke-width="2"/>
<polygon points="295,394 289.5,381.1 300.5,381.1" fill="#2f7d4a"/>
<line x1="295" y1="424" x2="295.0" y2="438.0" stroke="#2f7d4a" stroke-width="2"/>
<polygon points="295,446 289.5,433.1 300.5,433.1" fill="#2f7d4a"/>
<line x1="295" y1="476" x2="295.0" y2="490.0" stroke="#2f7d4a" stroke-width="2"/>
<polygon points="295,498 289.5,485.1 300.5,485.1" fill="#2f7d4a"/>
<text x="295" y="580" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2f7d4a" text-anchor="middle" font-weight="bold">Movimiento: hacia Jerusalén</text>
<rect x="670" y="140" width="470" height="470" rx="14" fill="#f3e6c6" fill-opacity="1.0" stroke="#c08a1e" stroke-width="2"/>
<text x="905" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#c08a1e" text-anchor="middle" font-weight="bold">Tomo 2: Hechos</text>
<text x="905" y="210" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">lo que Jesús continúa por su Espíritu</text>
<text x="905" y="260" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">La ascensión (1:9-11)</text>
<text x="905" y="312" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">Pentecostés en Jerusalén (2)</text>
<text x="905" y="364" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">Judea y Samaria (8–12)</text>
<text x="905" y="416" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">Asia Menor y Europa (13–21)</text>
<text x="905" y="468" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">Preso hasta Roma (21–28)</text>
<text x="905" y="520" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="normal">Roma: «sin impedimento» (28:31)</text>
<line x1="905" y1="268" x2="905.0" y2="282.0" stroke="#c08a1e" stroke-width="2"/>
<polygon points="905,290 899.5,277.1 910.5,277.1" fill="#c08a1e"/>
<line x1="905" y1="320" x2="905.0" y2="334.0" stroke="#c08a1e" stroke-width="2"/>
<polygon points="905,342 899.5,329.1 910.5,329.1" fill="#c08a1e"/>
<line x1="905" y1="372" x2="905.0" y2="386.0" stroke="#c08a1e" stroke-width="2"/>
<polygon points="905,394 899.5,381.1 910.5,381.1" fill="#c08a1e"/>
<line x1="905" y1="424" x2="905.0" y2="438.0" stroke="#c08a1e" stroke-width="2"/>
<polygon points="905,446 899.5,433.1 910.5,433.1" fill="#c08a1e"/>
<line x1="905" y1="476" x2="905.0" y2="490.0" stroke="#c08a1e" stroke-width="2"/>
<polygon points="905,498 899.5,485.1 910.5,485.1" fill="#c08a1e"/>
<text x="905" y="580" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#c08a1e" text-anchor="middle" font-weight="bold">Movimiento: desde Jerusalén</text>
<rect x="470" y="300" width="260" height="130" rx="12" fill="#ffffff" fill-opacity="1.0" stroke="#9e2b25" stroke-width="2"/>
<text x="600" y="338" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#9e2b25" text-anchor="middle" font-weight="bold">Jerusalén</text>
<text x="600" y="368" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">La promesa del Padre</text>
<text x="600" y="392" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">Lc 24:49 · Hch 1:4-8</text>
<text x="600" y="416" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">poder desde lo alto</text>
<text x="600" y="670" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2430" text-anchor="middle" font-weight="normal">Ambos tomos están dedicados a Teófilo (Lc 1:3; Hch 1:1) y juntos son más de una cuarta parte del Nuevo Testamento.</text>
</svg>