<text x="600.0" y="705.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="normal">Hay traducción en curso en 4.457 lenguas. En el mundo se hablan más de 7.000.</text>
<text x="600.0" y="740.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">Las 544 lenguas que esperan las hablan unos 36,8 millones de personas.</text>
