<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860">
<rect width="1200" height="860" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600.0" y="64.0" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">Seis preguntas para discernir</text>
<text x="600.0" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">«Examinadlo todo; retened lo bueno» (1 Tesalonicenses 5:21)</text>
<rect x="90.0" y="150.0" width="500.0" height="160.0" rx="12" fill="#ffffff" stroke="#4f7d43" stroke-width="2.5"/>
<circle cx="142" cy="230" r="30" fill="#4f7d43"/>
<text x="142.0" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="190.0" y="222.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#4f7d43" text-anchor="start" font-weight="bold">¿Confiesa y exalta a Cristo?</text>
<text x="190.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="start" font-weight="normal">1 Jn 4:2-3; Jn 16:14</text>
<rect x="610.0" y="150.0" width="500.0" height="160.0" rx="12" fill="#ffffff" stroke="#3f6fa3" stroke-width="2.5"/>
<circle cx="662" cy="230" r="30" fill="#3f6fa3"/>
<text x="662.0" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="710.0" y="222.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#3f6fa3" text-anchor="start" font-weight="bold">¿Concuerda con toda la Escritura?</text>
<text x="710.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="start" font-weight="normal">Hch 17:11; Gá 1:8</text>
<rect x="90.0" y="350.0" width="500.0" height="160.0" rx="12" fill="#ffffff" stroke="#9e2b25" stroke-width="2.5"/>
<circle cx="142" cy="430" r="30" fill="#9e2b25"/>
<text x="142.0" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="190.0" y="422.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#9e2b25" text-anchor="start" font-weight="bold">¿Edifica a la iglesia?</text>
<text x="190.0" y="458.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="start" font-weight="normal">1 Co 14:12, 26</text>
<rect x="610.0" y="350.0" width="500.0" height="160.0" rx="12" fill="#ffffff" stroke="#1e7a7a" stroke-width="2.5"/>
<circle cx="662" cy="430" r="30" fill="#1e7a7a"/>
<text x="662.0" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="710.0" y="422.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1e7a7a" text-anchor="start" font-weight="bold">¿Produce el fruto del Espíritu?</text>
<text x="710.0" y="458.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="start" font-weight="normal">Mt 7:16; Gá 5:22-23</text>
<rect x="90.0" y="550.0" width="500.0" height="160.0" rx="12" fill="#ffffff" stroke="#6b4e7c" stroke-width="2.5"/>
<circle cx="142" cy="630" r="30" fill="#6b4e7c"/>
<text x="142.0" y="640.0" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="190.0" y="622.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6b4e7c" text-anchor="start" font-weight="bold">¿Se hace con orden y en amor?</text>
<text x="190.0" y="658.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="start" font-weight="normal">1 Co 13:1-3; 14:40</text>
<rect x="610.0" y="550.0" width="500.0" height="160.0" rx="12" fill="#ffffff" stroke="#a9772a" stroke-width="2.5"/>
<circle cx="662" cy="630" r="30" fill="#a9772a"/>
<text x="662.0" y="640.0" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
<text x="710.0" y="622.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#a9772a" text-anchor="start" font-weight="bold">¿Busca el bien de otros, no el dinero?</text>
<text x="710.0" y="658.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="start" font-weight="normal">1 P 5:2; 2 P 2:3</text>
<text x="600.0" y="790.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Las preguntas no apagan al Espíritu (1 Ts 5:19): protegen su obra de las imitaciones.</text>
</svg>