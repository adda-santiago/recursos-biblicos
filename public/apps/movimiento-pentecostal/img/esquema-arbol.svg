<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860">
<rect width="1200" height="860" fill="#f6f3ec"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="600.0" y="64.0" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#1f2430" text-anchor="middle" font-weight="normal">El árbol del movimiento pentecostal</text>
<text x="600.0" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7080" text-anchor="middle" font-weight="normal">De dónde viene y en qué ramas se dividió (simplificado)</text>
<rect x="60.0" y="140.0" width="230.0" height="76.0" rx="10" fill="#ffffff" stroke="#8a5a44" stroke-width="2.5"/>
<text x="175.0" y="171.3" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#8a5a44" text-anchor="middle" font-weight="bold">Wesley</text>
<text x="175.0" y="197.3" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">metodismo, desde 1738</text>
<rect x="360.0" y="140.0" width="280.0" height="76.0" rx="10" fill="#ffffff" stroke="#a9772a" stroke-width="2.5"/>
<text x="500.0" y="171.3" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#a9772a" text-anchor="middle" font-weight="bold">Movimiento de santidad</text>
<text x="500.0" y="197.3" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="normal">y sanidad divina, siglo XIX</text>
<rect x="400.0" y="250.0" width="200.0" height="64.0" rx="10" fill="#ffffff" stroke="#4f7d43" stroke-width="2.5"/>
<text x="500.0" y="275.4" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4f7d43" text-anchor="middle" font-weight="bold">Keswick</text>
<text x="500.0" y="300.4" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="normal">desde 1875</text>
<rect x="720.0" y="140.0" width="300.0" height="76.0" rx="10" fill="#9e2b25"/>
<text x="870.0" y="171.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold">Topeka (1901)</text>
<text x="870.0" y="198.2" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold">y calle Azusa (1906)</text>
<line x1="292.0" y1="178.0" x2="356.0" y2="178.0" stroke="#c9c6be" stroke-width="3" marker-end="url(#fl)"/>
<line x1="642.0" y1="178.0" x2="716.0" y2="178.0" stroke="#c9c6be" stroke-width="3" marker-end="url(#fl)"/>
<line x1="500.0" y1="218.0" x2="500.0" y2="248.0" stroke="#c9c6be" stroke-width="3" marker-end="url(#fl)"/>
<line x1="602.0" y1="282.0" x2="716.0" y2="200.0" stroke="#c9c6be" stroke-width="3" marker-end="url(#fl)"/>
<line x1="870.0" y1="218.0" x2="870.0" y2="350.0" stroke="#1f2430" stroke-width="3"/>
<line x1="870.0" y1="350.0" x2="170.0" y2="350.0" stroke="#1f2430" stroke-width="3"/>
<line x1="170.0" y1="350.0" x2="170.0" y2="774.0" stroke="#1f2430" stroke-width="3"/>
<text x="150.0" y="405.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="bold">Pentecostales</text>
<text x="150.0" y="425.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="bold">clásicos</text>
<text x="150.0" y="645.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="bold">Nuevas</text>
<text x="150.0" y="665.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080" text-anchor="end" font-weight="bold">olas</text>
<line x1="170.0" y1="400.0" x2="216.0" y2="400.0" stroke="#9e2b25" stroke-width="3" marker-end="url(#fl)"/>
<rect x="220.0" y="372.0" width="960.0" height="58.0" rx="8" fill="#ffffff" stroke="#9e2b25" stroke-width="2"/>
<text x="236.0" y="395.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#9e2b25" text-anchor="start" font-weight="bold">Santidad pentecostal: tres obras de gracia</text>
<text x="236.0" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">Iglesia de Dios (Cleveland), Iglesia de Dios en Cristo, Iglesia Pentecostal de Santidad</text>
<line x1="170.0" y1="472.0" x2="216.0" y2="472.0" stroke="#3f6fa3" stroke-width="3" marker-end="url(#fl)"/>
<rect x="220.0" y="444.0" width="960.0" height="58.0" rx="8" fill="#ffffff" stroke="#3f6fa3" stroke-width="2"/>
<text x="236.0" y="467.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#3f6fa3" text-anchor="start" font-weight="bold">Obra consumada: dos obras de gracia (1910)</text>
<text x="236.0" y="490.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">Asambleas de Dios (1914), Iglesia Cuadrangular (1927) y la mayoría de hoy</text>
<line x1="170.0" y1="544.0" x2="216.0" y2="544.0" stroke="#6b7080" stroke-width="3" marker-end="url(#fl)"/>
<rect x="220.0" y="516.0" width="960.0" height="58.0" rx="8" fill="#ffffff" stroke="#6b7080" stroke-width="2"/>
<text x="236.0" y="539.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#6b7080" text-anchor="start" font-weight="bold">Unicitarios (1913-1916)</text>
<text x="236.0" y="562.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">Niegan la Trinidad y bautizan solo en el nombre de Jesús; se separaron</text>
<line x1="170.0" y1="630.0" x2="216.0" y2="630.0" stroke="#6b4e7c" stroke-width="3" marker-end="url(#fl)"/>
<rect x="220.0" y="602.0" width="960.0" height="58.0" rx="8" fill="#ffffff" stroke="#6b4e7c" stroke-width="2"/>
<text x="236.0" y="625.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#6b4e7c" text-anchor="start" font-weight="bold">Renovación carismática (desde 1960)</text>
<text x="236.0" y="648.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">El Espíritu en iglesias protestantes históricas y en la católica (1967)</text>
<line x1="170.0" y1="702.0" x2="216.0" y2="702.0" stroke="#1e7a7a" stroke-width="3" marker-end="url(#fl)"/>
<rect x="220.0" y="674.0" width="960.0" height="58.0" rx="8" fill="#ffffff" stroke="#1e7a7a" stroke-width="2"/>
<text x="236.0" y="697.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e7a7a" text-anchor="start" font-weight="bold">Tercera ola (década de 1980)</text>
<text x="236.0" y="720.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">Evangélicos que oran por señales sin hablar de un segundo bautismo</text>
<line x1="170.0" y1="774.0" x2="216.0" y2="774.0" stroke="#a9772a" stroke-width="3" marker-end="url(#fl)"/>
<rect x="220.0" y="746.0" width="960.0" height="58.0" rx="8" fill="#ffffff" stroke="#a9772a" stroke-width="2"/>
<text x="236.0" y="769.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#a9772a" text-anchor="start" font-weight="bold">Neopentecostales e independientes (desde la década de 1970)</text>
<text x="236.0" y="792.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="normal">Megaiglesias y redes propias; en algunas, enseñanzas desviadas</text>
<text x="600.0" y="840.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">Las ramas se superponen: muchas iglesias toman rasgos de más de una.</text>
</svg>