<text x="600.0" y="790.0" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="normal" font-style="italic">Cada capa es una época. Al excavar de arriba hacia abajo, se retrocede en la historia.</text>
<text x="600.0" y="820.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal" font-style="italic">«y la redujo a un montón de escombros» (Josué 8:28): en hebreo, un tel.</text>
