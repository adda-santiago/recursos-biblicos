<text x="600.0" y="820.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7080" text-anchor="middle" font-weight="normal">Bajo unos 250 mm al año, el cultivo sin riego se vuelve muy difícil.</text>
